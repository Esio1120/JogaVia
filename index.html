<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF6EF">
<meta name="color-scheme" content="light">
<title>JogaVia — Fußball in Wien</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="apple-touch-icon" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root{
    color-scheme: light;
    --paper:#FAF6EF;
    --surface:#FFFFFF;
    --sand:#F3EDE2;
    --sand-deep:#EAE0CF;
    --ink:#2E2A24;
    --muted:#7B7165;
    --line:#E7DFD1;
    --line-strong:#D6C9B4;
    --accent:#4B7F5B;
    --accent-deep:#3B6748;
    --accent-soft:#E8F0E7;
    --clay:#A65A3A;
    --clay-soft:#F7EAE2;
    --shadow-s:0 1px 2px rgba(60,48,32,.06);
    --shadow-m:0 2px 6px rgba(60,48,32,.07), 0 14px 28px -20px rgba(60,48,32,.35);
    --display:"Fraunces",Georgia,"Times New Roman",serif;
    --ui:"Karla",system-ui,-apple-system,"Segoe UI",sans-serif;
    --r:14px;
    --top:58px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--ui);font-size:15.5px;line-height:1.5;
    -webkit-font-smoothing:antialiased;overscroll-behavior:none;
  }
  button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
  input,select{font-family:inherit;font-size:16px;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .label{font-size:12.5px;font-weight:600;letter-spacing:.04em;color:var(--muted)}

  header{
    position:fixed;top:0;left:0;right:0;height:var(--top);z-index:30;
    display:flex;align-items:center;gap:10px;padding:0 14px;
    background:var(--surface);border-bottom:1px solid var(--line);
  }
  .brand{
    display:flex;align-items:center;gap:9px;
    font-family:var(--display);font-weight:600;font-size:24px;line-height:1;letter-spacing:-.01em;user-select:none;
  }
  .brand .logo{width:27px;height:27px;display:block;flex:0 0 auto}
  .brand span{color:var(--accent)}
  .grow{flex:1}
  .ghost{
    background:var(--sand);border:1px solid var(--line-strong);color:var(--ink);
    border-radius:999px;padding:7px 14px;font-weight:600;font-size:13.5px;white-space:nowrap;
  }
  .ghost:hover{border-color:var(--accent);color:var(--accent-deep)}
  .avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid var(--accent-soft);display:block}
  .avatar-fallback{
    width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent-deep);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13.5px;flex:0 0 auto;
  }
  #accountBtn{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}

  #controls{
    position:fixed;top:var(--top);left:0;right:0;z-index:20;
    background:var(--surface);border-bottom:1px solid var(--line);
    padding:11px 14px 9px;display:flex;flex-direction:column;gap:9px;
  }
  #search{
    width:100%;padding:10px 13px;border:1px solid var(--line-strong);border-radius:11px;
    background:var(--paper);color:var(--ink);
  }
  #search::placeholder{color:var(--muted)}
  .chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);
    border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;white-space:nowrap;
    display:flex;align-items:center;gap:7px;
  }
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#FFFFFF}
  .chip .dot{width:9px;height:9px;border-radius:50%;background:currentColor;opacity:.9}
  select.chip{background:var(--surface);padding-right:10px}
  .statusline{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
  .linkish{background:none;border:0;color:var(--accent-deep);font-size:13px;font-weight:600;padding:0}
  .linkish:hover{text-decoration:underline;text-underline-offset:3px}

  main{position:absolute;top:0;bottom:0;left:0;right:0}
  #map{position:absolute;inset:0}
  #list{position:absolute;inset:0;overflow-y:auto;background:var(--paper);padding:12px 14px calc(96px + env(safe-area-inset-bottom))}
  .row{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:13px 15px;margin-bottom:9px;display:flex;gap:12px;align-items:flex-start;width:100%;
    text-align:left;box-shadow:var(--shadow-s);
  }
  .row:hover{border-color:var(--accent);box-shadow:var(--shadow-m)}
  .row .marker{width:11px;height:11px;border-radius:50%;flex:0 0 auto;margin-top:6px}
  .row h3{margin:0 0 2px;font-size:15.5px;font-weight:700;font-family:var(--display);letter-spacing:-.01em}
  .row p{margin:0;font-size:13.5px;color:var(--muted)}
  .row .count-badge{margin-left:auto;flex:0 0 auto}
  .empty{text-align:center;color:var(--muted);padding:36px 20px}

  .maplibregl-ctrl-attrib{font-size:10px;background:rgba(255,255,255,.8)}

  #sheet{
    position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));z-index:40;
    background:var(--surface);border-top:1px solid var(--line);
    border-radius:20px 20px 0 0;box-shadow:var(--shadow-m);
    padding:16px 18px calc(18px + env(safe-area-inset-bottom));
    transform:translateY(110%);transition:transform .22s ease;max-height:76vh;overflow-y:auto;
  }
  #sheet.open{transform:translateY(0)}
  @media (prefers-reduced-motion:reduce){#sheet{transition:none}}
  @media (min-width:760px){
    #sheet{left:auto;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));width:400px;border-radius:var(--r);border:1px solid var(--line)}
  }
  .sheet-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:11px}
  .sheet-head h2{margin:0;font-family:var(--display);font-size:22px;font-weight:600;line-height:1.2;flex:1;letter-spacing:-.01em}
  .closebtn{background:none;border:0;color:var(--muted);font-size:24px;line-height:1;padding:0 4px}
  .badges{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:13px}
  .badge{
    font-size:12px;font-weight:600;letter-spacing:.02em;
    padding:4px 10px;border-radius:999px;background:var(--sand);color:var(--muted);border:1px solid var(--line);
  }
  .badge.on{background:var(--accent-soft);color:var(--accent-deep);border-color:#CFE2CE}
  .badge.warn{background:var(--clay-soft);color:var(--clay);border-color:#EED9CC}
  .facts{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:14.5px}
  .facts th{text-align:left;font-weight:400;color:var(--muted);padding:6px 0}
  .facts td{text-align:right;padding:6px 0;font-weight:600}
  .section-label{
    font-family:var(--display);font-size:16px;font-weight:600;margin:4px 0 9px;letter-spacing:-.01em;
  }
  .muted-line{color:var(--muted);font-size:14px;margin:0 0 14px}
  .actions{display:flex;flex-direction:column;gap:9px}
  .btn{
    display:block;width:100%;text-align:center;text-decoration:none;
    background:var(--accent);color:#FFFFFF;border:0;border-radius:12px;
    padding:13px;font-weight:700;font-size:15.5px;
  }
  .btn:hover{background:var(--accent-deep)}
  .btn.secondary{background:var(--sand);color:var(--ink);border:1px solid var(--line-strong)}
  .btn.secondary:hover{background:var(--sand-deep)}
  .btn[disabled]{opacity:.55;cursor:not-allowed}
  .hint{font-size:12.5px;color:var(--muted);margin:10px 0 0;text-align:center}

  #pinbanner{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(74px + env(safe-area-inset-bottom));z-index:46;
    background:var(--ink);color:var(--paper);border-radius:13px;
    padding:11px 14px;display:flex;align-items:center;gap:12px;
    box-shadow:0 12px 28px -12px rgba(46,42,36,.65);
    max-width:min(460px, calc(100vw - 24px));
  }
  #pinbanner span{font-size:13.5px;font-weight:600;line-height:1.35}
  #pinbanner button{
    flex:0 0 auto;background:none;border:0;color:var(--paper);
    font-size:13px;font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:0;
  }
  .bilder{
    display:flex;gap:8px;overflow-x:auto;margin:12px 0 6px;padding-bottom:2px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .bilder::-webkit-scrollbar{height:0}
  .bild{
    position:relative;flex:0 0 auto;width:220px;height:140px;padding:0;
    border-radius:12px;overflow:hidden;background:var(--sand);border:1px solid var(--line);
  }
  .bild img{position:absolute;width:256px;height:256px;max-width:none;display:block}
  .bild.foto img{inset:0;width:100%;height:100%;object-fit:cover}
  .bild .marke{
    position:absolute;left:0;right:0;bottom:0;text-align:left;
    background:linear-gradient(rgba(46,42,36,0), rgba(46,42,36,.7));
    color:#FFFFFF;font-size:11px;font-weight:600;padding:16px 9px 6px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .bildzeile{display:flex;align-items:center;gap:10px;margin:0 0 4px}
  .bildzeile .quelle{font-size:11px;color:var(--muted);flex:1;min-width:0}
  .grossbild{
    position:relative;width:100%;height:240px;border-radius:14px;overflow:hidden;
    background:var(--sand);border:1px solid var(--line);margin:0 0 14px;
  }
  .grossbild img{position:absolute;width:256px;height:256px;max-width:none;display:block}
  .grossbild.foto img{inset:0;width:100%;height:100%;object-fit:contain;background:var(--ink)}
  .koordzeile{
    font-size:12.5px;color:var(--muted);background:var(--sand);
    border-radius:10px;padding:9px 11px;margin:0 0 14px;
  }

  .game{
    width:100%;display:flex;gap:12px;align-items:center;text-align:left;
    background:var(--paper);border:1px solid var(--line);border-radius:12px;
    padding:11px 13px;margin-bottom:8px;
  }
  .game:hover{border-color:var(--accent);background:var(--surface)}
  .game .when{flex:1;min-width:0}
  .game .when strong{display:block;font-size:14.5px;font-weight:700}
  .game .when span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .game .right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:0 0 auto}
  .pill{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sand);color:var(--muted);white-space:nowrap}
  .pill.ok{background:var(--accent-soft);color:var(--accent-deep)}
  .pill.warn{background:var(--clay-soft);color:var(--clay)}

  .squad{display:flex;flex-direction:column;gap:8px;margin:4px 0 16px}
  .player{display:flex;align-items:center;gap:10px;font-size:14.5px}
  .player .avatar,.player .avatar-fallback{width:30px;height:30px;font-size:12px}
  .player .who{flex:1;font-weight:600}
  .slotbar{height:8px;border-radius:999px;background:var(--sand-deep);overflow:hidden;margin:2px 0 14px}
  .slotbar span{display:block;height:100%;background:var(--accent)}
  .tinylink{background:none;border:0;color:var(--muted);font-size:12px;font-weight:600;padding:2px 4px;text-decoration:underline;text-underline-offset:2px}
  .tinylink:hover{color:var(--clay)}
  .chat{
    max-height:230px;overflow-y:auto;display:flex;flex-direction:column;gap:9px;
    margin:0 0 11px;padding:11px;background:var(--paper);border:1px solid var(--line);border-radius:12px;
  }
  .msg{display:flex;flex-direction:column;max-width:85%}
  .msg .meta{font-size:11.5px;color:var(--muted);margin-bottom:3px}
  .msg .bubble{background:var(--sand);border-radius:12px;padding:8px 12px;font-size:14.5px;line-height:1.4;word-break:break-word}
  .msg.own{align-self:flex-end;align-items:flex-end}
  .msg.own .bubble{background:var(--accent-soft)}
  .msg.wartet .bubble{opacity:.55}
  .chatform{display:flex;gap:8px;margin-bottom:14px}
  .chatform input{
    flex:1;padding:11px 13px;border:1px solid var(--line-strong);border-radius:11px;
    background:var(--paper);color:var(--ink);min-width:0;
  }
  .chatform button{
    flex:0 0 auto;background:var(--accent);color:#FFFFFF;border:0;border-radius:11px;
    padding:11px 16px;font-weight:700;font-size:14.5px;
  }

  .pinmark{display:flex;align-items:center;gap:6px;cursor:pointer}
  .pinmark img{width:30px;height:30px;display:block;flex:0 0 auto;filter:drop-shadow(0 2px 3px rgba(60,48,32,.4))}
  .pinname{
    background:var(--surface);border:1px solid var(--line-strong);border-radius:999px;
    padding:3px 10px;font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap;
    box-shadow:var(--shadow-s);max-width:180px;overflow:hidden;text-overflow:ellipsis;
  }
  .pinmark.mit-spiel .pinname{background:var(--accent);color:#FFFFFF;border-color:var(--accent)}

  #tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:45;
    background:var(--surface);border-top:1px solid var(--line);
    display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .tab{
    flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:6px 2px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.01em;
  }
  .tab svg{width:23px;height:23px;display:block}
  .tab[aria-current="true"]{color:var(--accent-deep)}
  .tab[aria-current="true"] svg{stroke:var(--accent-deep)}

  #feed{
    position:absolute;inset:0;overflow-y:auto;background:var(--paper);
    padding:14px 14px calc(96px + env(safe-area-inset-bottom));
  }
  .feedkopf{
    font-family:var(--display);font-size:24px;font-weight:600;letter-spacing:-.015em;
    margin:2px 0 4px;
  }
  .feedsub{color:var(--muted);font-size:14px;margin:0 0 16px}
  .tagkopf{
    font-family:var(--display);font-size:16px;font-weight:600;color:var(--accent-deep);
    margin:20px 0 9px;padding-bottom:5px;border-bottom:1px solid var(--line);
  }
  .tagkopf:first-of-type{margin-top:4px}
  .feedcard{
    display:block;width:100%;text-align:left;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;
    box-shadow:var(--shadow-s);
  }
  .feedcard:hover{border-color:var(--accent);box-shadow:var(--shadow-m)}
  .feedcard .zeit{font-size:13px;font-weight:700;color:var(--accent-deep);margin-bottom:3px}
  .feedcard h3{font-family:var(--display);font-size:18px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
  .feedcard .details{font-size:13.5px;color:var(--muted);margin:0 0 10px}
  .feedcard .reihe{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

  .suchzeile{display:flex;gap:8px;margin:0 0 16px}
  .suchzeile input{
    flex:1;padding:11px 13px;border:1px solid var(--line-strong);border-radius:11px;
    background:var(--surface);color:var(--ink);min-width:0;
  }
  .suchzeile button{
    flex:0 0 auto;background:var(--accent);color:#FFFFFF;border:0;border-radius:11px;
    padding:11px 16px;font-weight:700;font-size:14.5px;
  }
  .person{
    display:flex;align-items:center;gap:11px;background:var(--surface);
    border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px;
  }
  .person .wer{flex:1;min-width:0}
  .person .wer strong{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .person .wer span{display:block;font-size:12.5px;color:var(--muted)}
  .person .tuen{display:flex;gap:6px;flex:0 0 auto}
  .minibtn{
    background:var(--accent);color:#FFFFFF;border:0;border-radius:9px;
    padding:7px 12px;font-weight:700;font-size:12.5px;white-space:nowrap;
  }
  .minibtn.leise{background:var(--sand);color:var(--ink);border:1px solid var(--line-strong)}

  #modal{position:fixed;inset:0;z-index:50;background:rgba(46,42,36,.42);display:flex;align-items:flex-end;justify-content:center}
  @media (min-width:760px){#modal{align-items:center}}
  .panel{
    background:var(--surface);width:100%;max-width:460px;border-radius:20px 20px 0 0;
    padding:20px 20px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-m);
  }
  @media (min-width:760px){.panel{border-radius:var(--r);padding-bottom:22px}}
  .panel h2{font-family:var(--display);font-weight:600;font-size:25px;margin:0 0 5px;letter-spacing:-.015em;line-height:1.15}
  .panel .lead{margin:0 0 18px;color:var(--muted);font-size:14.5px}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px;letter-spacing:.02em}
  .field input,.field select{
    width:100%;padding:11px 13px;border:1px solid var(--line-strong);border-radius:11px;
    background:var(--paper);color:var(--ink);
  }
  .two{display:flex;gap:10px}
  .two > *{flex:1}
  .switcher{display:flex;gap:9px;margin-top:11px}
  .switcher button{flex:1}
  .err{background:var(--clay-soft);color:var(--clay);border:1px solid #EED9CC;border-radius:11px;padding:10px 13px;font-size:14px;margin-bottom:13px}
  .danger-link{background:none;border:0;color:var(--clay);font-size:13.5px;font-weight:600;padding:10px 0;width:100%}
  .quiet-link{background:none;border:0;color:var(--muted);font-size:13.5px;font-weight:600;padding:10px 0;width:100%}

  #toast{
    position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:60;
    background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:999px;
    font-size:13.5px;font-weight:600;box-shadow:var(--shadow-m);max-width:90vw;text-align:center;
  }
  [hidden]{display:none !important}
  .avatar-edit{display:flex;align-items:center;gap:14px;margin-bottom:16px}
  .avatar-edit img,.avatar-edit .avatar-fallback{width:60px;height:60px;font-size:21px}
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
      <path d="M32 3C19.8 3 10 12.5 10 24.2c0 15.6 19.6 34 20.4 34.8.9.9 2.3.9 3.2 0C34.4 58.2 54 39.8 54 24.2 54 12.5 44.2 3 32 3z" fill="#4B7F5B"/>
      <circle cx="32" cy="24" r="12.5" fill="#FAF6EF"/>
      <path d="M32 17.2l5.4 3.9-2.1 6.4h-6.6l-2.1-6.4z" fill="#4B7F5B"/>
      <g stroke="#4B7F5B" stroke-width="2.3" stroke-linecap="round" fill="none">
        <path d="M32 11.9v5.3"/><path d="M43.6 20.6l-5.1 1.6"/><path d="M39.3 34.4l-3.2-4.3"/>
        <path d="M24.7 34.4l3.2-4.3"/><path d="M20.4 20.6l5.1 1.6"/>
      </g>
    </svg>
    Joga<span>Via</span>
  </div>
  <div class="grow"></div>
  <button id="langBtn" class="ghost" type="button">EN</button>
  <button id="accountBtn" type="button"><span class="ghost">Anmelden</span></button>
</header>

<div id="controls">
  <input id="search" type="search" autocomplete="off">
  <div class="chips" id="artChips"></div>
  <div class="chips">
    <button class="chip" type="button" id="chipLit" aria-pressed="false"></button>
    <button class="chip" type="button" id="chipFree" aria-pressed="false"></button>
    <button class="chip" type="button" id="chipGames" aria-pressed="false"></button>
    <select id="district" class="chip"></select>
  </div>
  <div class="statusline">
    <span id="count"></span>
    <div class="grow"></div>
    <button class="linkish" id="myGamesBtn" type="button" hidden></button>
    <button class="linkish" id="viewToggle" type="button"></button>
    <button class="linkish" id="resetBtn" type="button"></button>
    <button class="linkish" id="meldenBtn" type="button"></button>
  </div>
</div>

<main>
  <div id="map"></div>
  <div id="list" hidden></div>
  <div id="feed"></div>
</main>

  var lang = "de";
  try { lang = localStorage.getItem("jogavia-lang") || (navigator.language || "de").slice(0,2); } catch(e){}
  if (lang !== "en") lang = "de";

  function t(key, n){
    var s = (STRINGS[lang] && STRINGS[lang][key]) || STRINGS.de[key] || key;
    if (n !== undefined) s = s.replace("{n}", String(n));
    return s;
  }

  var ARTS = ["kaefig","rasen","kunstrasen","halle","beach","sonstige"];
  var ARTCOLORS = {
    kaefig:"#4B7F5B", rasen:"#6E9C4F", kunstrasen:"#2F7F76",

    "Rudolfsheim-Fünfhaus","Ottakring","Hernals","Währing","Döbling","Brigittenau",
    "Floridsdorf","Donaustadt","Liesing"];

  function el(id){ return document.getElementById(id); }
  function clear(node){ while(node.firstChild) node.removeChild(node.firstChild); }
  function make(tag, cls, text){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }
  var toastTimer = null;
  function toast(msg){
    var box = el("toast");
    box.textContent = msg;
    box.hidden = false;
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ box.hidden = true; }, 2800);
  }
  function initials(name){
    var parts = String(name || "?").trim().split(" ").filter(Boolean);
    var s = parts[0] ? parts[0][0] : "?";
    if (parts.length > 1) s += parts[1][0];
    return s.toUpperCase();
  }
  function pad(n){ return (n < 10 ? "0" : "") + n; }
  function isoDate(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function fmtWhen(iso){
    var d = new Date(iso);
    var loc = lang === "de" ? "de-AT" : "en-GB";
    try {
      var day = new Intl.DateTimeFormat(loc, { weekday:"short", day:"numeric", month:"short", timeZone:"Europe/Vienna" }).format(d);
      var time = new Intl.DateTimeFormat(loc, { hour:"2-digit", minute:"2-digit", timeZone:"Europe/Vienna" }).format(d);
      return day + " · " + time;
    } catch(e){
      return d.toLocaleString();
    }
  }
  function money(cent){
    if (!cent) return t("noCost");
    var v = (cent / 100).toFixed(2);
    if (lang === "de") v = v.replace(".", ",");
    return v + " €";
  }

  function buildMap(){
    map = new maplibregl.Map({
      container: "map",
      style: {
        version: 8,
        sources: {
          basemap: {
            type: "raster",
            tiles: ["a","b","c","d"].map(function(s){
              return "https://" + s + ".basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}@2x.png";
            }),
            tileSize: 256,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>-Mitwirkende, &copy; <a href="https://carto.com/attributions">CARTO</a>'
          }
        },
        layers: [{ id: "basemap", type: "raster", source: "basemap" }]
      },
      center: [16.3738, 48.2082],
      zoom: 10.4,
      minZoom: 9,
      maxZoom: 19,
      attributionControl: true
    });
    map.on("error", function(e){ merkeFehler(e && e.error ? e.error : e); });
    map.addControl(new maplibregl.NavigationControl({ showCompass:false }), "bottom-right");
    geoControl = new maplibregl.GeolocateControl({
      positionOptions: { enableHighAccuracy: true },
      trackUserLocation: false,
      showAccuracyCircle: true,
      fitBoundsOptions: { maxZoom: 16 }
    });
    map.addControl(geoControl, "bottom-right");
    try {
      geoControl.on("geolocate", function(pos){
        standortSchonGeholt = true;
        try { localStorage.setItem("jogavia-geo", "1"); } catch(e){}
        try {
          if (pos && pos.coords){
            map.flyTo({
              center: [pos.coords.longitude, pos.coords.latitude],
              zoom: Math.max(map.getZoom(), 16.5),
              essential: true
            });
          }
        } catch(e){ merkeFehler(e); }
      });
      geoControl.on("error", function(e){ merkeFehler(e); });
    } catch(e){}

    map.on("load", function(){
      map.addSource("venues", {
        type: "geojson", data: toGeoJSON([]),
        cluster: true, clusterRadius: 46, clusterMaxZoom: 14,
        maxzoom: 20
      });
      map.addLayer({
        id: "clusters", type: "circle", source: "venues", filter: ["has","point_count"],
        paint: {
          "circle-color": "#4B7F5B",
          "circle-opacity": 0.85,
          "circle-radius": ["step", ["get","point_count"], 15, 5, 20, 20, 26, 60, 33],
          "circle-stroke-width": 2.5,
          "circle-stroke-color": "#FFFFFF"
        }
      });
      map.addLayer({
        id: "points", type: "circle", source: "venues", filter: ["!", ["has","point_count"]],
        paint: {
          "circle-color": ["match", ["get","art"],
            "kaefig", ARTCOLORS.kaefig, "rasen", ARTCOLORS.rasen, "kunstrasen", ARTCOLORS.kunstrasen,
            "halle", ARTCOLORS.halle, "beach", ARTCOLORS.beach, ARTCOLORS.sonstige],
          "circle-radius": ["interpolate", ["linear"], ["zoom"],
            10, ["case", ["==", ["get","spiel"], 1], 7.5, 4.5],
            14, ["case", ["==", ["get","spiel"], 1], 11, 7],
            17, ["case", ["==", ["get","spiel"], 1], 15, 11]],
          "circle-stroke-width": ["case", ["==", ["get","spiel"], 1], 3.5, 2],
          "circle-stroke-color": ["case", ["==", ["get","spiel"], 1], "#2E2A24", "#FFFFFF"]
        }
      });
      map.addLayer({
        id: "selected", type: "circle", source: "venues",
        filter: ["==", ["get","id"], -1],
        paint: {
          "circle-color": "rgba(0,0,0,0)",
          "circle-radius": ["interpolate", ["linear"], ["zoom"], 10, 11, 17, 22],
          "circle-stroke-width": 3,
          "circle-stroke-color": "#2E2A24"
        }
      });

      map.on("click", function(e){
        if (pinModus){
          pinModusAus();
          openModal(meldePanel("fehlt", null, [e.lngLat.lng, e.lngLat.lat]));
          return;
        }
        var r = 14;
        var box = [[e.point.x - r, e.point.y - r], [e.point.x + r, e.point.y + r]];
        var punkte = [];
        var cluster = [];
        try { punkte = map.queryRenderedFeatures(box, { layers:["points"] }); } catch(err){}
        try { cluster = map.queryRenderedFeatures(box, { layers:["clusters"] }); } catch(err){}
        if (punkte && punkte.length){
          var best = punkte[0];
          var minD = Infinity;
          punkte.forEach(function(f){
            var p = map.project(f.geometry.coordinates);
            var d = (p.x - e.point.x) * (p.x - e.point.x) + (p.y - e.point.y) * (p.y - e.point.y);
            if (d < minD){ minD = d; best = f; }
          });
          openSheet(Number(best.properties.id));
          return;
        }
        var besterPlatz = null;
        var minPixel = Infinity;
        filtered.forEach(function(v){
          try {
            var p = map.project([v.lon, v.lat]);
            var dx = p.x - e.point.x, dy = p.y - e.point.y;
            var d = dx * dx + dy * dy;
            if (d < minPixel){ minPixel = d; besterPlatz = v; }
          } catch(err){}
        });
        if (besterPlatz && minPixel <= 34 * 34 && map.getZoom() >= 13.5){
          openSheet(besterPlatz.id);
          return;
        }
        if (cluster && cluster.length){
          var c = cluster[0];
          var quelle = map.getSource("venues");
          var weiter = function(z){ map.easeTo({ center: c.geometry.coordinates, zoom: z }); };
          try {
            var erg = quelle.getClusterExpansionZoom(c.properties.cluster_id);
            if (erg && typeof erg.then === "function"){
              erg.then(weiter).catch(function(){ weiter(map.getZoom() + 2); });
            } else {
              weiter(map.getZoom() + 2);
            }
          } catch(err){
            weiter(map.getZoom() + 2);
          }
        }
      });
      ["clusters","points"].forEach(function(layer){
        map.on("mouseenter", layer, function(){ map.getCanvas().style.cursor = "pointer"; });
        map.on("mouseleave", layer, function(){ map.getCanvas().style.cursor = ""; });
      });

      map.on("moveend", updateMarkers);
      map.on("zoomend", updateMarkers);

      mapReady = true;
      pushToMap();
      if (ansicht === "karte") standortAutomatisch();
    });
  }

  function standortAutomatisch(){
    function ausloesen(){
      setTimeout(function(){
        try { if (geoControl) geoControl.trigger(); } catch(e){ merkeFehler(e); }
      }, 800);
    }
    var schonErlaubt = false;
    try { schonErlaubt = localStorage.getItem("jogavia-geo") === "1"; } catch(e){}

    if (navigator.permissions && navigator.permissions.query){
      navigator.permissions.query({ name: "geolocation" }).then(function(status){
        if (status.state === "granted") ausloesen();
        try {
          status.onchange = function(){ if (status.state === "granted") ausloesen(); };
        } catch(e){}
      }).catch(function(){ if (schonErlaubt) ausloesen(); });
    } else if (schonErlaubt){
      ausloesen();
    }
  }

  function updateMarkers(){
    if (!mapReady || !map) return;
    var nah = map.getZoom() >= MARKER_AB_ZOOM;
    try { map.setLayoutProperty("points", "visibility", nah ? "none" : "visible"); } catch(e){}

    marker.forEach(function(m){ try { m.remove(); } catch(e){} });
    marker = [];
    if (!nah) return;

    var b;
    try { b = map.getBounds(); } catch(e){ return; }
    var sichtbar = filtered.filter(function(v){
      return v.lon >= b.getWest() && v.lon <= b.getEast() &&
             v.lat >= b.getSouth() && v.lat <= b.getNorth();
    }).slice(0, 60);

    sichtbar.forEach(function(v){
      var wrap = make("div","pinmark");
      if (venuesWithGames[v.id]) wrap.classList.add("mit-spiel");
      var bild = document.createElement("img");
      bild.src = "logo.svg";
      bild.alt = "";
      wrap.appendChild(bild);
      wrap.appendChild(make("span","pinname", v.name));
      wrap.addEventListener("click", function(ev){
        ev.stopPropagation();
        openSheet(v.id);
      });
      try {
        marker.push(new maplibregl.Marker({ element: wrap, anchor: "bottom-left", offset: [-15, 2] })
          .setLngLat([v.lon, v.lat]).addTo(map));
      } catch(e){ merkeFehler(e); }
    });
  }

  function toGeoJSON(rows){
    return {
      type: "FeatureCollection",
      features: rows.map(function(v){
        return {
          type: "Feature",
          geometry: { type:"Point", coordinates:[v.lon, v.lat] },
          properties: { id: v.id, art: v.art, spiel: venuesWithGames[v.id] ? 1 : 0 }
        };
      })
    };
  }

  function pushToMap(){
    if (!mapReady || !map.getSource("venues")) return;
    map.getSource("venues").setData(toGeoJSON(filtered));
    map.setFilter("selected", ["==", ["get","id"], selectedId === null ? -1 : selectedId]);
    updateMarkers();
  }

  function districtName(nr){
    if (!nr || nr < 1 || nr > 23) return "";
    return nr + ". " + DISTRICTS[nr - 1];
  }

  function applyFilters(){
    var q = query.trim().toLowerCase();
    filtered = venues.filter(function(v){
      if (filterArt && v.art !== filterArt) return false;
      if (filterLit && v.beleuchtung !== true) return false;
      if (filterFree && v.zugang !== "frei") return false;
      if (filterGames && !venuesWithGames[v.id]) return false;
      if (filterDistrict && v.bezirk !== filterDistrict) return false;
      if (q){
        var hay = (v.name + " " + districtName(v.bezirk)).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
    var n = filtered.length;
    el("count").textContent = n === 0 ? t("countNone") : (n === 1 ? t("countOne") : t("countMany", n));
    pushToMap();
    if (listMode) renderList();
  }

  function renderList(){
    var box = el("list");
    clear(box);
    if (!filtered.length){ box.appendChild(make("p","empty", t("countNone"))); return; }
    filtered.slice(0, 300).forEach(function(v){
      var row = make("button","row");
      row.type = "button";
      var dot = make("span","marker");
      dot.style.background = ARTCOLORS[v.art] || ARTCOLORS.sonstige;
      var text = make("span");
      text.style.flex = "1";
      text.appendChild(make("h3", null, v.name));
      var meta = [t(v.art), districtName(v.bezirk)];
      if (v.beleuchtung === true) meta.push(t("lit"));
      text.appendChild(make("p", null, meta.filter(Boolean).join(" · ")));
      row.appendChild(dot);
      row.appendChild(text);
      if (venuesWithGames[v.id]){
        var p = make("span","pill ok count-badge", venuesWithGames[v.id] + "×");
        row.appendChild(p);
      }
      row.addEventListener("click", function(){ openSheet(v.id); });
      box.appendChild(row);
    });
    if (filtered.length > 300){
      box.appendChild(make("p","empty", "+ " + (filtered.length - 300)));
    }
  }

  function tagKopf(iso){
    var d = new Date(iso);
    var heute = new Date();
    var morgen = new Date(Date.now() + 86400000);
    function gleich(a, b){
      return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
    }
    if (gleich(d, heute)) return t("heute");
    if (gleich(d, morgen)) return t("morgen");
    try {
      return new Intl.DateTimeFormat(lang === "de" ? "de-AT" : "en-GB",
        { weekday: "long", day: "numeric", month: "long", timeZone: "Europe/Vienna" }).format(d);
    } catch(e){ return d.toLocaleDateString(); }
  }

  function uhrzeit(iso){
    try {
      return new Intl.DateTimeFormat(lang === "de" ? "de-AT" : "en-GB",
        { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Vienna" }).format(new Date(iso));
    } catch(e){ return ""; }
  }

  function feedKarte(g){
    var karte = make("button","feedcard");
    karte.type = "button";
    karte.appendChild(make("div","zeit", uhrzeit(g.beginn) + " Uhr"));
    karte.appendChild(make("h3", null, g.platz));
    var details = [g.format, g.dauer_min + " " + t("minutes"), districtName(g.bezirk),
                   t(LVLKEY[g.niveau] || "lvlFreizeit")];
    if (g.kosten_cent) details.push(money(g.kosten_cent));
    karte.appendChild(make("p","details", details.filter(Boolean).join(" · ")));

    var reihe = make("div","reihe");
    var frei = (g.plaetze_gesamt || 0) - (g.zugesagt || 0);
    var pille = make("span","pill", frei > 0 ? t("spotsFree", frei) : t("full"));
    pille.classList.add(frei > 0 ? "ok" : "warn");
    reihe.appendChild(pille);
    if (g.organisator) reihe.appendChild(make("span","pill", g.organisator));
    var mein = myPart[g.id];
    if (mein === "zugesagt") reihe.appendChild(make("span","pill ok", t("youAreIn")));
    else if (mein === "warteliste") reihe.appendChild(make("span","pill", t("waitlistLabel")));
    else if (session && g.organisator_id === session.user.id) reihe.appendChild(make("span","pill", t("organizedByYou")));
    karte.appendChild(reihe);

    karte.addEventListener("click", function(){ openModal(gamePanel(g.id)); });
    return karte;
  }

  function renderFeed(){
    var box = el("feed");
    clear(box);

    var meineAnsicht = (ansicht === "meine");
    var liste = games.filter(function(g){
      if (meineAnsicht){
        var teil = myPart[g.id];
        var orga = session && g.organisator_id === session.user.id;
        return orga || teil === "zugesagt" || teil === "warteliste";
      }
      if (nurFreiePlaetze && (g.plaetze_gesamt || 0) - (g.zugesagt || 0) <= 0) return false;
      return true;
    });

    box.appendChild(make("h2","feedkopf", meineAnsicht ? t("myGames") : t("feedTitel")));

    if (meineAnsicht && einladungen.length){
      box.appendChild(make("p","tagkopf", t("einladungen")));
      einladungen.forEach(function(e){
        var karte = make("div","feedcard");
        karte.appendChild(make("div","zeit", uhrzeit(e.beginn) + " Uhr · " + tagKopf(e.beginn)));
        karte.appendChild(make("h3", null, e.platz));
        karte.appendChild(make("p","details", e.format + " · " + t("einladungVon", e.von_name || "")));
        var reihe = make("div","reihe");
        var ja = make("button","minibtn", t("zusagen"));
        ja.type = "button";
        ja.addEventListener("click", function(){
          sb.rpc("spiel_beitreten", { p_match: e.match_id }).then(function(res){
            if (res.error){ toast(res.error.message); return; }
            sb.from("einladungen").delete().eq("id", e.id).then(function(){
              loadMyPart().then(loadEinladungen).then(loadGames).then(function(){
                toast(res.data === "warteliste" ? t("youAreWaiting") : t("youAreIn"));
                renderFeed();
              });
            });
          });
        });
        var weg = make("button","minibtn leise", t("einladungWeg"));
        weg.type = "button";
        weg.addEventListener("click", function(){
          sb.from("einladungen").delete().eq("id", e.id).then(function(){
            loadEinladungen().then(renderFeed);
          });
        });
        reihe.appendChild(ja);
        reihe.appendChild(weg);
        karte.appendChild(reihe);
        box.appendChild(karte);
      });
      box.appendChild(make("p","tagkopf", t("myGames")));
    }
    box.appendChild(make("p","feedsub",
      liste.length === 0 ? t("keineSpiele") : (liste.length === 1 ? t("spielAnzahl") : t("spieleAnzahl", liste.length))));

    if (!meineAnsicht){
      var chips = make("div","chips");
      chips.style.marginBottom = "6px";
      var alle = make("button","chip", t("alleSpiele"));
      alle.type = "button";
      alle.setAttribute("aria-pressed", nurFreiePlaetze ? "false" : "true");
      alle.addEventListener("click", function(){ nurFreiePlaetze = false; renderFeed(); });
      var frei = make("button","chip", t("nurFrei"));
      frei.type = "button";
      frei.setAttribute("aria-pressed", nurFreiePlaetze ? "true" : "false");
      frei.addEventListener("click", function(){ nurFreiePlaetze = true; renderFeed(); });
      chips.appendChild(alle);
      chips.appendChild(frei);
      box.appendChild(chips);
    }

    if (!liste.length){
      box.appendChild(make("p","muted-line", meineAnsicht ? t("meineLeer") : t("feedLeer")));
      if (!meineAnsicht){
        box.appendChild(make("p","muted-line", t("feedLeerHinweis")));
        var hin = make("button","btn", t("feedZurKarte"));
        hin.type = "button";
        hin.addEventListener("click", function(){ zeigeAnsicht("karte"); });
        box.appendChild(hin);
      }
      return;
    }

    var letzterTag = null;
    liste.forEach(function(g){
      var kopf = tagKopf(g.beginn);
      if (kopf !== letzterTag){
        box.appendChild(make("p","tagkopf", kopf));
        letzterTag = kopf;
      }
      box.appendChild(feedKarte(g));
    });
  }

  function dmPanel(freund){
    return function(panel){
      clear(panel);
      panel.appendChild(make("h2", null, freund.anzeigename || "—"));
      panel.appendChild(make("p","lead", [districtName(freund.bezirk),
        freund.niveau ? t(LVLKEY[freund.niveau] || "lvlFreizeit") : null].filter(Boolean).join(" · ")));

      var box = make("div","chat");
      panel.appendChild(box);
      var gesehen = {};
      var leer = null;
      var wartend = [];
      var letzteZeit = null;

      function eigeneSofort(text){
        if (leer){ box.removeChild(leer); leer = null; }
        var wrap = make("div","msg own wartet");
        var wann = "";
        try {
          wann = new Intl.DateTimeFormat(lang === "de" ? "de-AT" : "en-GB",
            { hour:"2-digit", minute:"2-digit", timeZone:"Europe/Vienna" }).format(new Date());
        } catch(e){}
        wrap.appendChild(make("div","meta", t("profile") + " · " + wann));
        wrap.appendChild(make("div","bubble", text));
        box.appendChild(wrap);
        box.scrollTop = box.scrollHeight;
        wartend.push({ text: text, el: wrap });
        return wrap;
      }

      function zeile(m){
        if (!m || gesehen[m.id]) return;
        gesehen[m.id] = true;
        if (!letzteZeit || m.gesendet_am > letzteZeit) letzteZeit = m.gesendet_am;
        var eigen = m.von_id === session.user.id;
        if (eigen){
          for (var w = 0; w < wartend.length; w++){
            if (wartend[w].text === m.text){
              wartend[w].el.className = "msg own";
              wartend.splice(w, 1);
              return;
            }
          }
        }
        if (leer){ box.removeChild(leer); leer = null; }
        var wrap = make("div", eigen ? "msg own" : "msg");
        var wann = "";
        try {
          wann = new Intl.DateTimeFormat(lang === "de" ? "de-AT" : "en-GB",
            { hour:"2-digit", minute:"2-digit", timeZone:"Europe/Vienna" }).format(new Date(m.gesendet_am));
        } catch(e){}
        wrap.appendChild(make("div","meta", (eigen ? t("profile") : (freund.anzeigename || "")) + " · " + wann));
        wrap.appendChild(make("div","bubble", m.text));
        box.appendChild(wrap);
        box.scrollTop = box.scrollHeight;
      }

      function nachladen(erstesMal){
        var q = sb.from("direct_messages").select("id,von_id,an_id,text,gesendet_am")
          .or("and(von_id.eq." + session.user.id + ",an_id.eq." + freund.partner_id + ")," +
              "and(von_id.eq." + freund.partner_id + ",an_id.eq." + session.user.id + ")");
        if (!erstesMal && letzteZeit) q = q.gte("gesendet_am", letzteZeit);
        return q.order("gesendet_am").limit(100)
          .then(function(res){
            var rows = res.data || [];
            if (erstesMal && !rows.length){ leer = make("p","muted-line", t("dmLeer")); box.appendChild(leer); return; }
            rows.forEach(zeile);
          }).catch(function(){});
      }
      nachladen(true);

      var form = make("div","chatform");
      var feld = input("dm-input","text", t("dmPlatzhalter"));
      feld.maxLength = 1000;
      var senden = make("button", null, t("send"));
      senden.type = "button";
      function abschicken(){
        var text = feld.value.trim();
        if (!text) return;
        feld.value = "";
        var vorschau = eigeneSofort(text);
        sb.from("direct_messages").insert({ von_id: session.user.id, an_id: freund.partner_id, text: text })
          .then(function(res){
            if (res.error){
              toast(res.error.message);
              if (vorschau && vorschau.parentNode) vorschau.parentNode.removeChild(vorschau);
              wartend = wartend.filter(function(x){ return x.el !== vorschau; });
              feld.value = text;
              return;
            }
            nachladen(false);
          });
      }
      senden.addEventListener("click", abschicken);
      feld.addEventListener("keydown", function(e){ if (e.key === "Enter") abschicken(); });
      form.appendChild(feld);
      form.appendChild(senden);
      panel.appendChild(form);

      var einladenKnopf = make("button","btn secondary", t("einladen"));
      einladenKnopf.type = "button";
      einladenKnopf.addEventListener("click", function(){ stopDm(); openModal(einladenPanel(freund)); });
      panel.appendChild(einladenKnopf);

      var raus = make("button","danger-link", t("freundEntfernen"));
      raus.type = "button";
      raus.addEventListener("click", function(){ stopDm(); closeModal(); freundEntfernen(freund.id); });
      panel.appendChild(raus);

      var zu = make("button","quiet-link", t("cancel"));
      zu.type = "button";
      zu.addEventListener("click", function(){ stopDm(); closeModal(); });
      panel.appendChild(zu);

      stopDm();
      try {
        dmChannel = sb.channel("dm-" + freund.partner_id)
          .on("postgres_changes",
              { event: "INSERT", schema: "public", table: "direct_messages", filter: "an_id=eq." + session.user.id },
              function(payload){
                var m = payload && payload.new;
                if (m && m.von_id === freund.partner_id) zeile(m);
              })
          .subscribe();
      } catch(e){}

      dmTimer = setInterval(function(){
        if (el("modal").hidden){ stopDm(); return; }
        if (document.hidden) return;
        nachladen(false);
      }, 1800);
    };
  }

  var LUFT_WIEN = "https://maps.wien.gv.at/wmts/lb/farbe/google3857/";
  var LUFT_AT = "https://mapsneu.wien.gv.at/basemap/bmaporthofoto30cm/normal/google3857/";

  function luftbildKacheln(box, lat, lon, z, w, h){
    var TS = 256, n = Math.pow(2, z);
    var wx = (lon + 180) / 360 * n * TS;
    var s = Math.sin(lat * Math.PI / 180);
    var wy = (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * n * TS;
    var links = wx - w / 2, oben = wy - h / 2;
    var x0 = Math.floor(links / TS), x1 = Math.floor((links + w - 1) / TS);
    var y0 = Math.floor(oben / TS), y1 = Math.floor((oben + h - 1) / TS);
    for (var x = x0; x <= x1; x++){
      for (var y = y0; y <= y1; y++){
        var img = document.createElement("img");
        img.alt = ""; img.loading = "lazy";
        img.style.left = Math.round(x * TS - links) + "px";
        img.style.top = Math.round(y * TS - oben) + "px";
        img.setAttribute("data-zweit", LUFT_AT + z + "/" + y + "/" + x + ".jpeg");
        img.addEventListener("error", function(){
          var u = this.getAttribute("data-zweit");
          if (u){ this.setAttribute("data-zweit", ""); this.src = u; }
        });
        img.src = LUFT_WIEN + z + "/" + y + "/" + x + ".jpeg";
        box.appendChild(img);
      }
    }
  }

  function fotoHochladen(datei){
    var v = selectedVenue;
    if (!v || !datei || !session) return;
    if (datei.size > 5 * 1024 * 1024){ toast(t("fotoZuGross")); return; }
    toast(t("fotoHochladen"));
    var ext = (datei.name.split(".").pop() || "jpg").toLowerCase();
    if (["jpg","jpeg","png","webp"].indexOf(ext) === -1) ext = "jpg";
    var pfad = session.user.id + "/" + v.id + "-" + Date.now() + "." + ext;
    sb.storage.from("venues").upload(pfad, datei).then(function(res){
      if (res.error){ toast(res.error.message); return; }
      sb.from("venue_fotos").insert({ venue_id: v.id, user_id: session.user.id, pfad: pfad })
        .then(function(r2){
          if (r2.error){
            toast(r2.error.code === "42501" ? t("fotoZuViele") : r2.error.message);
            sb.storage.from("venues").remove([pfad]);
            return;
          }
          toast(t("fotoDa"));
          ladeFotos(v.id).then(function(){ if (selectedId === v.id) renderBilder(v); });
        });
    });
  }

    if (v.zugang === "frei") badges.appendChild(make("span","badge on", t("accessFrei")));
    if (v.zugang === "verein") badges.appendChild(make("span","badge warn", t("accessVerein")));
    if (v.zugang === "buchung") badges.appendChild(make("span","badge warn", t("accessBuchung")));
    if (v.zugang === "unbekannt") badges.appendChild(make("span","badge", t("accessUnbekannt")));

    clear(facts);

      tr.appendChild(make("th", null, label));
      tr.appendChild(make("td", null, value));
      facts.appendChild(tr);
    }

    addFact(t("lighting"), v.beleuchtung === true ? t("yes") : (v.beleuchtung === false ? t("no") : t("unknown")));
    addFact(t("access"), zugangText(v.zugang));
    addFact(t("checked"), v.geprueft ? t("yes") : t("no"));

      .then(function(){ return ladeParkfotos(v.id); })

  function authPanel(mode){
    return function(panel){
      clear(panel);
      panel.appendChild(make("h2", null, mode === "register" ? t("registerTitle") : t("loginTitle")));
      panel.appendChild(make("p","lead", mode === "register" ? t("registerLead") : t("loginLead")));
      var msg = make("div","err"); msg.hidden = true; panel.appendChild(msg);

      var nameIn = null, yearIn = null;
      if (mode === "register"){
        nameIn = input("f-name","text","");
        nameIn.maxLength = 40;
        nameIn.autocomplete = "nickname";
        panel.appendChild(field(t("displayName"), nameIn));
        yearIn = input("f-year","number", t("birthHint"));
        yearIn.min = "1930";
        yearIn.max = String(new Date().getFullYear());
        panel.appendChild(field(t("birthYear"), yearIn));
      }

      var mail = input("f-mail","email","name@beispiel.at");
      mail.autocomplete = "email";
      var pass = input("f-pass","password", mode === "register" ? t("passwordHint") : "");
      pass.autocomplete = mode === "register" ? "new-password" : "current-password";
      panel.appendChild(field(t("email"), mail));
      panel.appendChild(field(t("password"), pass));

      if (mode === "register") panel.appendChild(make("p","hint", t("whyData")));

      var go = make("button","btn", mode === "register" ? t("createAccount") : t("doLogin"));
      go.type = "button";
      go.addEventListener("click", function(){
        msg.hidden = true;
        var jahr = null;
        if (mode === "register"){
          if (nameIn.value.trim().length < 2){ msg.textContent = t("needName"); msg.hidden = false; return; }
          jahr = parseInt(yearIn.value, 10);
          if (!jahr || jahr < 1930 || jahr > new Date().getFullYear()){
            msg.textContent = t("needYear"); msg.hidden = false; return;
          }
          if (new Date().getFullYear() - jahr < 14){
            msg.textContent = t("minAge"); msg.hidden = false; return;
          }
        }
        go.disabled = true;
        var call = mode === "register"
          ? sb.auth.signUp({
              email: mail.value.trim(),
              password: pass.value,
              options: {
                emailRedirectTo: BESTAETIGT_URL,
                data: { anzeigename: nameIn.value.trim(), geburtsjahr: jahr }
              }
            })
          : sb.auth.signInWithPassword({ email: mail.value.trim(), password: pass.value });
        call.then(function(res){
          go.disabled = false;
          if (res.error){ msg.textContent = res.error.message; msg.hidden = false; return; }
          if (!res.data.session){
            clear(panel);
            panel.appendChild(make("h2", null, t("mailSentTitle")));
            panel.appendChild(make("p","lead", t("mailSentLead")));
            var ok = make("button","btn", t("cancel"));
            ok.type = "button";
            ok.addEventListener("click", forceCloseModal);
            panel.appendChild(ok);
            return;
          }
          if (mode === "register"){
            profile = null;
            openModal(profilePanel(true), true);
          } else {
            closeModal();
          }
        }).catch(function(e){
          go.disabled = false; msg.textContent = String(e); msg.hidden = false;
        });
      });
      panel.appendChild(go);

      if (mode !== "register"){
        var vergessen = make("button","quiet-link", t("pwVergessen"));
        vergessen.type = "button";
        vergessen.addEventListener("click", function(){ openModal(pwResetPanel(mail.value.trim())); });
        panel.appendChild(vergessen);
      }

      var sw = make("div","switcher");
      var other = make("button","btn secondary", mode === "register" ? t("haveAccount") : t("noAccount"));
      other.type = "button";
      other.addEventListener("click", function(){ openModal(authPanel(mode === "register" ? "login" : "register")); });
      sw.appendChild(other);
      panel.appendChild(sw);

      var quit = make("button","quiet-link", t("cancel"));
      quit.type = "button";
      quit.addEventListener("click", closeModal);
      panel.appendChild(quit);
    };
  }

              toast(r.data || t("modFertig"));

          reihe.appendChild(modKnopf(t("modUebernehmen"), false, function(){
            sb.rpc("mod_platz_uebernehmen", { p_id: p.id }).then(function(r){
              if (r.error){ toast(r.error.message); return; }
              toast(r.data || t("modFertig"));

              ladeModeration().then(zeichne);

  function chatBlock(panel, id, darfSchreiben){
    panel.appendChild(make("p","section-label", t("chat")));
    if (!darfSchreiben){
      panel.appendChild(make("p","muted-line", t("chatOnlyForSquad")));
      return;
    }
    var box = make("div","chat");
    panel.appendChild(box);
    var gesehen = {};
    var leerHinweis = null;
    var wartend = [];
    var letzteZeit = null;

    function eigeneSofort(text){
      if (leerHinweis){ box.removeChild(leerHinweis); leerHinweis = null; }
      var wrap = make("div","msg own wartet");
      var wann = "";
      try {
        wann = new Intl.DateTimeFormat(lang === "de" ? "de-AT" : "en-GB",
          { hour:"2-digit", minute:"2-digit", timeZone:"Europe/Vienna" }).format(new Date());
      } catch(e){}
      wrap.appendChild(make("div","meta", ((profile && profile.anzeigename) || "—") + " · " + wann));
      wrap.appendChild(make("div","bubble", text));
      box.appendChild(wrap);
      box.scrollTop = box.scrollHeight;
      wartend.push({ text: text, el: wrap });
      return wrap;
    }

    function zeile(m){
      if (!m || gesehen[m.id]) return;
      if (blockedSet[m.user_id]) return;
      gesehen[m.id] = true;
      if (!letzteZeit || m.gesendet_am > letzteZeit) letzteZeit = m.gesendet_am;
      var eigen = session && m.user_id === session.user.id;
      if (eigen){
        for (var w = 0; w < wartend.length; w++){
          if (wartend[w].text === m.text){
            wartend[w].el.className = "msg own";
            wartend.splice(w, 1);
            return;
          }
        }
      }
      if (leerHinweis){ box.removeChild(leerHinweis); leerHinweis = null; }
      var wrap = make("div", eigen ? "msg own" : "msg");
      var wann = "";
      try {
        wann = new Intl.DateTimeFormat(lang === "de" ? "de-AT" : "en-GB",
          { hour:"2-digit", minute:"2-digit", timeZone:"Europe/Vienna" }).format(new Date(m.gesendet_am));
      } catch(e){}
      wrap.appendChild(make("div","meta", (m.anzeigename || "—") + " · " + wann));
      wrap.appendChild(make("div","bubble", m.text));
      if (!eigen && session){
        var mel = make("button","tinylink", t("reportBtn"));
        mel.type = "button";
        mel.addEventListener("click", function(){
          stopChat();
          openModal(reportPanel("nachricht", m.id, gamePanel(id)));
        });
        wrap.appendChild(mel);
      }
      box.appendChild(wrap);
      box.scrollTop = box.scrollHeight;
    }

    function nachladen(erstesMal){
      var q = sb.from("chat_public").select("id,user_id,text,gesendet_am,anzeigename")
        .eq("match_id", id);
      if (!erstesMal && letzteZeit) q = q.gte("gesendet_am", letzteZeit);
      return q.order("gesendet_am").limit(100)
        .then(function(res){
          var rows = res.data || [];
          if (erstesMal && !rows.length){
            leerHinweis = make("p","muted-line", t("noMessages"));
            box.appendChild(leerHinweis);
            return;
          }
          rows.forEach(zeile);
        }).catch(function(){});
    }
    nachladen(true);

    var form = make("div","chatform");
    var feld = input("chat-input","text", t("chatPlaceholder"));
    feld.maxLength = 1000;
    var senden = make("button", null, t("send"));
    senden.type = "button";
    function abschicken(){
      var text = feld.value.trim();
      if (!text) return;
      feld.value = "";
      var vorschau = eigeneSofort(text);
      sb.from("messages").insert({ match_id: id, user_id: session.user.id, text: text }).then(function(res){
        if (res.error){
          toast(res.error.message);
          if (vorschau && vorschau.parentNode) vorschau.parentNode.removeChild(vorschau);
          wartend = wartend.filter(function(x){ return x.el !== vorschau; });
          feld.value = text;
          return;
        }
        nachladen(false);
      });
    }
    senden.addEventListener("click", abschicken);
    feld.addEventListener("keydown", function(e){ if (e.key === "Enter") abschicken(); });
    form.appendChild(feld);
    form.appendChild(senden);
    panel.appendChild(form);

    stopChat();
    try {
      chatChannel = sb.channel("chat-" + id)
        .on("postgres_changes",
            { event: "INSERT", schema: "public", table: "messages", filter: "match_id=eq." + id },
            function(payload){
              var m = payload && payload.new;
              if (!m) return;
              if (session && m.user_id === session.user.id) return;
              sb.from("chat_public").select("id,user_id,text,gesendet_am,anzeigename")
                .eq("id", m.id).maybeSingle()
                .then(function(r){ if (r.data) zeile(r.data); });
            })
        .subscribe();
    } catch(e){}

    chatTimer = setInterval(function(){
      if (el("modal").hidden){ stopChat(); return; }
      if (document.hidden) return;
      nachladen(false);
    }, 1800);
  }

  function spielLink(g){ return APP_URL + "?spiel=" + g.id; }

  function spielTeilen(g){
    var url = spielLink(g);
    var text = g.platz + " · " + fmtWhen(g.beginn) + " · " + g.format;
    if (navigator.share){
      navigator.share({ title: "JogaVia", text: text, url: url }).catch(function(){});
      return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(function(){ toast(t("linkKopiert")); })
        .catch(function(){ window.prompt(t("teilenBtn"), url); });
      return;
    }
    window.prompt(t("teilenBtn"), url);
  }

  function zweiStellen(n){ return (n < 10 ? "0" : "") + n; }

  function editPanel(id){

        {value:"11v11",label:"11 vs 11"}
      ], g.format);

      var two2 = make("div","two");

      two2.appendChild(field(t("slotsL"), slotsIn));

        {value:"120",label:"120 " + t("minutes")}
      ], String(g.dauer_min || 90));
      var lvlSel = select("e-lvl", levelOptions(), g.niveau || "freizeit");
      var two3 = make("div","two");
      two3.appendChild(field(t("durationL"), durSel));
      two3.appendChild(field(t("levelL"), lvlSel));
      panel.appendChild(two3);

      var costIn = input("e-cost","number","0");
      costIn.value = String((g.kosten_cent || 0) / 100); costIn.min = "0"; costIn.step = "0.5";
      panel.appendChild(field(t("costL"), costIn));

      var noteIn = input("e-note","text", t("notePlaceholder"));
      noteIn.maxLength = 200;
      noteIn.value = g.notiz || "";
      panel.appendChild(field(t("noteL"), noteIn));

      var go = make("button","btn", t("save"));
      go.type = "button";
      go.addEventListener("click", function(){
        var beginn = new Date(dateIn.value + "T" + timeIn.value + ":00");
        if (isNaN(beginn.getTime())){ msg.textContent = t("timeInPast"); msg.hidden = false; return; }
        if (beginn.getTime() > Date.now() + 60 * 86400000){
          msg.textContent = t("tooFar"); msg.hidden = false; return;
        }
        go.disabled = true;
        sb.rpc("spiel_aendern", {
          p_match: id,
          p_beginn: beginn.toISOString(),
          p_dauer: Number(durSel.value),
          p_format: fmtSel.value,
          p_plaetze: Math.max(2, Number(slotsIn.value) || 10),
          p_niveau: lvlSel.value,
          p_kosten: Math.round((Number(costIn.value) || 0) * 100),
          p_notiz: noteIn.value.trim() || null
        }).then(function(res){
          go.disabled = false;
          if (res.error){ msg.textContent = res.error.message; msg.hidden = false; return; }
          toast(res.data > 0 ? t("nachgerueckt", res.data) : t("spielGespeichert"));
          loadMyPart().then(loadGames).then(function(){ openModal(gamePanel(id)); });
        });

      zurueck.type = "button";
      zurueck.addEventListener("click", function(){ openModal(gamePanel(id)); });
      panel.appendChild(zurueck);
    };
  }

  function gamePanel(id){
    return function(panel){
      var g = games.filter(function(x){ return x.id === id; })[0];
      clear(panel);
      if (!g){ panel.appendChild(make("p","lead", t("cancelled"))); return; }

      panel.appendChild(make("h2", null, g.platz));
      panel.appendChild(make("p","lead", fmtWhen(g.beginn) + " · " + g.format + " · " + g.dauer_min + " " + t("minutes")));
      var msg = make("div","err"); msg.hidden = true; panel.appendChild(msg);

      var belegt = g.zugesagt || 0;
      var gesamt = g.plaetze_gesamt || 0;
      var frei = Math.max(gesamt - belegt, 0);
      var bar = make("div","slotbar");
      var barIn = make("span");
      barIn.style.width = (gesamt ? Math.min(100, Math.round(belegt / gesamt * 100)) : 0) + "%";
      bar.appendChild(barIn);
      panel.appendChild(make("p","muted-line", belegt + " / " + gesamt + " · " + (frei > 0 ? t("spotsFree", frei) : t("full"))));
      panel.appendChild(bar);

      var facts = make("table","facts");
      var tb = make("tbody");
      facts.appendChild(tb);
      function fact(k, v){
        var tr = make("tr");
        tr.appendChild(make("th", null, k));
        tr.appendChild(make("td", null, v));
        tb.appendChild(tr);
      }
      fact(t("organizerLabel"), g.organisator || "—");
      fact(t("levelL"), t(LVLKEY[g.niveau] || "lvlFreizeit"));
      fact(t("costShort"), money(g.kosten_cent));
      fact(t("district"), districtName(g.bezirk));
      if (g.notiz) fact(t("noteL"), g.notiz);
      panel.appendChild(facts);

      panel.appendChild(make("p","section-label", t("squad")));
      var squad = make("div","squad");
      panel.appendChild(squad);
      sb.from("spieler_public").select("user_id,status,anzeigename,bild_url,zugesagt_am")
        .eq("match_id", id).order("zugesagt_am")
        .then(function(res){
          clear(squad);
          var rows = (res.data || []).filter(function(r){ return r.status !== "abgesagt"; });
          if (!rows.length){ squad.appendChild(make("p","muted-line", "—")); return; }
          rows.forEach(function(r){
            var item = make("div","player");
            if (r.bild_url){
              var im = document.createElement("img");
              im.className = "avatar"; im.src = r.bild_url; im.alt = "";
              item.appendChild(im);
            } else {
              item.appendChild(make("div","avatar-fallback", initials(r.anzeigename || "?")));
            }
            item.appendChild(make("span","who", r.anzeigename || "—"));
            if (r.status === "warteliste") item.appendChild(make("span","pill", t("waitlistLabel")));
            if (session && r.user_id !== session.user.id){
              var sperr = make("button","tinylink", t("blockUser"));
              sperr.type = "button";
              sperr.addEventListener("click", function(){
                blockUser(r.user_id, function(){ stopChat(); openModal(gamePanel(id)); });
              });
              item.appendChild(sperr);

              if (g.organisator_id === session.user.id){
                var raus = make("button","tinylink", t("spielerEntfernen"));
                raus.type = "button";
                raus.addEventListener("click", function(){
                  if (!window.confirm(t("spielerEntfernenAsk", r.anzeigename || "—"))) return;
                  sb.rpc("spiel_teilnehmer_entfernen", { p_match: id, p_user: r.user_id })
                    .then(function(res){
                      if (res.error){ toast(res.error.message); return; }
                      if (res.data > 0) toast(t("nachgerueckt", res.data));
                      loadMyPart().then(loadGames).then(function(){
                        stopChat(); openModal(gamePanel(id));
                      });
                    });
                });
                item.appendChild(raus);

                if (r.status === "zugesagt"){
                  var ueber = make("button","tinylink", t("uebergeben"));

                    if (!window.confirm(t("uebergebenAsk", r.anzeigename || "—"))) return;

                      .then(function(res){
                        if (res.error){ toast(res.error.message); return; }

                        loadMyPart().then(loadGames).then(function(){
                          stopChat(); openModal(gamePanel(id));
                        });
                      });

      if (mine === "zugesagt" || mine === "warteliste"){
        act.textContent = t("leaveBtn");
        act.className = "btn secondary";
      } else {
        act.textContent = frei > 0 ? t("joinBtn") : t("waitBtn");
      }
      act.addEventListener("click", function(){
        if (needAccount()) return;
        act.disabled = true;
        var leaving = (mine === "zugesagt" || mine === "warteliste");
        var call = leaving ? sb.rpc("spiel_absagen", { p_match: id }) : sb.rpc("spiel_beitreten", { p_match: id });
        call.then(function(res){
          act.disabled = false;
          if (res.error){ msg.textContent = res.error.message; msg.hidden = false; return; }
          loadMyPart().then(loadGames).then(function(){
            stopChat();
            openModal(gamePanel(id));
            if (leaving) toast(t("leftOk"));
            else toast(res.data === "warteliste" ? t("youAreWaiting") : t("youAreIn"));
          });
        }).catch(function(e){
          act.disabled = false; msg.textContent = String(e); msg.hidden = false;
        });

      panel.appendChild(act);

      teilen.addEventListener("click", function(){ spielTeilen(g); });
      panel.appendChild(teilen);

      if (session && g.organisator_id === session.user.id){

        edit.style.marginTop = "9px";
        edit.addEventListener("click", function(){ stopChat(); openModal(editPanel(id)); });
        panel.appendChild(edit);

        var kill = make("button","danger-link", t("cancelGame"));

        kill.addEventListener("click", function(){
          if (!window.confirm(t("cancelGameAsk"))) return;
          kill.disabled = true;
          sb.from("matches").update({ status: "abgesagt" }).eq("id", id).then(function(res){
            kill.disabled = false;
            if (res.error){ msg.textContent = res.error.message; msg.hidden = false; return; }
            closeModal();
            toast(t("cancelledOk"));
            loadMyPart().then(loadGames);
          });
        });
        panel.appendChild(kill);
      }

      var close = make("button","quiet-link", t("cancel"));
      close.type = "button";
      close.addEventListener("click", closeModal);
      panel.appendChild(close);
    };
  }
