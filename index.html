        var wer = make("span","wer");
        wer.appendChild(make("strong", null, text));
        z.appendChild(wer);
        z.appendChild(make("span","haken", "✓"));
        z.addEventListener("click", function(){
          zusagen[schluessel] = !zusagen[schluessel];
          z.setAttribute("aria-pressed", zusagen[schluessel] ? "true" : "false");
          malen();
        });
        panel.appendChild(z);
      }
      bauZeile("personen", t("profilFreigabe1"));
      bauZeile("minder", t("profilFreigabe2"));

      panel.appendChild(make("p","hint", t("profilFreigabeFolgen")));

      var weiter = make("button","btn", t("profilFreigabeWeiter"));
      weiter.type = "button";
      weiter.disabled = true;
      panel.appendChild(weiter);

      // Weil ein gesperrter Knopf kein Antippen meldet, steht darunter
      // dauerhaft, was noch fehlt - solange er gesperrt ist.
      var nochHint = make("p","hint", t("profilFreigabeNoch"));
      panel.appendChild(nochHint);

      function malen(){
        var beide = zusagen.personen && zusagen.minder;
        weiter.disabled = !beide;
        nochHint.hidden = beide;
      }
      malen();

      var fileInput = document.createElement("input");
      fileInput.type = "file"; fileInput.accept = "image/*"; fileInput.hidden = true;
      panel.appendChild(fileInput);

      weiter.addEventListener("click", function(){
        if (!(zusagen.personen && zusagen.minder)) return;
        fileInput.click();
      });
      fileInput.addEventListener("change", function(){
        var f = fileInput.files && fileInput.files[0];
        if (!f) return;
        if (!(zusagen.personen && zusagen.minder)) return;
        profilFotoHochladen(f);
      });

      var quit = make("button","quiet-link", t("cancel"));
      quit.type = "button";
      quit.addEventListener("click", function(){ if (zurueck) openModal(zurueck); else closeModal(); });
      panel.appendChild(quit);
    };
  }

  function profilFotoHochladen(datei){
    if (!session) return;
    if (datei.size > 5 * 1024 * 1024){ toast(t("fotoZuGross")); return; }
    var ext = (datei.name.split(".").pop() || "jpg").toLowerCase();
    if (["jpg","jpeg","png","webp"].indexOf(ext) === -1) ext = "jpg";
    var pfad = session.user.id + "/" + Date.now() + "." + ext;

    profilFotoLaeuft = true;
    profilFotoFehler = null;
    toast(t("fotoHochladen"));
    openModal(profilePanel(false));

    function fertig(fehler){
      profilFotoLaeuft = false;
      profilFotoFehler = fehler || null;
      openModal(profilePanel(false));
    }

    sb.storage.from("profil").upload(pfad, datei).then(function(res){
      if (res && res.error){ fertig(res.error.message); return; }
      sb.from("profil_fotos").insert({
        user_id: session.user.id,
        pfad: pfad,
        zusage_personen: true,
        zusage_minderjaehrige: true
      }).then(function(r2){
        if (r2 && r2.error){
          try { sb.storage.from("profil").remove([pfad]); } catch(e){}
          fertig(r2.error.code === "42501" ? t("profilFotoZuViele") : r2.error.message);
          return;
        }
        toast(t("fotoDa"));
        fertig(null);
      });
    }).catch(function(e){ fertig(String(e)); });
  }

  function profilePanel(isNew){
    return function(panel){
      clear(panel);
      panel.appendChild(make("h2", null, isNew ? t("almostDone") : t("profileTitle")));
      panel.appendChild(make("p","lead", isNew ? t("completeLead") : t("profileLead")));
      var msg = make("div","err"); msg.hidden = true; panel.appendChild(msg);
      if (profilFotoFehler){ msg.textContent = profilFotoFehler; msg.hidden = false; profilFotoFehler = null; }

      var meta = (session && session.user && session.user.user_metadata) || {};
      var p = profile || { anzeigename: meta.anzeigename || "", geburtsjahr: meta.geburtsjahr || null };
      var erwachsen = istErwachsenJahr(p.geburtsjahr);
      var avatarBox = make("div","avatar-edit");
      var avatarView;
      if (p.bild_url){
        avatarView = document.createElement("img");
        avatarView.className = "avatar";
        avatarView.src = p.bild_url;
        avatarView.alt = "";
      } else {
        avatarView = make("div","avatar-fallback", initials(p.anzeigename || "?"));
      }
      avatarBox.appendChild(avatarView);
      var fileBtn = make("button","btn secondary", t("changePicture"));
      fileBtn.type = "button";
      fileBtn.style.width = "auto";
      fileBtn.style.padding = "10px 15px";
      var fileInput = document.createElement("input");
      fileInput.type = "file"; fileInput.accept = "image/*"; fileInput.hidden = true;
      fileBtn.addEventListener("click", function(){ fileInput.click(); });
      fileInput.addEventListener("change", function(){
        var f = fileInput.files && fileInput.files[0];
        if (!f || !session) return;
        toast(t("uploading"));
        var ext = (f.name.split(".").pop() || "jpg").toLowerCase();
        var path = session.user.id + "/avatar." + ext;
        sb.storage.from("avatars").upload(path, f, { upsert: true }).then(function(res){
          if (res.error){ msg.textContent = res.error.message; msg.hidden = false; return; }
          var url = sb.storage.from("avatars").getPublicUrl(path).data.publicUrl + "?v=" + Date.now();
          p.bild_url = url;
          if (avatarView.tagName === "IMG"){ avatarView.src = url; }
          else {
            var img = document.createElement("img");
            img.className = "avatar"; img.src = url; img.alt = "";
            img.style.width = "60px"; img.style.height = "60px";
            avatarBox.replaceChild(img, avatarView);
            avatarView = img;
          }
        });
      });
      avatarBox.appendChild(fileBtn);
      avatarBox.appendChild(fileInput);
      // Eigener Rahmen um das Formular: der klebende Speichern-Streifen haelt
      // nur bis hier, sonst laege er ueber Abmelden und Konto loeschen.
      var formTeil = make("div");
      panel.appendChild(formTeil);
      formTeil.appendChild(avatarBox);

      var nameIn = input("f-name","text","");
      nameIn.value = p.anzeigename || "";
      nameIn.maxLength = 40;
      formTeil.appendChild(field(t("displayName"), nameIn));

      var yearIn = input("f-year","number", t("birthHint"));
      yearIn.min = "1930";
      yearIn.max = String(new Date().getFullYear());
      yearIn.value = p.geburtsjahr ? String(p.geburtsjahr) : "";
      formTeil.appendChild(field(t("birthYear"), yearIn));

      var districtOpts = [{value:"", label:t("allDistricts")}];
      for (var i = 1; i <= 23; i++) districtOpts.push({ value:String(i), label: districtName(i) });
      var distSel = select("f-dist", districtOpts, p.bezirk ? String(p.bezirk) : "");
      formTeil.appendChild(field(t("district"), distSel));

      var posSel = select("f-pos", [
        {value:"egal",label:t("posEgal")},{value:"tor",label:t("posTor")},
        {value:"abwehr",label:t("posAbwehr")},{value:"mittelfeld",label:t("posMittelfeld")},
        {value:"sturm",label:t("posSturm")}
      ], p.spielposition || "egal");
      formTeil.appendChild(field(t("positionLabel"), posSel));

      var lvlSel = select("f-lvl", levelOptions(), p.niveau || "freizeit");
      formTeil.appendChild(field(t("levelLabel"), lvlSel));

      // Dunkelmodus sitzt jetzt in der Kopfzeile (themeBtn) - erreichbar ohne
      // Anmeldung. Hier absichtlich nicht mehr, siehe setzeDarstellung().

      // Beim ersten Ausfuellen bleiben die drei neuen Abschnitte weg -
      // sonst dauert der Einstieg doppelt so lang.
      var ueberFeld = null;
      if (!isNew){
        sichtBlock(formTeil, p, erwachsen);
        if (erwachsen) ueberFeld = ueberMichBlock(formTeil, p);
        if (erwachsen) meineFotosBlock(formTeil);
      }

      var fuss = make("div","panelfuss");
      var save = make("button","btn", t("save"));
      save.type = "button";
      save.addEventListener("click", function(){
        if (nameIn.value.trim().length < 2){ msg.textContent = t("needName"); msg.hidden = false; el("panel").scrollTop = 0; return; }
        var jahr = parseInt(yearIn.value, 10);
        if (!jahr || jahr < 1930 || jahr > new Date().getFullYear()){
          msg.textContent = t("needYear"); msg.hidden = false; el("panel").scrollTop = 0; return;
        }
        if (new Date().getFullYear() - jahr < 14){
          msg.textContent = t("minAge"); msg.hidden = false; el("panel").scrollTop = 0; return;
        }
        save.disabled = true;
        var row = {
          id: session.user.id,
          anzeigename: nameIn.value.trim(),
          geburtsjahr: jahr,
          bild_url: p.bild_url || null,
          bezirk: distSel.value ? Number(distSel.value) : null,
          spielposition: posSel.value,
          niveau: lvlSel.value,
          sprache: lang
        };
        if (ueberFeld) row.ueber_mich = ueberFeld.value.trim() || null;
        // Ueber mein_profil_speichern statt upsert: die Funktion laeuft mit
        // erhoehten Rechten, prueft die Sperre und laesst Felder, die nicht
        // mitgeschickt werden, unveraendert stehen.
        sb.rpc("mein_profil_speichern", {
          p_anzeigename: row.anzeigename,
          p_geburtsjahr: row.geburtsjahr,
          p_bild_url: row.bild_url,
          p_bezirk: row.bezirk,
          p_spielposition: row.spielposition,
          p_niveau: row.niveau,
          p_sprache: row.sprache,
          p_ueber_mich: ueberFeld ? (ueberFeld.value.trim() || null) : null,
          p_ueber_mich_setzen: !!ueberFeld
        }).then(function(res){
          save.disabled = false;
          if (res.error){ msg.textContent = res.error.message; msg.hidden = false; el("panel").scrollTop = 0; return; }
          // Zusammenfuehren statt ersetzen: sonst gingen moderator,
          // die Sichtbarkeitsschalter und der Absagehinweis verloren.
          var alt = profile || {};
          var neu = {};

          var neu = !an;

          // Die Funktion verlangt alle drei Schalter, damit der Server nie
          // einen Zwischenstand sieht. Die beiden anderen bleiben wie sie sind.
          var satzObj = {
            p_zeige_alter:  p.zeige_alter  !== false,

  function chatBlock(panel, id, darfSchreiben, opts){
    var tvt = (opts && opts.meineSeite) ? opts : null;
    panel.appendChild(make("p","section-label", t("chat")));
    if (tvt && tvt.gegner) panel.appendChild(make("p","hint", t("tvtChatSeiten", tvt.gegner)));
    if (!darfSchreiben && !(opts && opts.nurLesen)){
      panel.appendChild(make("p","muted-line", t("chatOnlyForSquad")));
      return;
    }
    function eigenKlasse(){
      if (!tvt) return "msg own";
      return "msg tvt rechts own" + (tvt.meineSeite === "gast" ? " gastseite" : "");
    }
    var box = make("div","chat");
    panel.appendChild(box);
    var gesehen = {};
    var leerHinweis = null;
    var wartend = [];
    var letzteZeit = null;

    function eigeneSofort(text){
      if (leerHinweis){ box.removeChild(leerHinweis); leerHinweis = null; }
      var wrap = make("div", eigenKlasse() + " wartet");
      var wann = "";
      try {
        wann = new Intl.DateTimeFormat(lang === "de" ? "de-AT" : "en-GB",
          { hour:"2-digit", minute:"2-digit", timeZone:"Europe/Vienna" }).format(new Date());
      } catch(e){}
      wrap.appendChild(make("div","meta", ((profile && profile.anzeigename) || "—") + " · " + wann));
      wrap.appendChild(make("div","bubble", text));
      box.appendChild(wrap);
      box.scrollTop = box.scrollHeight;
      wartend.push({ text: text, el: wrap });
      return wrap;
    }

    function zeile(m){
      if (!m || gesehen[m.id]) return;
      if (blockedSet[m.user_id]) return;
      gesehen[m.id] = true;
      if (!letzteZeit || m.gesendet_am > letzteZeit) letzteZeit = m.gesendet_am;
      var eigen = session && m.user_id === session.user.id;
      if (eigen){
        for (var w = 0; w < wartend.length; w++){
          if (wartend[w].text === m.text){
            wartend[w].el.className = eigenKlasse();
            wartend.splice(w, 1);
            return;
          }
        }
      }
      if (leerHinweis){ box.removeChild(leerHinweis); leerHinweis = null; }
      var klasse = eigen ? "msg own" : "msg";
      if (tvt && m.seite){
        var meins = (m.seite === tvt.meineSeite);
        klasse = "msg tvt " + (meins ? "rechts " : "links ") +
                 (eigen ? "own" : (meins ? "mit" : "andere")) +
                 (m.seite === "gast" ? " gastseite" : "");
      }
      var wrap = make("div", klasse);
      var wann = "";
      try {
        wann = new Intl.DateTimeFormat(lang === "de" ? "de-AT" : "en-GB",
          { hour:"2-digit", minute:"2-digit", timeZone:"Europe/Vienna" }).format(new Date(m.gesendet_am));
      } catch(e){}
      var meta = make("div","meta");
      var kopfText = (m.anzeigename || "—");
      if (tvt && m.team_name) kopfText += " · " + m.team_name;
      meta.appendChild(document.createTextNode(kopfText + " · " + wann));
      if (tvt && m.ist_kapitaen) meta.appendChild(make("span","kappille", t("teamKapitaen")));
      wrap.appendChild(meta);
      wrap.appendChild(make("div","bubble", m.text));
      if (!eigen && session){
        var mel = make("button","tinylink", t("reportBtn"));
        mel.type = "button";
        mel.addEventListener("click", function(){
          stopChat();
          openModal(reportPanel("nachricht", m.id, (tvt && tvt.zurueck) ? tvt.zurueck : gamePanel(id)));
        });
        wrap.appendChild(mel);
      }
      box.appendChild(wrap);
      box.scrollTop = box.scrollHeight;
    }

    function nachladen(erstesMal){
      var q = sb.from("chat_public")
        .select("id,user_id,text,gesendet_am,anzeigename,team_id,team_name,seite,ist_kapitaen")
        .eq("match_id", id);
      if (!erstesMal && letzteZeit) q = q.gte("gesendet_am", letzteZeit);
      return q.order("gesendet_am").limit(100)
        .then(function(res){
          var rows = res.data || [];
          if (erstesMal && !rows.length){
            leerHinweis = make("p","muted-line", t("noMessages"));
            box.appendChild(leerHinweis);
            return;
          }
          rows.forEach(zeile);
        }).catch(function(){});
    }
    nachladen(true);

    if (!darfSchreiben){
      stopChat();
      chatTimer = setInterval(function(){
        if (el("modal").hidden){ stopChat(); return; }
        if (document.hidden) return;
        nachladen(false);
      }, 4000);
      return;
    }
    var form = make("div","chatform");
    var feld = input("chat-input","text", t("chatPlaceholder"));
    feld.maxLength = 1000;
    var senden = make("button", null, t("send"));
    senden.type = "button";
    function abschicken(){
      var text = feld.value.trim();
      if (!text) return;
      feld.value = "";
      var vorschau = eigeneSofort(text);
      sb.from("messages").insert({ match_id: id, user_id: session.user.id, text: text }).then(function(res){
        if (res.error){
          toast(res.error.message);
          if (vorschau && vorschau.parentNode) vorschau.parentNode.removeChild(vorschau);
          wartend = wartend.filter(function(x){ return x.el !== vorschau; });
          feld.value = text;
          return;
        }
        nachladen(false);
      });
    }
    senden.addEventListener("click", abschicken);
    feld.addEventListener("keydown", function(e){ if (e.key === "Enter") abschicken(); });
    form.appendChild(feld);
    form.appendChild(senden);
    panel.appendChild(form);

    stopChat();
    try {
      chatChannel = sb.channel("chat-" + id)
        .on("postgres_changes",
            { event: "INSERT", schema: "public", table: "messages", filter: "match_id=eq." + id },
            function(payload){
              var m = payload && payload.new;
              if (!m) return;
              if (session && m.user_id === session.user.id) return;
              sb.from("chat_public")
                .select("id,user_id,text,gesendet_am,anzeigename,team_id,team_name,seite,ist_kapitaen")
                .eq("id", m.id).maybeSingle()
                .then(function(r){ if (r.data) zeile(r.data); });
            })
        .subscribe();
    } catch(e){}

    chatTimer = setInterval(function(){
      if (el("modal").hidden){ stopChat(); return; }
      if (document.hidden) return;
      nachladen(false);
    }, 1800);
  }

  // Gueltigkeitsdauer der signierten Adressen fuer den nicht oeffentlichen
  // Ordner "profil". Eine Stunde: lang genug, um ein Profil in Ruhe anzusehen,
  // kurz genug, dass eine weitergegebene Adresse nicht liegen bleibt. Die
  // Adressen werden bei jedem Oeffnen der Ansicht neu geholt.
  var PROFIL_URL_DAUER = 3600;

  function profilFotosLaden(userId){
    return sb.from("profil_fotos").select("id,pfad,user_id")
      .eq("user_id", userId).order("sortierung")
      .then(function(res){
        var reihen = (res && res.data) || [];
        if (!reihen.length) return [];
        var pfade = reihen.map(function(r){ return r.pfad; });
        return sb.storage.from("profil").createSignedUrls(pfade, PROFIL_URL_DAUER)
          .then(function(sig){
            var karte = {};
            ((sig && sig.data) || []).forEach(function(e){
              if (e && e.path && e.signedUrl) karte[e.path] = e.signedUrl;
            });
            var fertig = [];
            reihen.forEach(function(r){
              if (karte[r.pfad]){ r.url = karte[r.pfad]; fertig.push(r); }
            });
            return fertig;
          }).catch(function(){ return []; });
      }).catch(function(){ return []; });
  }

      zu.addEventListener("click", function(){ if (zurueck) openModal(zurueck); else closeModal(); });
      panel.appendChild(zu);

      function zeichne(){
        var f = fotos[pos];
        clear(rahmen);
        clear(fuss);
        zaehler.textContent = (pos + 1) + " / " + fotos.length;
        zurueckKn.disabled = (pos === 0);
        vorKn.disabled = (pos === fotos.length - 1);
        lead.textContent = t("fotoVon", daten.anzeigename || "—");
        var img = document.createElement("img");
        img.alt = ""; img.src = f.url;
        rahmen.appendChild(img);

        var eigenes = !!(session && f.user_id === session.user.id);
        if (eigenes){
          var weg = make("button","danger-link", t("profilFotoWeg"));
          weg.type = "button";
          weg.addEventListener("click", function(){
            if (!window.confirm(t("profilFotoWegAsk"))) return;
            profilFotoLoeschen(f, function(){ if (zurueck) openModal(zurueck); else closeModal(); });
          });
          fuss.appendChild(weg);
        } else if (session){
          var mel = make("button","quiet-link", t("profilBildMelden"));
          mel.type = "button";
          mel.addEventListener("click", function(){
            openModal(bildMeldenPanel(f, profilGaleriePanel(daten, fotos, pos, zurueck), zurueck));
          });
          fuss.appendChild(mel);
        }
      }

      function blaettern(schritt){
        var neu = pos + schritt;
        if (neu < 0 || neu >= fotos.length) return;
        pos = neu;
        zeichne();
      }
      zurueckKn.addEventListener("click", function(){ blaettern(-1); });
      vorKn.addEventListener("click", function(){ blaettern(1); });

      var startX = null, startY = null;
      rahmen.addEventListener("touchstart", function(ev){
        if (!ev.touches || ev.touches.length !== 1) return;
        startX = ev.touches[0].clientX;
        startY = ev.touches[0].clientY;
      }, { passive: true });
      rahmen.addEventListener("touchend", function(ev){
        if (startX === null || !ev.changedTouches) return;
        var dx = ev.changedTouches[0].clientX - startX;
        var dy = ev.changedTouches[0].clientY - startY;
        startX = null; startY = null;
        if (Math.abs(dx) < 45 || Math.abs(dx) < Math.abs(dy)) return;
        blaettern(dx < 0 ? 1 : -1);
      }, { passive: true });

      zeichne();
    };
  }

  // Eigenes kleines Meldefenster: der Grund bestimmt hier die Wirkung,
  // deshalb nicht das allgemeine reportPanel mit blossem Freitext.
  function bildMeldenPanel(foto, zurueckBild, zurueckProfil){
    return function(panel){
      clear(panel);
      panel.appendChild(make("h2", null, t("profilBildMelden")));
      panel.appendChild(make("p","lead", t("profilBildGrundFrage")));
      var msg = make("div","err"); msg.hidden = true; panel.appendChild(msg);

      var wahl = null;
      var zeilen = [];
      function bauZeile(schluessel, text){
        var z = make("button","wahlzeile");
        z.type = "button";
        z.setAttribute("aria-pressed", "false");
        var wer = make("span","wer");
        wer.appendChild(make("strong", null, text));
        z.appendChild(wer);
        z.appendChild(make("span","haken", "✓"));
        z.addEventListener("click", function(){
          wahl = schluessel;
          malen();
        });
        zeilen.push({ el: z, key: schluessel });
        panel.appendChild(z);
        return z;
      }
      bauZeile("ich", t("profilBildGrundIchDrauf"));
      bauZeile("anderes", t("profilBildGrundAnderes"));

      var grundFeld = input("bm-grund","text", t("reportPlaceholder"));
      grundFeld.maxLength = 300;
      var grundBox = field(t("reportReason"), grundFeld);
      grundBox.hidden = true;
      panel.appendChild(grundBox);

      var go = make("button","btn", t("reportSend"));
      go.type = "button";
      go.disabled = true;
      panel.appendChild(go);

      function malen(){
        zeilen.forEach(function(z){
          z.el.setAttribute("aria-pressed", z.key === wahl ? "true" : "false");
        });
        grundBox.hidden = (wahl !== "anderes");
        go.disabled = !wahl;
      }
      malen();

      go.addEventListener("click", function(){
        if (!wahl) return;
        if (wahl === "anderes" && grundFeld.value.trim().length < 3){
          msg.textContent = t("reportPlaceholder"); msg.hidden = false; return;
        }
        go.disabled = true;
        sb.rpc("bild_melden", {
          p_typ: "profilfoto",
          p_id: foto.id,
          p_ich_bin_drauf: wahl === "ich",
          p_grund: wahl === "anderes" ? grundFeld.value.trim() : null
        }).then(function(res){
          go.disabled = false;
          if (res.error){ msg.textContent = res.error.message; msg.hidden = false; return; }
          if (wahl === "ich"){
            toast(t("profilBildVerborgen"));
            if (zurueckProfil) openModal(zurueckProfil); else closeModal();
          } else {
            toast(t("reportSent"));
            if (zurueckBild) openModal(zurueckBild); else closeModal();
          }
        });
      });

      var quit = make("button","quiet-link", t("cancel"));
      quit.type = "button";
      quit.addEventListener("click", function(){ if (zurueckBild) openModal(zurueckBild); else closeModal(); });
      panel.appendChild(quit);
    };
  }

  function spielerPanel(userId, zurueck){
    return function(panel){
      var selbst = !!(session && userId === session.user.id);

      function zurueckTun(){ if (zurueck) openModal(zurueck); else closeModal(); }

      clear(panel);
      panel.appendChild(make("h2", null, t("profilTitel")));

      panel.appendChild(inhalt);
      inhalt.appendChild(make("div","skelett"));
      inhalt.appendChild(make("div","skelett"));

      var zu = make("button","quiet-link", t("cancel"));
      zu.type = "button";
      zu.addEventListener("click", zurueckTun);
      panel.appendChild(zu);

      sb.rpc("spieler_profil", { p_user: userId }).then(function(res){
        clear(inhalt);
        if (res && res.error){ fehlerZeigen(); return; }
        var p = res.data && res.data[0];
        if (!p){ inhalt.appendChild(make("p","muted-line", t("modKeinInhalt"))); return; }
        zeichne(p);
      }).catch(function(){ clear(inhalt); fehlerZeigen(); });

      function fehlerZeigen(){
        inhalt.appendChild(make("div","info", t("teamsNochmalText")));
        var wieder = make("button","btn secondary", t("teamsNochmal"));

      }

      function zeichne(p){
        var gesperrt = !!p.ist_gesperrt;
        if (gesperrt) inhalt.appendChild(make("div","info warn", t("profilGesperrt")));

        // Kopf: Avatar, Name, "dabei seit". Die Fakten stehen darunter als
        // Chips - die graue Punktzeile war in der Sonne nicht lesbar.
        var kopf = make("div","profilkopf");
        kopf.appendChild(avatarVon(p, true));
        var wer = make("span","wer");
        wer.appendChild(make("strong", null, p.anzeigename || "—"));
        if (p.dabei_seit){
          var wann = "";
          try {
            wann = new Intl.DateTimeFormat(lang === "de" ? "de-AT" : "en-GB",
              { month:"long", year:"numeric", timeZone:"Europe/Vienna" }).format(new Date(p.dabei_seit));
          } catch(e){}
          if (wann) wer.appendChild(make("span", null, t("profilSeit", wann)));
        }
        kopf.appendChild(wer);
        inhalt.appendChild(kopf);

        // Jeder Fakt ein eigener Chip. Fehlt einer - etwa das verborgene Alter -,
        // fehlt genau ein Chip, kein Platzhalter und kein doppelter Trennpunkt.
        var chips = make("div","badges");
        var fakten = [
          districtName(p.bezirk),
          p.niveau ? t(LVLKEY[p.niveau] || "lvlFreizeit") : null,
          p.spielposition ? t(POSKEY[p.spielposition] || "posEgal") : null,
          (p.alter_jahre != null) ? t("profilAlterJahre", p.alter_jahre) : null
        ];
        fakten.forEach(function(f){ if (f) chips.appendChild(make("span","badge fakt", f)); });
        if (chips.firstChild) inhalt.appendChild(chips);

        // Ueber mich und Fotogalerie fehlen bei gesperrtem Konto vollstaendig.
        if (!gesperrt && p.ueber_mich && String(p.ueber_mich).trim()){
          inhalt.appendChild(make("p","section-label", t("profilUeberMich")));
          var frei = make("div","freitext");
          frei.textContent = String(p.ueber_mich);   // niemals innerHTML
          inhalt.appendChild(frei);
        }

        var galerieAnker = make("div");
        inhalt.appendChild(galerieAnker);
        if (!gesperrt){
          profilFotosLaden(userId).then(function(fotos){
            if (!fotos.length) return;
            clear(galerieAnker);
            galerieAnker.appendChild(make("p","section-label", t("profilFotosFremd")));
            var reihe = make("div","bilder quadrat");
            fotos.forEach(function(f, i){
              var k = make("button","bild foto");
              k.type = "button";
              var im = document.createElement("img");
              im.src = f.url; im.alt = "";
              k.appendChild(im);
              k.addEventListener("click", function(){
                openModal(profilGaleriePanel(p, fotos, i, spielerPanel(userId, zurueck)));
              });
              reihe.appendChild(k);
            });
            galerieAnker.appendChild(reihe);
          });
        }

        var gitter = make("div","statgrid");
        function kasten(wert, text, wenig){
          var b = make("div","statbox");
          if (wenig) b.appendChild(make("span","wenig", wert));
          else b.appendChild(make("b", null, String(wert)));
          b.appendChild(make("span", null, text));
          gitter.appendChild(b);
        }
        kasten(p.spiele || 0, t("statSpiele"));
        kasten(p.organisiert || 0, t("statOrganisiert"));
        kasten(p.absagen || 0, t("statAbsagen"));
        // Kein Einfaerben, in keinem Fall: eine rote Kachel ist ein Brandzeichen.
        if (p.genug_spiele) kasten((p.absagen_quote || 0) + " %", t("statQuote"));
        else kasten(t("profilQuoteWenige"), t("statQuote"), true);
        inhalt.appendChild(gitter);
        if (!p.genug_spiele) inhalt.appendChild(make("p","hint", t("profilQuoteWenigeHint")));

        inhalt.appendChild(make("p","section-label", t("bewTitel")));
        var anzahl = p.anzahl_bewertungen || 0;
        if (!anzahl){
          inhalt.appendChild(make("p","muted-line", t("bewKeine")));
        } else if (!p.genug_bewertungen){
          inhalt.appendChild(make("p","muted-line", t("profilBewWenige")));
          inhalt.appendChild(make("p","hint", anzahl === 1 ? t("bewEine") : t("bewAnzahl", anzahl)));
        } else {
          inhalt.appendChild(sternzeile(t("bewGesamt"), p.gesamt));
          BEWKATS.forEach(function(k){ inhalt.appendChild(sternzeile(t(k.key), p[k.feld])); });
          inhalt.appendChild(make("p","hint", anzahl === 1 ? t("bewEine") : t("bewAnzahl", anzahl)));
        }

        // Ein Weg hin, nicht nur drei Wege hinaus.
        if (session && !selbst){
          var stand = null;
          freunde.forEach(function(f){
            if (f.partner_id === userId && f.status !== "abgelehnt") stand = f;
          });
          if (stand && stand.status === "bestaetigt"){
            inhalt.appendChild(make("p","hint", t("profilBefreundet")));
          } else if (stand && stand.richtung === "gesendet"){
            inhalt.appendChild(make("p","hint", t("profilAnfrageLaeuft")));
          } else if (stand){
            inhalt.appendChild(make("p","hint", t("profilAnfrageErhalten")));
          } else {

            anfrage.type = "button";
            anfrage.addEventListener("click", function(){
              anfrage.disabled = true;
              anfrageSenden(userId, function(){ openModal(spielerPanel(userId, zurueck)); });
            });
            inhalt.appendChild(anfrage);
          }
        }

        if (session && !selbst){
          var reihe2 = make("div","fussaktionen");
          var melden = make("button","btn secondary", t("profilMelden"));
          melden.type = "button";
          melden.addEventListener("click", function(){
            openModal(reportPanel("profil", userId, spielerPanel(userId, zurueck)));
          });
          reihe2.appendChild(melden);

          if (blockedSet[userId]){

            auf.type = "button";
            auf.addEventListener("click", function(){
              unblockUser(userId, function(){ openModal(spielerPanel(userId, zurueck)); });
            });
            reihe2.appendChild(auf);
          } else {
            var sperr = make("button","btn secondary", t("profilBlockieren"));
            sperr.type = "button";
            sperr.addEventListener("click", function(){
              blockUser(userId, zurueckTun);
            });
            reihe2.appendChild(sperr);
          }
          inhalt.appendChild(reihe2);
        }
      }
    };
  }

  function gamePanel(id){
    return function(panel){
      var g = games.filter(function(x){ return x.id === id; })[0];
      if ((g && g.modus === "team_vs_team") || (!g && tvtDaten(id))){
        return tvtPanel(id)(panel);
      }
      clear(panel);
      if (!g){ panel.appendChild(make("p","lead", t("cancelled"))); return; }

      panel.appendChild(make("h2", null, g.platz));
      panel.appendChild(make("p","lead", fmtWhen(g.beginn) + " · " + g.format + " · " + g.dauer_min + " " + t("minutes")));
      var msg = make("div","err"); msg.hidden = true; panel.appendChild(msg);

      var belegt = g.zugesagt || 0;
      var gesamt = g.plaetze_gesamt || 0;
      var frei = Math.max(gesamt - belegt, 0);

  /* ---------------- Platz-Kaskade fuer "Spiel anlegen" ---------------- */

  // Bis zu drei zuletzt bespielte Plaetze, neueste zuerst.
  function letztePlaetze(){
    try {
      var l = JSON.parse(localStorage.getItem("jogavia-plaetze") || "[]");
      return Array.isArray(l) ? l : [];
    } catch(e){ return []; }
  }

  function platzMerken(venueId){
    if (venueId === null || venueId === undefined) return;
    try {
      var l = letztePlaetze().filter(function(x){ return x !== venueId; });
      l.unshift(venueId);
      localStorage.setItem("jogavia-plaetze", JSON.stringify(l.slice(0, 3)));
    } catch(e){}
  }

  function platzAusId(id){
    return venues.filter(function(v){ return v.id === id; })[0] || null;
  }

  function letzterPlatz(){
    var l = letztePlaetze();
    for (var i = 0; i < l.length; i++){
      var v = platzAusId(l[i]);
      if (v) return v;
    }
    return null;
  }

  function meterEntfernung(lat1, lon1, lat2, lon2){
    var R = 6371000;
    var dLat = (lat2 - lat1) * Math.PI / 180;
    var dLon = (lon2 - lon1) * Math.PI / 180;
    var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
      Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) *
      Math.sin(dLon/2) * Math.sin(dLon/2);
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
  }

  // Lieber gar kein Platz als ein falscher: nur unter 1500 Metern.
  function platzImUmkreis(lat, lon){
    var bester = null, min = Infinity;
    venues.forEach(function(v){
      var d = meterEntfernung(lat, lon, v.lat, v.lon);
      if (d < min){ min = d; bester = v; }
    });
    return (bester && min < 1500) ? bester : null;
  }

  // Stufe 2 der Kaskade. Nur wenn die Standorterlaubnis schon einmal erteilt
  // war, hoechstens 3 Sekunden Zeit.
  function platzAusUmkreis(){
    return new Promise(function(fertig){
      var geo = null;
      try { geo = navigator.geolocation; } catch(e){}
      if (!geo){ fertig(null); return; }
      var frage;
      try {
        frage = (navigator.permissions && navigator.permissions.query)
          ? navigator.permissions.query({ name: "geolocation" })
              .then(function(s){ return s.state === "granted"; })
              .catch(function(){ return false; })
          : Promise.resolve(false);
      } catch(e){ frage = Promise.resolve(false); }
      frage.then(function(erlaubt){
        if (!erlaubt){ fertig(null); return; }
        var erledigt = false;
        var uhr = setTimeout(function(){
          if (erledigt) return;
          erledigt = true;
          fertig(null);
        }, 3000);
        geo.getCurrentPosition(function(pos){
          if (erledigt) return;
          erledigt = true; clearTimeout(uhr);
          fertig(platzImUmkreis(pos.coords.latitude, pos.coords.longitude));
        }, function(){
          if (erledigt) return;
          erledigt = true; clearTimeout(uhr);
          fertig(null);
        }, { enableHighAccuracy: false, timeout: 3000, maximumAge: 300000 });
      }).catch(function(){ fertig(null); });
    });
  }

  // Ein Antippen: zuletzt bespielter Platz -> Umkreis -> Pin-Modus.
  function spielAnlegenStarten(){
    if (needAccount()) return;
    neuesSpielWerte = null;
    var letzter = letzterPlatz();
    if (letzter){ openModal(createPanel(letzter, "zuletzt")); return; }
    openModal(createPanel(null, "sucht"));
    platzAusUmkreis().then(function(v){
      var panel = el("panel");
      if (el("modal").hidden || !panel.__platzSetzen) return;
      if (v){ panel.__platzSetzen(v, "naehe"); return; }
      // Kein brauchbarer Platz: ohne Zwischenblatt direkt in den Pin-Modus.
      neuesSpielWerte = panel.__werte ? panel.__werte() : null;
      closeModal();
      pinModusAn("neuesspiel");
    });
  }

  function createPanel(venue, herkunft){
    return function(panel){
      clear(panel);
      var gewaehlt = venue || null;
      var quelle = herkunft || null;
      panel.appendChild(make("h2", null, t("newGameTitle")));
      var msg = make("div","err"); msg.hidden = true; panel.appendChild(msg);

      // Ganze tippbare Zeile, mindestens 56 px - nicht nur das Woertchen "aendern".
      var platzZeile = make("button","platzzeile");
      platzZeile.type = "button";
      platzZeile.id = "g-platz";
      panel.appendChild(platzZeile);
      var standortHinweis = make("p","hint", t("platzOhneStandort"));
      standortHinweis.style.textAlign = "left";
      standortHinweis.style.margin = "-8px 0 14px";
      standortHinweis.hidden = true;
      panel.appendChild(standortHinweis);

      function zeileMalen(){
        clear(platzZeile);
        platzZeile.classList.toggle("leer", !gewaehlt);
        platzZeile.appendChild(nadelZeichen());
        var wo = make("span","wo");
        if (gewaehlt){
          wo.appendChild(make("strong", null, gewaehlt.name));
          var unter = [districtName(gewaehlt.bezirk), herkunftText(quelle)].filter(Boolean).join(" · ");
          if (unter) wo.appendChild(make("span", null, unter));
        } else if (quelle === "sucht"){
          wo.appendChild(make("strong", null, t("platzSuchtNaehe")));
        } else {
          wo.appendChild(make("strong", null, t("platzWaehlen")));
          wo.appendChild(make("span", null, t("neuesSpielPinHinweis")));
        }
        platzZeile.appendChild(wo);
        platzZeile.appendChild(make("span","wechsel", t("tvtPlatzAendern")));
        // Ohne Platz immer der Hinweis, dass es auch ohne Standort geht.
        standortHinweis.hidden = !(!gewaehlt && quelle !== "sucht");
      }
      zeileMalen();

      platzZeile.addEventListener("click", function(){
        // Beim Wechsel in den Pin-Modus geht nichts Eingetipptes verloren.
        neuesSpielWerte = sammeln();
        closeModal();
        pinModusAn("neuesspiel");
      });

      panel.__platzSetzen = function(v, q){ gewaehlt = v; quelle = q; zeileMalen(); };

      var morgen = new Date(Date.now() + 24 * 3600 * 1000);
      var dateIn = input("g-date","date","");
      dateIn.value = isoDate(morgen);
      var timeIn = input("g-time","time","");
      timeIn.value = "18:00";
      var two = make("div","two");
      two.appendChild(field(t("dateL"), dateIn));
      two.appendChild(field(t("timeL"), timeIn));
      panel.appendChild(two);

      var fmtSel = select("g-fmt", [
        {value:"3v3",label:"3 vs 3"},{value:"4v4",label:"4 vs 4"},{value:"5v5",label:"5 vs 5"},
        {value:"6v6",label:"6 vs 6"},{value:"7v7",label:"7 vs 7"},{value:"9v9",label:"9 vs 9"},
        {value:"11v11",label:"11 vs 11"}
      ], "5v5");
      var slotsIn = input("g-slots","number","");
      slotsIn.value = "10"; slotsIn.min = "2"; slotsIn.max = "40";
      fmtSel.addEventListener("change", function(){
        var n = parseInt(fmtSel.value, 10);
        if (n) slotsIn.value = String(n * 2);
      });
      var two2 = make("div","two");
      two2.appendChild(field(t("formatL"), fmtSel));
      two2.appendChild(field(t("slotsL"), slotsIn));
      panel.appendChild(two2);

      var durSel = select("g-dur", [
        {value:"60",label:"60 " + t("minutes")},{value:"90",label:"90 " + t("minutes")},
        {value:"120",label:"120 " + t("minutes")}
      ], "90");
      var lvlSel = select("g-lvl", levelOptions(), (profile && profile.niveau) || "freizeit");
      var two3 = make("div","two");
      two3.appendChild(field(t("durationL"), durSel));
      two3.appendChild(field(t("levelL"), lvlSel));
      panel.appendChild(two3);

      var costIn = input("g-cost","number","0");
      costIn.value = "0"; costIn.min = "0"; costIn.step = "0.5";
      panel.appendChild(field(t("costL"), costIn));

      var noteIn = input("g-note","text", t("notePlaceholder"));
      noteIn.maxLength = 200;
      panel.appendChild(field(t("noteL"), noteIn));

      function sammeln(){
        return { datum: dateIn.value, zeit: timeIn.value, format: fmtSel.value,
                 plaetze: slotsIn.value, dauer: durSel.value, niveau: lvlSel.value,
                 kosten: costIn.value, notiz: noteIn.value };
      }
      panel.__werte = sammeln;

      // Nach dem Platzwechsel steht alles wieder da, was schon eingetippt war.
      if (neuesSpielWerte){
        var w = neuesSpielWerte;
        neuesSpielWerte = null;
        if (w.datum) dateIn.value = w.datum;
        if (w.zeit) timeIn.value = w.zeit;
        if (w.format) fmtSel.value = w.format;
        if (w.plaetze) slotsIn.value = w.plaetze;
        if (w.dauer) durSel.value = w.dauer;
        if (w.niveau) lvlSel.value = w.niveau;
        if (w.kosten !== undefined && w.kosten !== null) costIn.value = w.kosten;
        if (w.notiz) noteIn.value = w.notiz;
      }

      var go = make("button","btn", t("createBtn"));
      go.type = "button";
      go.addEventListener("click", function(){
        // Ein toter Knopf sieht kaputt aus: der Knopf bleibt bedienbar und
        // sagt, was fehlt.
        if (!gewaehlt){
          msg.textContent = t("platzZuerst"); msg.hidden = false; return;
        }
        var beginn = new Date(dateIn.value + "T" + timeIn.value + ":00");
        if (isNaN(beginn.getTime()) || beginn.getTime() <= Date.now()){
          msg.textContent = t("timeInPast"); msg.hidden = false; return;
        }
        if (beginn.getTime() > Date.now() + 60 * 86400000){
          msg.textContent = t("tooFar"); msg.hidden = false; return;
        }
        go.disabled = true;
        var row = {
          venue_id: gewaehlt.id,
          organisator_id: session.user.id,
          beginn: beginn.toISOString(),
          dauer_min: Number(durSel.value),
          format: fmtSel.value,
          plaetze_gesamt: Math.max(2, Number(slotsIn.value) || 10),
          niveau: lvlSel.value,
          kosten_cent: Math.round((Number(costIn.value) || 0) * 100),
          notiz: noteIn.value.trim() || null
        };
        sb.from("matches").insert(row).select("id").then(function(res){
          if (res.error){ go.disabled = false; msg.textContent = res.error.message; msg.hidden = false; return; }
          platzMerken(gewaehlt.id);
          var newId = res.data && res.data[0] && res.data[0].id;
          sb.rpc("spiel_beitreten", { p_match: newId }).then(function(){
            loadMyPart().then(loadGames).then(function(){
              go.disabled = false;
              toast(t("createdOk"));
              openModal(gamePanel(newId));
            });
          });
        });
      });
      panel.appendChild(go);

      var quit = make("button","quiet-link", t("cancel"));
      quit.type = "button";
      quit.addEventListener("click", closeModal);
      panel.appendChild(quit);
    };
  }

    return ladeTeams().then(ladeTeamKram).then(function(){
      renderFeed();
      punkteSetzen();
    });
  }

  // Hoechstens drei Punkte in der Reiterleiste, ohne Zahlen:
  // an mich gerichtet -> Meine/Profil, an mein Team gerichtet -> Teams.
  function punkteSetzen(){
    var meine = el("punktMeine");
    var teams = el("punktTeams");
    var freundePunkt = el("punktFreunde");
    if (meine) meine.hidden = !(session && einladungen.length);
    if (teams) teams.hidden = !(session && tvtNeueZusagen().length);
    if (freundePunkt) freundePunkt.hidden = !(session && freunde.some(function(f){
      return f.status === "angefragt" && f.richtung === "erhalten";
    }));
  }

  // Die drei Quellen zu einem Satz zusammenlegen: matches_public, team_spiele, gegner_gesucht.
  function tvtDaten(id){
    var g = games.filter(function(x){ return x.id === id && x.modus === "team_vs_team"; })[0];
    var mein = teamSpiele.filter(function(x){ return x.match_id === id; })[0];
    var aus = gegnerListe.filter(function(x){ return x.match_id === id; })[0];
    if (!g && !mein && !aus) return null;
    var q = mein || g || aus;
    var r = {
      id: id,
      beginn: q.beginn,
      dauer_min: q.dauer_min,
      format: q.format,
      niveau: q.niveau,
      kosten_cent: q.kosten_cent,
      notiz: q.notiz,
      status: (mein && mein.status) || (g && g.status) || "geplant",
      absage_grund: mein ? mein.absage_grund : null,
      venue_id: q.venue_id,
      platz: q.platz,
      bezirk: q.bezirk,
      lat: q.lat,
      lon: q.lon,
      heim_team_id: q.heim_team_id,
      heim_team: q.heim_team,
      heim_wappen: q.heim_wappen || null,
      gast_team_id: (mein ? mein.gast_team_id : (g ? g.gast_team_id : null)) || null,
      gast_team: (mein ? mein.gast_team : (g ? g.gast_team : null)) || null,
      gast_wappen: (mein && mein.gast_wappen) || (g && g.gast_wappen) || null,
      mein_team_id: mein ? mein.mein_team_id : null,
      wir_sind_heim: mein ? mein.wir_sind_heim : null,
      bin_kapitaen: mein ? !!mein.bin_kapitaen : false,
      mein_status: mein ? mein.mein_status : null,
      heim_aufgestellt: mein ? mein.heim_aufgestellt : null,
      gast_aufgestellt: mein ? mein.gast_aufgestellt : null,
      soll_groesse: (mein && mein.soll_groesse) || formatGroesse(q.format),
      note: aus ? aus.note : null,
      bewertungen: aus ? aus.bewertungen : null,
      heim_bezirk: aus ? aus.heim_bezirk : null,
      heim_niveau: aus ? aus.heim_niveau : null,
      eigenes: aus ? !!aus.eigenes : !!mein,
      blockiert: aus ? !!aus.blockiert : false,
      heim_kapitaen: aus ? !!aus.bin_kapitaen : false
    };
    r.offen = !r.gast_team_id;
    return r;
  }

  // ---------- Anzeigetafel ----------

    b.appendChild(teamZeichen(name, gast, false, wappen));

    g.appendChild(tvtSeite(r.heim_team_id, r.heim_team, r.heim_wappen, false,

      leer.appendChild(make("h4", null, t("tvtKeinGegner")));

  // ---------- Team-Profil ----------

  function teamOeffnen(teamId, name, zurueck){
    var eigenes = meineTeams.filter(function(x){ return x.id === teamId; })[0];
    if (eigenes) openModal(teamPanel(eigenes));
    else openModal(fremdesTeamPanel(teamId, name, zurueck));

    box.appendChild(make("p","hint", t("bewAnzahl", n.anzahl)));

  function fremdesTeamPanel(teamId, name, zurueck){
    return function(panel){
      clear(panel);
      panel.appendChild(make("h2", null, name || "—"));
      var lead = make("p","lead", "…");

      var inhalt = make("div");

    var kap = kapitaenTeams();

  function gegnerGesuchtPanel(){
    var bezirkWahl = "";
    var niveauWahl = "";
    return function(panel){
      clear(panel);
      panel.appendChild(make("h2", null, t("tvtGegnerGesucht")));
      panel.appendChild(make("p","lead", t("tvtGegnerLead")));

      var liste = make("div");
      var filterBox = make("div","chips filterzeile");
      if (gegnerListe.length >= 4){
        var bSel = select("gg-bez", bezirkOptionen(), bezirkWahl);
        bSel.className = "chip";
        var lSel = select("gg-lvl",
          [{ value:"", label:t("tvtAlleNiveaus") }].concat(levelOptions()), niveauWahl);
        lSel.className = "chip";
        var neuMalen = function(){
          bezirkWahl = bSel.value;
          niveauWahl = lSel.value;
          fuellen();
        };
        bSel.addEventListener("change", neuMalen);
        lSel.addEventListener("change", neuMalen);
        filterBox.appendChild(bSel);
        filterBox.appendChild(lSel);
        panel.appendChild(filterBox);
      }
      panel.appendChild(liste);

      function fuellen(){
        clear(liste);
        var rows = gegnerListe.filter(function(x){
          if (bezirkWahl && String(x.bezirk) !== String(bezirkWahl)) return false;
          if (niveauWahl && x.niveau !== niveauWahl) return false;
          return true;
        });
        if (!rows.length){
          if (gegnerListe.length){
            liste.appendChild(make("p","muted-line", t("tvtFilterLeer", gegnerListe.length)));
            var zur = make("button","minibtn leise", t("tvtFilterZurueck"));
            zur.type = "button";
            zur.addEventListener("click", function(){
              bezirkWahl = ""; niveauWahl = "";
              openModal(gegnerGesuchtPanel());
            });
            liste.appendChild(zur);
          } else {
            gegnerLeerZustand(liste);
          }
          return;
        }
        var letzterTag = null;
        rows.forEach(function(row){
          var kopf = tagKopf(row.beginn);
          if (kopf !== letzterTag){
            liste.appendChild(make("p","tagkopf", kopf));
            letzterTag = kopf;
          }
          liste.appendChild(gegnerKarte(row));
        });
      }
      fuellen();

      var zu = make("button","quiet-link", t("cancel"));
      zu.type = "button";
      zu.addEventListener("click", closeModal);
      panel.appendChild(zu);
    };
  }

  // ---------- Ausschreiben ----------

  function ausschreibenStarten(team){
    if (needAccount()) return;
    closeModal();
    pinModusAn("teamspiel", team || kapitaenTeams()[0] || null);
  }

  function ausschreibenPanel(opts){
    var venue = opts.venue || null;
    var vorTeam = opts.team || null;
    var match = opts.match || null;
    return function(panel){
      clear(panel);
      var aendern = !!match;
      panel.appendChild(make("h2", null, aendern ? t("tvtAendern") : t("tvtSpielAusschreiben")));

      var lead = make("p","lead");
      lead.appendChild(document.createTextNode((venue ? venue.name : "—") + " · "));
      var wechsel = make("button","linkish", t("tvtPlatzAendern"));
      wechsel.type = "button";
      wechsel.addEventListener("click", function(){
        var merken = { match: match, werte: sammeln() };
        var team = teamWahl();
        closeModal();
        pinModusAn("teamspiel", team, merken);
      });
      lead.appendChild(wechsel);
      panel.appendChild(lead);

      var msg = make("div","err"); msg.hidden = true; panel.appendChild(msg);
      var hinweis = make("div","info"); hinweis.hidden = true; panel.appendChild(hinweis);

      var kap = kapitaenTeams();
      var teamSel = null;
      var festesTeam = vorTeam || kap[0] || null;
      if (!aendern && kap.length > 1){
        teamSel = select("ts-team", kap.map(function(x){ return { value:String(x.id), label:x.name }; }),
          festesTeam ? String(festesTeam.id) : "");
        panel.appendChild(field(t("tvtEuerTeam"), teamSel));
      }
      function teamWahl(){
        if (teamSel) return kap.filter(function(x){ return String(x.id) === teamSel.value; })[0] || festesTeam;
        return festesTeam;
      }

      var start = match ? new Date(match.beginn) : new Date(Date.now() + 24 * 3600 * 1000);
      var dateIn = input("ts-date","date","");
      dateIn.value = isoDate(start);
      var timeIn = input("ts-time","time","");
      timeIn.value = match ? (zweiStellen(start.getHours()) + ":" + zweiStellen(start.getMinutes())) : "18:00";
      var two = make("div","two");
      two.appendChild(field(t("dateL"), dateIn));
      two.appendChild(field(t("timeL"), timeIn));
      panel.appendChild(two);

      var fmtSel = select("ts-fmt", [
        {value:"3v3",label:"3 vs 3"},{value:"4v4",label:"4 vs 4"},{value:"5v5",label:"5 vs 5"},
        {value:"6v6",label:"6 vs 6"},{value:"7v7",label:"7 vs 7"},{value:"9v9",label:"9 vs 9"},
        {value:"11v11",label:"11 vs 11"}
      ], match ? match.format : "5v5");
      var durSel = select("ts-dur", [
        {value:"60",label:"60 " + t("minutes")},{value:"90",label:"90 " + t("minutes")},
        {value:"120",label:"120 " + t("minutes")}
      ], String((match && match.dauer_min) || 90));
      var two2 = make("div","two");
      two2.appendChild(field(t("formatL"), fmtSel));
      two2.appendChild(field(t("durationL"), durSel));
      panel.appendChild(two2);

      var lvlSel = select("ts-lvl", levelOptions(),
        (match && match.niveau) || (festesTeam && festesTeam.niveau) || "freizeit");
      var costIn = input("ts-cost","number","€");
      costIn.value = String(((match && match.kosten_cent) || 0) / 100);
      costIn.min = "0"; costIn.step = "0.5";
      var two3 = make("div","two");
      two3.appendChild(field(t("levelL"), lvlSel));
      two3.appendChild(field(t("tvtKostenProKopf"), costIn));
      panel.appendChild(two3);

      var noteIn = input("ts-note","text", t("notePlaceholder"));
      noteIn.maxLength = 200;
      noteIn.value = (match && match.notiz) || "";
      panel.appendChild(field(t("noteL"), noteIn));

      function pruefeGroesse(){
        var team = teamWahl();
        var noetig = formatGroesse(fmtSel.value);
        if (team && team.mitglieder && team.mitglieder < noetig){
          hinweis.textContent = t("tvtWenigeMitglieder");
          hinweis.hidden = false;
        } else {
          hinweis.hidden = true;
        }
      }
      fmtSel.addEventListener("change", pruefeGroesse);
      if (teamSel) teamSel.addEventListener("change", pruefeGroesse);
      pruefeGroesse();

      function sammeln(){
        return {
          datum: dateIn.value, zeit: timeIn.value, format: fmtSel.value,
          dauer: durSel.value, niveau: lvlSel.value, kosten: costIn.value, notiz: noteIn.value
        };
      }
      if (opts.werte){
        var w = opts.werte;
        if (w.datum) dateIn.value = w.datum;
        if (w.zeit) timeIn.value = w.zeit;
        if (w.format) fmtSel.value = w.format;
        if (w.dauer) durSel.value = w.dauer;
        if (w.niveau) lvlSel.value = w.niveau;
        if (w.kosten !== undefined) costIn.value = w.kosten;
        if (w.notiz) noteIn.value = w.notiz;
      }

      panel.appendChild(make("p","hint", t("tvtAendernHinweis")));

      var go = make("button","btn", aendern ? t("save") : t("tvtAusschreibenBtn"));
      go.type = "button";
      go.addEventListener("click", function(){
        var team = teamWahl();
        if (!venue){ msg.textContent = t("tvtKeinPlatz"); msg.hidden = false; return; }
        if (!team){ msg.textContent = t("tvtNurKapitaenZusagen"); msg.hidden = false; return; }
        var beginn = new Date(dateIn.value + "T" + timeIn.value + ":00");
        if (isNaN(beginn.getTime()) || beginn.getTime() <= Date.now() - 3600000){
          msg.textContent = t("timeInPast"); msg.hidden = false; return;
        }
        if (beginn.getTime() > Date.now() + 60 * 86400000){
          msg.textContent = t("tooFar"); msg.hidden = false; return;
        }
        if (!aendern){
          var offene = teamSpiele.filter(function(x){
            return x.heim_team_id === team.id && !x.gast_team_id && x.status === "geplant" &&
                   new Date(x.beginn).getTime() > Date.now();
          });
          if (offene.length >= 3){ msg.textContent = t("tvtDreiOffen"); msg.hidden = false; return; }
        }
        msg.hidden = true;
        go.disabled = true;
        var args = {
          p_venue: venue.id,
          p_beginn: beginn.toISOString(),
          p_dauer: Number(durSel.value),
          p_format: fmtSel.value,
          p_niveau: lvlSel.value,
          p_kosten: Math.round((Number(costIn.value) || 0) * 100),
          p_notiz: noteIn.value.trim() || null
        };
        var ruf;
        if (aendern){
          args.p_match = match.id;
          ruf = sb.rpc("team_spiel_aendern", args);
        } else {
          args.p_team = team.id;
          ruf = sb.rpc("team_spiel_ausschreiben", args);
        }
        ruf.then(function(res){
          go.disabled = false;
          if (res.error){
            var m = String(res.error.message || "");
            msg.textContent = (m.indexOf("drei offene") !== -1) ? t("tvtDreiOffen") : m;
            msg.hidden = false;
            return;
          }
          platzMerken(venue.id);
          var neueId = aendern ? match.id : Number(res.data);
          loadGames().then(ladeTeamKram).then(function(){
            toast(aendern ? t("spielGespeichert") : t("tvtAusgeschrieben"));
            renderFeed();
            openModal(tvtPanel(neueId));
          });
        }).catch(function(e){
          go.disabled = false;
          msg.textContent = String(e && e.message ? e.message : e);
          msg.hidden = false;
        });
      });
      panel.appendChild(go);

      var zu = make("button","quiet-link", t("cancel"));
      zu.type = "button";
      zu.addEventListener("click", function(){
        if (match) openModal(tvtPanel(match.id)); else closeModal();
      });
      panel.appendChild(zu);
    };
  }

  // ---------- Aufstellung melden ----------

  function aufstellungPanel(id, teamId, teamName, zurueck){
    return function(panel){
      clear(panel);
      panel.appendChild(make("h2", null, t("tvtAufTitel")));
      panel.appendChild(make("p","lead", (teamName || "—") + " · " + t("tvtAufLead")));
      var msg = make("div","err"); msg.hidden = true; panel.appendChild(msg);
      var grenze = make("div","info"); grenze.hidden = true; panel.appendChild(grenze);

      var zaehler = make("p","feedkopf", "…");
      panel.appendChild(zaehler);
      var unterzeile = make("p","hint", "");
      unterzeile.style.textAlign = "left";
      panel.appendChild(unterzeile);

      var liste = make("div");
      panel.appendChild(liste);
      liste.appendChild(make("div","skelett"));

      var go = make("button","btn", t("tvtAufSpeichern"));
      go.type = "button";
      go.disabled = true;
      panel.appendChild(go);

      var zu = make("button","quiet-link", t("cancel"));
      zu.type = "button";
      panel.appendChild(zu);

      var gewaehlt = {};
      var ausgangs = "";
      var maxGroesse = 11;

      function zurueckGehen(){
        if (JSON.stringify(gewaehlteListe()) !== ausgangs && !window.confirm(t("tvtAufVerwerfen"))) return;
        if (zurueck) openModal(zurueck); else closeModal();
      }
      zu.addEventListener("click", zurueckGehen);

      function gewaehlteListe(){
        return Object.keys(gewaehlt).filter(function(k){ return gewaehlt[k]; }).sort();
      }

      sb.rpc("team_aufstellung", { p_match: id }).then(function(res){
        clear(liste);
        var alle = alsListe(res).filter(function(x){ return x.team_id === teamId; });
        if (!alle.length){ liste.appendChild(make("p","muted-line", "—")); return; }
        maxGroesse = alle[0].max_groesse || (formatGroesse("11v11") + 3);
        var soll = alle[0].soll_groesse || 5;
        unterzeile.textContent = soll + "v" + soll + " " + t("tvtPlusDrei");
        alle.forEach(function(sp){ if (sp.aufgestellt) gewaehlt[sp.user_id] = true; });
        ausgangs = JSON.stringify(gewaehlteListe());
        go.disabled = false;

        var zeilen = [];
        alle.forEach(function(sp){
          var z = make("button","wahlzeile");
          z.type = "button";
          z.appendChild(avatarVon(sp));
          var wer = make("span","wer");
          wer.appendChild(make("strong", null, sp.anzeigename || "—"));
          var unten = [];
          if (sp.ist_kapitaen) unten.push(t("teamKapitaen"));
          if (sp.spielt_beim_gegner) unten.push(t("tvtAufBeimGegner"));
          else if (sp.status === "abgesagt") unten.push(t("tvtAufAbgesagt"));
          wer.appendChild(make("span", null, unten.join(" · ")));
          z.appendChild(wer);
          var haken = make("span","haken", sp.spielt_beim_gegner ? "–" : "✓");
          z.appendChild(haken);
          if (sp.spielt_beim_gegner){
            z.classList.add("gesperrt");
            z.disabled = true;
          } else {
            z.addEventListener("click", function(){
              if (!gewaehlt[sp.user_id] && gewaehlteListe().length >= maxGroesse){
                grenze.textContent = t("tvtAufGrenze", maxGroesse);
                grenze.hidden = false;
                return;
              }
              gewaehlt[sp.user_id] = !gewaehlt[sp.user_id];
              malen();
            });
          }
          z.__sp = sp;
          zeilen.push(z);
          liste.appendChild(z);
        });

        function malen(){
          var n = gewaehlteListe().length;
          zaehler.textContent = vonZahl(n, maxGroesse);
          var voll = n >= maxGroesse;
          if (!voll) grenze.hidden = true;
          zeilen.forEach(function(z){
            var sp = z.__sp;
            var an = !!gewaehlt[sp.user_id];

  function tvtPanel(id, zurueck){
    var selbst = function(p){ return tvtPanel(id, zurueck)(p); };
    return function(panel){
      clear(panel);
      var r = tvtDaten(id);
      if (!r){
        panel.appendChild(make("p","lead", t("tvtWeg")));
        var weg = make("button","quiet-link", t("cancel"));
        weg.type = "button";
        weg.addEventListener("click", function(){ if (zurueck) openModal(zurueck); else closeModal(); });
        panel.appendChild(weg);
        return;
      }

      panel.appendChild(make("h2", null, r.platz));
      panel.appendChild(make("p","lead",
        fmtWhen(r.beginn) + " · " + r.format + " · " + r.dauer_min + " " + t("minutes")));

      var msg = make("div","err"); msg.hidden = true; panel.appendChild(msg);

      if (r.status === "abgesagt"){
        panel.appendChild(make("div","err",
          t("tvtAbgesagt") + (r.absage_grund ? " · " + r.absage_grund : "")));
      } else if (tvtWiederOffen[id] && r.offen){
        panel.appendChild(make("div","info", t("tvtWiederOffen")));
      }

      panel.appendChild(tvtTafel(r, selbst));

      var facts = make("table","facts");
      var tb = make("tbody");
      facts.appendChild(tb);
      function fact(k, v){
        var tr = make("tr");
        tr.appendChild(make("th", null, k));
        tr.appendChild(make("td", null, v));
        tb.appendChild(tr);
      }
      fact(t("levelL"), t(LVLKEY[r.niveau] || "lvlFreizeit"));
      fact(t("costShort"), money(r.kosten_cent));
      fact(t("district"), districtName(r.bezirk));
      if (r.notiz) fact(t("noteL"), r.notiz);
      panel.appendChild(facts);

      var eigenerKapitaen = !!(session && r.eigenes && r.mein_team_id === r.heim_team_id && r.bin_kapitaen);
      if (!eigenerKapitaen && r.offen && r.heim_kapitaen) eigenerKapitaen = true;

      if (r.gast_team_id){
        tvtAufstellungBlock(panel, r, selbst);
        var darfSchreiben = !!(session && r.mein_team_id && r.status === "geplant");
        var gegnerName = r.wir_sind_heim === false ? r.heim_team : r.gast_team;
        if (session && r.mein_team_id){
          chatBlock(panel, id, darfSchreiben, {
            meineSeite: r.wir_sind_heim === false ? "gast" : "heim",
            gegner: gegnerName,
            nurLesen: !darfSchreiben,
            zurueck: selbst
          });
        }
      } else {
        panel.appendChild(make("p","section-label", t("chat")));
        panel.appendChild(make("p","muted-line", t("tvtChatStartet")));
      }

      if (r.status === "geplant" && r.offen){
        if (eigenerKapitaen){
          var aend = make("button","btn", t("tvtAendern"));
          aend.type = "button";
          aend.addEventListener("click", function(){
            stopChat();
            openModal(ausschreibenPanel({
              venue: { id: r.venue_id, name: r.platz },
              match: { id: r.id, beginn: r.beginn, format: r.format, dauer_min: r.dauer_min,
                       niveau: r.niveau, kosten_cent: r.kosten_cent, notiz: r.notiz }
            }));
          });
          panel.appendChild(aend);
        } else {
          tvtZusagenBlock(panel, r, msg);
        }
      }

      var teilen = make("button","btn secondary", t("teilenBtn"));
      teilen.type = "button";
      teilen.style.marginTop = "9px";
      teilen.addEventListener("click", function(){
        spielTeilen({ id: r.id, platz: r.platz, beginn: r.beginn, format: r.format });
      });
      panel.appendChild(teilen);

      if (session && !r.eigenes && !r.mein_team_id && r.heim_team_id){
        var ans = make("button","btn secondary", t("tvtTeamAnsehen"));
        ans.type = "button";
        ans.style.marginTop = "9px";
        ans.addEventListener("click", function(){
          stopChat();
          teamOeffnen(r.heim_team_id, r.heim_team, selbst);
        });
        panel.appendChild(ans);
      }

      if (r.status === "geplant" && r.gast_team_id && session && r.mein_team_id &&
          r.mein_status === "zugesagt"){
        var raus = make("button","btn secondary", t("tvtKannNicht"));
        raus.type = "button";
        raus.style.marginTop = "9px";
        raus.addEventListener("click", function(){
          if (!window.confirm(t("tvtKannNichtAsk"))) return;
          raus.disabled = true;
          sb.rpc("team_aufstellung_selbst_absagen", { p_match: id }).then(function(res){
            raus.disabled = false;
            if (res.error){ msg.textContent = res.error.message; msg.hidden = false; return; }
            loadMyPart().then(loadGames).then(ladeTeamKram).then(function(){
              toast(t("tvtAbgemeldet"));
              renderFeed();
              stopChat();
              openModal(tvtPanel(id, zurueck));
            });
          });
        });
        panel.appendChild(raus);
      }

      if (r.status === "geplant" && r.bin_kapitaen && r.gast_team_id){
        var ab = make("button","danger-link", t("tvtAbsagen"));
        ab.type = "button";
        ab.addEventListener("click", function(){
          stopChat();
          openModal(tvtAbsagenPanel(id, selbst));
        });
        panel.appendChild(ab);
      }

      if (r.status === "geplant" && r.offen && eigenerKapitaen){
        var zurueckZiehen = make("button","danger-link", t("tvtZuruecknehmen"));
        zurueckZiehen.type = "button";
        zurueckZiehen.addEventListener("click", function(){
          if (!window.confirm(t("tvtZuruecknehmenAsk"))) return;
          zurueckZiehen.disabled = true;
          sb.rpc("team_spiel_zuruecknehmen", { p_match: id }).then(function(res){
            zurueckZiehen.disabled = false;
            if (res.error){ msg.textContent = res.error.message; msg.hidden = false; return; }
            loadGames().then(ladeTeamKram).then(function(){
              toast(t("tvtZurueckgenommen"));
              renderFeed();
              closeModal();
            });
          });
        });
        panel.appendChild(zurueckZiehen);
      }

      if (session && !r.eigenes){
        var mel = make("button","quiet-link", t("reportBtn"));
        mel.type = "button";
        mel.addEventListener("click", function(){
          stopChat();
          openModal(reportPanel("spiel", id, selbst));
        });

      var close = make("button","quiet-link", t("cancel"));
      close.type = "button";
      close.addEventListener("click", function(){ if (zurueck) openModal(zurueck); else closeModal(); });
      panel.appendChild(close);

  // Das eigene Profil kommt ueber mein_profil(). Die Funktion liefert nur die
  // Zeile des Aufrufers und laeuft mit erhoehten Rechten - deshalb duerfen die
  // geschuetzten Spalten (Geburtsjahr, Ueber mich, Sichtbarkeitsschalter) fuer
  // authenticated gesperrt bleiben, ohne dass man sein eigenes Profil verliert.
  function loadProfile(){
    if (!session){ profile = null; renderAccount(); return Promise.resolve(); }
    return sb.rpc("mein_profil")
      .then(function(res){
        profile = (res.data && res.data[0]) || null;
        renderAccount();
        if (!profile){ openModal(profilePanel(true), true); return; }
        // Ohne Geburtsjahr gilt ein Konto als minderjaehrig. Einmal
        // verpflichtend nachfragen, nicht wegklickbar.
        if (profile.geburtsjahr == null) openModal(geburtsjahrPanel(), true);
      })
      .catch(function(){ renderAccount(); });
  }

    myPart = {};
    if (!session) return Promise.resolve();
    return sb.from("spieler_public").select("match_id,status").eq("user_id", session.user.id)
      .then(function(res){
        (res.data || []).forEach(function(r){
          if (r.status !== "abgesagt") myPart[r.match_id] = r.status;
        });
      }).catch(function(){});

      .then(function(res){ freunde = res.data || []; })

    einladungen = [];

  function loadGames(){
    var seit = new Date(Date.now() - 2 * 3600 * 1000).toISOString();
    return sb.from("matches_public").select("*")
      .eq("status","geplant").gte("beginn", seit).order("beginn").limit(500)
      .then(function(res){
        if (res.error) return;
        games = res.data || [];
        venuesWithGames = {};
        games.forEach(function(g){
          venuesWithGames[g.venue_id] = (venuesWithGames[g.venue_id] || 0) + 1;
        });
        applyFilters();
        if (selectedId !== null) renderSheetGames(selectedId);
        if (ansicht !== "karte") renderFeed();
      }).catch(function(){});
  }

  function loadVenues(){
    return sb.from("venues_public").select("id,name,bezirk,art,belag,beleuchtung,zugang,geprueft,lat,lon")
      .order("name").limit(2000)
      .then(function(res){
        if (res.error){ toast(t("loadError") + res.error.message); return; }
        venues = res.data || [];
        applyFilters();
      }).catch(function(e){ toast(t("loadError") + String(e)); });

    el("sheetMelden").textContent = t("meldenSheet");
    el("pinbannerText").textContent = pinBannerText();
    el("pinbannerAbbrechen").textContent = t("meldenPinAbbrechen");
    el("myGamesBtn").textContent = t("myGames");
    el("tabSpieleText").textContent = t("tabSpiele");
    el("tabKarteText").textContent = t("tabKarte");
    el("tabTeamsText").textContent = t("tabTeams");
    el("tabFreundeText").textContent = t("tabFreunde");
    el("tabMeineText").textContent = t("tabMeine");
    el("tabProfilText").textContent = t("tabProfil");
    el("fabNeuText").textContent = t("fabNeuesSpiel");
    if (ansicht !== "karte") renderFeed();
    el("langBtn").textContent = lang === "de" ? "EN" : "DE";
    document.documentElement.lang = lang;
    buildArtSelect();
    buildDistrictSelect();
    renderAccount();
  }

  function wire(){
    el("search").addEventListener("input", function(e){ query = e.target.value; applyFilters(); });
    el("artSelect").addEventListener("change", function(e){
      filterArt = e.target.value || null;
      applyFilters();
    });
    var eigPanel = el("eigenschaftenPanel");
    var eigBtn = el("eigenschaftenBtn");
    eigBtn.addEventListener("click", function(e){
      e.stopPropagation();
      var warZu = eigPanel.hidden;
      eigPanel.hidden = !warZu;
      eigBtn.setAttribute("aria-expanded", warZu ? "true" : "false");
    });
    document.addEventListener("click", function(e){
      if (!eigPanel.hidden && !el("eigenschaftenDropdown").contains(e.target)){
        eigPanel.hidden = true;
        eigBtn.setAttribute("aria-expanded", "false");
      }
    });
    document.addEventListener("keydown", function(e){
      if (e.key === "Escape" && !eigPanel.hidden){
        eigPanel.hidden = true;
        eigBtn.setAttribute("aria-expanded", "false");
      }
    });
    el("cbLit").addEventListener("change", function(e){
      filterLit = e.target.checked;
      malEigenschaftenBtn();
      applyFilters();
    });
    el("cbFree").addEventListener("change", function(e){
      filterFree = e.target.checked;
      malEigenschaftenBtn();
      applyFilters();
    });
    el("cbGames").addEventListener("change", function(e){
      filterGames = e.target.checked;
      malEigenschaftenBtn();
      applyFilters();
    });
    el("district").addEventListener("change", function(e){
      filterDistrict = Number(e.target.value) || 0;
      applyFilters();
    });
    el("viewToggle").addEventListener("click", function(){
      listMode = !listMode;
      el("list").hidden = !listMode;
      el("map").style.visibility = listMode ? "hidden" : "visible";
      el("viewToggle").textContent = listMode ? t("showMap") : t("showList");
      if (listMode) renderList(); else if (map) map.resize();
    });
    el("resetBtn").addEventListener("click", function(){
      filterArt = null; filterLit = false; filterFree = false; filterGames = false;
      filterDistrict = 0; query = "";
      el("search").value = "";
      el("artSelect").value = "";
      el("cbLit").checked = false;
      el("cbFree").checked = false;
      el("cbGames").checked = false;
      malEigenschaftenBtn();
      el("district").value = "0";
      applyFilters();
    });
    el("sheetClose").addEventListener("click", closeSheet);
    wischZumSchliessen(el("sheet"), closeSheet);
    wischZumSchliessen(el("panel"), closeModal);
    wischZurueck(el("panel"));
    el("meldenBtn").addEventListener("click", function(){ pinModusAn("melden"); });
    el("sheetFotoBtn").addEventListener("click", function(){
      if (!selectedVenue) return;
      if (needAccount()) return;
      el("sheetFotoInput").click();
    });
    el("sheetFotoInput").addEventListener("change", function(){
      var f = this.files && this.files[0];
      this.value = "";
      fotoHochladen(f);
    });
    el("pinbannerAbbrechen").addEventListener("click", function(){
      var warNeuesSpiel = (pinZweck === "neuesspiel");
      pinModusAus();
      // Abbrechen darf die schon eingetippten Werte nicht wegwerfen.
      if (warNeuesSpiel) openModal(createPanel(null, "offen"));
    });
    el("sheetMelden").addEventListener("click", function(){
      if (!selectedVenue) return;
      if (needAccount()) return;
      openModal(meldePanel("falsch", selectedVenue, null));
    });
    el("sheetOrganize").addEventListener("click", function(){
      if (!selectedVenue) return;
      if (needAccount()) return;
      openModal(createPanel(selectedVenue));
    });
    el("sheetTeamSpiel").addEventListener("click", function(){
      if (!selectedVenue) return;
      if (needAccount()) return;
      var kap = kapitaenTeams();
      if (!kap.length) return;
      closeSheet();
      openModal(ausschreibenPanel({ venue: selectedVenue, team: kap[0] }));
    });
    el("myGamesBtn").addEventListener("click", function(){ zeigeAnsicht("meine"); });
    el("tabSpiele").addEventListener("click", function(){ zeigeAnsicht("feed"); });
    el("tabKarte").addEventListener("click", function(){ zeigeAnsicht("karte"); });
    el("tabTeams").addEventListener("click", function(){ zeigeAnsicht("teams"); });
    el("tabFreunde").addEventListener("click", function(){ zeigeAnsicht("freunde"); });
    el("tabMeine").addEventListener("click", function(){ zeigeAnsicht("meine"); });
    el("tabProfil").addEventListener("click", function(){ zeigeAnsicht("profil"); });
    el("fabNeu").addEventListener("click", spielAnlegenStarten);
    el("themeBtn").addEventListener("click", function(){
      var dunkel = document.documentElement.getAttribute("data-theme") === "dark";
      setzeDarstellung(!dunkel);
      malThemeBtn();
    });
    el("langBtn").addEventListener("click", function(){
      lang = lang === "de" ? "en" : "de";
      try { localStorage.setItem("jogavia-lang", lang); } catch(e){}
      applyLanguageToChrome();
      applyFilters();
      if (selectedId !== null) openSheet(selectedId);
    });
    el("accountBtn").addEventListener("click", function(){
      if (!session) openModal(authPanel("login"));
      else openModal(profilePanel(false));
    });
    el("modal").addEventListener("click", function(e){
      if (e.target === el("modal")) closeModal();
    });
    document.addEventListener("keydown", function(e){
      if (e.key === "Escape"){ closeModal(); closeSheet(); }
    });
  }

  function positionMain(){
    document.querySelector("main").style.top = "58px";
    if (ansicht === "karte"){
      el("list").style.paddingTop = (el("controls").offsetHeight + 12) + "px";
    }
  }

  function debugAnzeigen(){
    var vorhandene = [];
    try {
      ["points","clusters","selected"].forEach(function(l){
        if (map && map.getLayer && map.getLayer(l)) vorhandene.push(l);
      });
    } catch(e){}
    var kasten = make("div");
    kasten.style.cssText = "position:fixed;left:10px;right:10px;bottom:10px;z-index:200;background:#181818;" +
      "color:#F1F1F1;padding:14px 16px;border-radius:14px;font-size:12.5px;line-height:1.6;" +
      "white-space:pre-wrap;max-height:50vh;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.4)";
    kasten.textContent =
      "JogaVia Diagnose\n" +
      "Version: " + APP_VERSION + "\n" +
      "Plätze geladen: " + venues.length + " (sichtbar " + filtered.length + ")\n" +
      "Spiele geladen: " + games.length + "\n" +
      "Karten-Ebenen: " + (vorhandene.join(", ") || "KEINE") + "\n" +
      "Karte bereit: " + mapReady + " · Zoom: " + (map && map.getZoom ? Math.round(map.getZoom() * 10) / 10 : "-") + "\n" +
      "Angemeldet: " + (session ? "ja" : "nein") + " · Profil: " + (profile ? "ja" : "nein") + "\n" +
      "Fehler: " + (FEHLER.length ? FEHLER.join(" || ") : "keine");
    var zu = make("button", null, "Schließen");
    zu.type = "button";
    zu.style.cssText = "display:block;margin-top:10px;background:#0066CC;color:#FFFFFF;border:0;" +
      "border-radius:9px;padding:8px 14px;font-weight:700;font-size:13px";
    zu.addEventListener("click", function(){
      if (kasten.parentNode) kasten.parentNode.removeChild(kasten);
    });
    kasten.appendChild(zu);
    document.body.appendChild(kasten);
  }

  var teamLinkErledigt = false;
  function teamAusLink(){
    if (teamLinkErledigt) return;
    var treffer = /[?&]team=([A-Za-z0-9]{4,8})/.exec(location.search || "");
    if (!treffer) return;
    teamLinkErledigt = true;
    if (!session){ openModal(authPanel("login")); return; }
    openModal(teamBeitretenPanel(treffer[1].toUpperCase()));
  }

  var spielLinkErledigt = false;
  function spielAusLink(){
    if (spielLinkErledigt) return;
    var treffer = /[?&]spiel=(\d+)/.exec(location.search || "");
    if (!treffer) return;
    var id = Number(treffer[1]);
    if (!games.some(function(g){ return g.id === id; })) return;
    spielLinkErledigt = true;
    openModal(gamePanel(id));
  }

  function boot(){
    try {
      applyLanguageToChrome();
      wire();
      buildMap();
      zeigeAnsicht("karte");
      positionMain();
      window.addEventListener("resize", positionMain);
      if (location.search.indexOf("debug") !== -1) setTimeout(debugAnzeigen, 2000);
      var tipps = 0, tippZeit = 0;
      var marke = document.querySelector(".brand");
      if (marke) marke.addEventListener("click", function(){
        var jetzt = Date.now();
        tipps = (jetzt - tippZeit < 900) ? tipps + 1 : 1;
        tippZeit = jetzt;
        if (tipps >= 3){ tipps = 0; debugAnzeigen(); }
      });
      var wiederherstellung = (location.hash || "").indexOf("type=recovery") !== -1;

      loadVenues().then(loadGames).then(spielAusLink);
      sb.auth.getSession().then(function(res){
        session = res.data.session;
        loadProfile().then(loadMyPart).then(loadBlocked).then(loadFreunde).then(loadEinladungen)
          .then(ladeVergangene).then(ladeTeams).then(ladeTeamKram).then(loadGames)
          .then(punkteSetzen).then(spielAusLink).then(teamAusLink);
      });
      sb.auth.onAuthStateChange(function(evt, s){
        session = s;
        if (evt === "PASSWORD_RECOVERY" || wiederherstellung){
          wiederherstellung = false;
          openModal(pwNeuPanel(), true);
        }
        loadProfile().then(loadMyPart).then(loadBlocked).then(loadFreunde).then(loadEinladungen)
          .then(ladeVergangene).then(ladeTeams).then(ladeTeamKram).then(loadGames)
          .then(punkteSetzen);
      });
    } catch (err){
      var box = make("div","err");
      box.style.position = "fixed";
      box.style.top = "64px"; box.style.left = "14px"; box.style.right = "14px"; box.style.zIndex = "99";
      box.textContent = "Fehler beim Start: " + (err && err.message ? err.message : String(err));
      document.body.appendChild(box);
    }
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
</body>
</html>
