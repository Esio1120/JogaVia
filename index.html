<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212" id="themeColorMeta">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="light dark">
<script>
  try {
    if (localStorage.getItem("jogavia-theme") !== "light") {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  } catch(e){}
</script>
<title>JogaVia — Fußball in Wien</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="apple-touch-icon" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root{
    color-scheme: light;
    --paper:#FFFFFF;
    --surface:#EDEDED;
    --sand:#E4E4E4;
    --sand-deep:#D6D6D6;
    --ink:#181818;
    --muted:#6C6C6C;
    --line:#D9D9D9;
    --line-strong:#C2C2C2;
    --accent:#0066CC;
    --accent-deep:#004F9E;
    --accent-soft:#E4F0FC;
    --accent-soft-line:#BEDCF7;
    --clay:#A65A3A;
    --clay-soft:#F7EAE2;
    --shadow-s:0 1px 2px rgba(0,0,0,.05);
    --shadow-m:0 2px 6px rgba(0,0,0,.06), 0 14px 28px -20px rgba(0,0,0,.28);
    --display:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    --ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    --r:10px;
    --r-sm:8px;
    --top:58px;
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --paper:#121212;
    --surface:#262626;
    --sand:#2E2E2E;
    --sand-deep:#383838;
    --ink:#F1F1F1;
    --muted:#A3A3A3;
    --line:#3D3D3D;
    --line-strong:#525252;
    --accent:#0066CC;
    --accent-deep:#5FA8E8;
    --accent-soft:#0D2A45;
    --accent-soft-line:#1B4066;
    --clay:#C97A54;
    --clay-soft:#3A2620;
    --shadow-s:0 1px 2px rgba(0,0,0,.3);
    --shadow-m:0 2px 6px rgba(0,0,0,.35), 0 14px 28px -20px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--ui);font-size:15.5px;line-height:1.5;
    -webkit-font-smoothing:antialiased;overscroll-behavior:none;
  }
  button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
  input,select{font-family:inherit;font-size:16px;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .label{font-size:12.5px;font-weight:600;letter-spacing:.04em;color:var(--muted)}

  header{
    position:fixed;top:0;left:0;right:0;height:var(--top);z-index:30;
    display:flex;align-items:center;gap:10px;padding:0 14px;
    background:var(--surface);border-bottom:1px solid var(--line);
  }
  .brand{
    display:flex;align-items:center;
    font-family:"Space Grotesk",var(--display);font-weight:700;font-size:22px;line-height:1;letter-spacing:-.01em;user-select:none;
    background:var(--accent);color:#FFFFFF;
    padding:7px 13px;border-radius:var(--r-sm);
  }
  .brand span{color:#FFFFFF}
  .grow{flex:1}
  .ghost{
    background:var(--sand);border:1px solid var(--line-strong);color:var(--ink);
    border-radius:var(--r-sm);padding:7px 14px;font-weight:600;font-size:13.5px;white-space:nowrap;
  }
  .ghost:hover{border-color:var(--accent);color:var(--accent-deep)}
  .avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid var(--accent-soft);display:block}
  .avatar-fallback{
    width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent-deep);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13.5px;flex:0 0 auto;
  }
  #accountBtn{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}

  #controls{
    position:fixed;top:var(--top);left:0;right:0;z-index:20;
    padding:11px 14px 9px;display:flex;flex-direction:column;gap:9px;
    pointer-events:none;
  }
  #controls > *{pointer-events:auto}
  #search{
    width:100%;padding:10px 13px;border:1px solid var(--line-strong);border-radius:11px;
    background:color-mix(in srgb, var(--paper) 88%, transparent);color:var(--ink);
    box-shadow:var(--shadow-m);
  }
  #search::placeholder{color:var(--muted)}
  .chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .chips::-webkit-scrollbar{display:none}
  .filterrow{display:flex;gap:7px;overflow-x:visible;padding-bottom:2px;flex-wrap:nowrap}
  .filterrow select.chip{max-width:118px;overflow:hidden;text-overflow:ellipsis}
  .chip{
    flex:0 0 auto;border:1px solid var(--line-strong);
    background:color-mix(in srgb, var(--surface) 88%, transparent);color:var(--muted);
    border-radius:var(--r-sm);padding:7px 13px;font-size:13.5px;font-weight:600;white-space:nowrap;
    display:flex;align-items:center;gap:7px;box-shadow:var(--shadow-s);
  }
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#FFFFFF}
  .chip .dot{width:9px;height:9px;border-radius:50%;background:currentColor;opacity:.9}
  select.chip{background:var(--surface);padding-right:10px}
  .dropdown{position:relative;flex:0 0 auto}
  .dropdown-panel{
    position:absolute;top:calc(100% + 6px);left:0;z-index:25;min-width:210px;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow-m);padding:6px;display:flex;flex-direction:column;gap:1px;
  }
  .dropdown-item{
    display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:8px;
    font-size:14px;color:var(--ink);cursor:pointer;
  }
  .dropdown-item:hover{background:var(--sand)}
  .dropdown-item input{accent-color:var(--accent);width:17px;height:17px;flex:0 0 auto}
  .statusline{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
  .linkish{background:none;border:0;color:var(--accent-deep);font-size:13px;font-weight:600;padding:0}
  .linkish:hover{text-decoration:underline;text-underline-offset:3px}

  main{position:absolute;top:0;bottom:0;left:0;right:0}
  #map{position:absolute;inset:0}
  #list{position:absolute;inset:0;overflow-y:auto;background:var(--paper);padding:12px 14px calc(150px + env(safe-area-inset-bottom))}
  .row{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:13px 15px;margin-bottom:9px;display:flex;gap:12px;align-items:flex-start;width:100%;
    text-align:left;box-shadow:var(--shadow-s);
  }
  .row:hover{border-color:var(--accent);box-shadow:var(--shadow-m)}
  .row .marker{width:11px;height:11px;border-radius:50%;flex:0 0 auto;margin-top:6px}
  .row h3{margin:0 0 2px;font-size:15.5px;font-weight:700;font-family:var(--display);letter-spacing:-.01em}
  .row p{margin:0;font-size:13.5px;color:var(--muted)}
  .row .count-badge{margin-left:auto;flex:0 0 auto}
  .empty{text-align:center;color:var(--muted);padding:36px 20px}

  .maplibregl-ctrl-attrib{font-size:10px;background:rgba(255,255,255,.8)}

  #sheet{
    position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));z-index:40;
    background:var(--surface);border-top:1px solid var(--line);
    border-radius:20px 20px 0 0;box-shadow:var(--shadow-m);
    padding:16px 18px calc(18px + env(safe-area-inset-bottom));
    transform:translateY(110%);transition:transform .22s ease;max-height:76vh;overflow-y:auto;
  }
  #sheet.open{transform:translateY(0)}
  @media (prefers-reduced-motion:reduce){#sheet{transition:none}}
  @media (min-width:760px){
    #sheet{left:auto;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));width:400px;border-radius:var(--r);border:1px solid var(--line)}
  }
  .sheet-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:11px}
  .sheet-head h2{margin:0;font-family:var(--display);font-size:22px;font-weight:600;line-height:1.2;flex:1;letter-spacing:-.01em}
  .closebtn{background:none;border:0;color:var(--muted);font-size:24px;line-height:1;padding:0 4px}
  .badges{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:13px}
  .badge{
    font-size:12px;font-weight:600;letter-spacing:.02em;
    padding:4px 10px;border-radius:var(--r-sm);background:var(--sand);color:var(--muted);border:1px solid var(--line);
  }
  .badge.on{background:var(--accent-soft);color:var(--accent-deep);border-color:var(--accent-soft-line)}
  .badge.warn{background:var(--clay-soft);color:var(--clay);border-color:#EED9CC}
  .facts{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:14.5px}
  .facts th{text-align:left;font-weight:400;color:var(--muted);padding:6px 0}
  .facts td{text-align:right;padding:6px 0;font-weight:600}
  .section-label{
    font-family:var(--display);font-size:16px;font-weight:600;margin:4px 0 9px;letter-spacing:-.01em;
  }
  .muted-line{color:var(--muted);font-size:14px;margin:0 0 14px}
  .actions{display:flex;flex-direction:column;gap:9px}
  .btn{
    display:block;width:100%;text-align:center;text-decoration:none;
    background:var(--accent);color:#FFFFFF;border:0;border-radius:12px;
    padding:13px;font-weight:700;font-size:15.5px;
  }
  .btn:hover{background:var(--accent-deep)}
  .btn.secondary{background:var(--sand);color:var(--ink);border:1px solid var(--line-strong)}
  .btn.secondary:hover{background:var(--sand-deep)}
  .btn[disabled]{opacity:.55;cursor:not-allowed}
  .hint{font-size:12.5px;color:var(--muted);margin:10px 0 0;text-align:center}

  #pinbanner{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(74px + env(safe-area-inset-bottom));z-index:46;
    background:var(--ink);color:var(--paper);border-radius:13px;
    padding:11px 14px;display:flex;align-items:center;gap:12px;
    box-shadow:0 12px 28px -12px rgba(46,42,36,.65);
    max-width:min(460px, calc(100vw - 24px));
  }
  #pinbanner span{font-size:13.5px;font-weight:600;line-height:1.35}
  #pinbanner button{
    flex:0 0 auto;background:none;border:0;color:var(--paper);
    font-size:13px;font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:0;
  }
  .sterne{display:flex;gap:2px;flex:0 0 auto}
  .sterne button{
    background:none;border:0;padding:0;font-size:19px;line-height:1;
    color:var(--line-strong);
    min-width:40px;min-height:40px;display:flex;align-items:center;justify-content:center;
  }
  .sterne button.an{color:#DFA132}
  .sterne span{font-size:17px;line-height:1;color:var(--line-strong)}
  .sterne span.an{color:#DFA132}
  .sternzeile{display:flex;align-items:center;gap:10px;margin:0 0 9px}
  .sternzeile .was{flex:1;min-width:0;font-size:14px}
  .sternzeile .wert{font-size:12.5px;color:var(--muted);min-width:26px;text-align:right}
  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:2px 0 16px}
  .statbox{background:var(--sand);border-radius:12px;padding:10px 12px}
  .statbox b{display:block;font-family:var(--display);font-size:21px;font-weight:600;line-height:1.15}
  .statbox span{font-size:12px;color:var(--muted)}
  .profilkopf{display:flex;align-items:center;gap:12px;margin:0 0 14px}
  .profilkopf img.avatar,.profilkopf .avatar-fallback{width:58px;height:58px;font-size:19px;flex:0 0 auto}
  .profilkopf .wer{min-width:0}
  .profilkopf .wer strong{display:block;font-family:var(--display);font-size:21px;font-weight:600}
  .profilkopf .wer span{display:block;font-size:13px;color:var(--muted)}
  .namebtn{
    background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit;
    flex:1 1 auto;min-width:104px;font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .namebtn:hover{text-decoration:underline;text-underline-offset:3px}
  .person button.wer{background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit}
  .bilder{
    display:flex;gap:8px;overflow-x:auto;margin:12px 0 6px;padding-bottom:2px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .bilder::-webkit-scrollbar{height:0}
  .bilder{scroll-snap-type:x proximity}
  .bild{scroll-snap-align:start}
  .galleiste{display:flex;align-items:center;justify-content:center;gap:14px;margin:-4px 0 14px}
  .galleiste .pfeil{
    background:var(--sand);border:1px solid var(--line-strong);border-radius:50%;
    width:40px;height:40px;font-size:22px;line-height:1;color:var(--ink);
  }
  .galleiste .pfeil:disabled{opacity:.32}
  .galleiste .zaehler{font-size:13px;color:var(--muted);min-width:56px;text-align:center}
  .bild{
    position:relative;flex:0 0 auto;width:220px;height:140px;padding:0;
    border-radius:12px;overflow:hidden;background:var(--sand);border:1px solid var(--line);
  }
  .bild img{position:absolute;width:256px;height:256px;max-width:none;display:block}
  .bild.foto img{inset:0;width:100%;height:100%;object-fit:cover}
  .bild .marke{
    position:absolute;left:0;right:0;bottom:0;text-align:left;
    background:linear-gradient(rgba(46,42,36,0), rgba(46,42,36,.7));
    color:#FFFFFF;font-size:11px;font-weight:600;padding:16px 9px 6px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .bildzeile{display:flex;align-items:center;gap:10px;margin:0 0 4px}
  .bildzeile .quelle{font-size:11px;color:var(--muted);flex:1;min-width:0}
  .grossbild{
    position:relative;width:100%;height:240px;border-radius:14px;overflow:hidden;
    background:var(--sand);border:1px solid var(--line);margin:0 0 14px;
  }
  .grossbild img{position:absolute;width:256px;height:256px;max-width:none;display:block}
  .grossbild.foto img{inset:0;width:100%;height:100%;object-fit:contain;background:var(--ink)}
  .koordzeile{
    font-size:12.5px;color:var(--muted);background:var(--sand);
    border-radius:10px;padding:9px 11px;margin:0 0 14px;
  }

  .game{
    width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;
    background:var(--paper);border:1px solid var(--line);border-radius:12px;
    padding:11px 13px;margin-bottom:8px;
  }
  .game:hover{border-color:var(--accent);background:var(--surface)}
  .game .when{flex:1 1 auto;min-width:0}
  .game .when strong{display:block;font-size:14.5px;font-weight:700}
  /* Die Angabenzeile darf umbrechen, statt am Rand abgeschnitten zu werden -
     sonst endet sie bei mehreren Pillen rechts als "90 Min · 3,...". */
  .game .when span{display:block;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
  .game .right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:0 0 auto}
  .pill{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:var(--r-sm);background:var(--sand);color:var(--muted);white-space:nowrap}
  .pill.ok{background:var(--accent-soft);color:var(--accent-deep)}
  .pill.warn{background:var(--clay-soft);color:var(--clay)}

  .squad{display:flex;flex-direction:column;gap:8px;margin:4px 0 16px}
  .player{display:flex;align-items:center;gap:10px;font-size:14.5px;flex-wrap:wrap}
  .player .avatar,.player .avatar-fallback{width:30px;height:30px;font-size:12px}
  .player .who{flex:1;font-weight:600}
  .slotbar{height:8px;border-radius:3px;background:var(--sand-deep);overflow:hidden;margin:2px 0 14px}
  .slotbar span{display:block;height:100%;background:var(--accent)}
  .tinylink{background:none;border:0;color:var(--muted);font-size:12px;font-weight:600;padding:2px 4px;text-decoration:underline;text-underline-offset:2px}
  .tinylink:hover{color:var(--clay)}
  .chat{
    max-height:230px;overflow-y:auto;display:flex;flex-direction:column;gap:9px;
    margin:0 0 11px;padding:11px;background:var(--paper);border:1px solid var(--line);border-radius:12px;
  }
  .msg{display:flex;flex-direction:column;max-width:85%}
  .msg .meta{font-size:11.5px;color:var(--muted);margin-bottom:3px}
  .msg .bubble{background:var(--sand);border-radius:12px;padding:8px 12px;font-size:14.5px;line-height:1.4;word-break:break-word}
  .msg.own{align-self:flex-end;align-items:flex-end}
  .msg.own .bubble{background:var(--accent-soft)}
  .msg.wartet .bubble{opacity:.55}
  .chatform{display:flex;gap:8px;margin-bottom:14px}
  .chatform input{
    flex:1;padding:11px 13px;border:1px solid var(--line-strong);border-radius:11px;
    background:var(--paper);color:var(--ink);min-width:0;
  }
  .chatform button{
    flex:0 0 auto;background:var(--accent);color:#FFFFFF;border:0;border-radius:11px;
    padding:11px 16px;font-weight:700;font-size:14.5px;
  }

  .pinmark{display:flex;align-items:center;gap:6px;cursor:pointer}
  .pinmark img{width:30px;height:30px;display:block;flex:0 0 auto;filter:drop-shadow(0 2px 3px rgba(60,48,32,.4))}
  .pinname{
    background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-sm);
    padding:3px 10px;font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap;
    box-shadow:var(--shadow-s);max-width:180px;overflow:hidden;text-overflow:ellipsis;
  }
  .pinmark.mit-spiel .pinname{background:var(--accent);color:#FFFFFF;border-color:var(--accent)}

  #tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:45;
    background:var(--surface);border-top:1px solid var(--line);
    display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .tab{
    flex:1 1 0;min-width:0;position:relative;
    background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:6px 1px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:0;
  }
  .tab svg{width:23px;height:23px;display:block}
  .tab > span:not(.punkt){
    display:block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .tab[aria-current="true"]{color:var(--accent-deep)}
  .tab[aria-current="true"] svg{stroke:var(--accent-deep)}
  .tab .punkt{
    position:absolute;top:4px;left:50%;margin-left:8px;
    width:8px;height:8px;border-radius:50%;background:var(--clay);
  }
  @media (max-width:340px){
    .tab{font-size:10.5px}
    .tab svg{width:21px;height:21px}
  }

  /* Schwebender Knopf "Spiel anlegen" */
  #fabNeu{
    position:fixed;right:14px;z-index:44;
    bottom:calc(74px + env(safe-area-inset-bottom));
    height:52px;padding:0 18px;border:0;border-radius:var(--r);
    background:var(--accent);color:#FFFFFF;
    display:flex;align-items:center;gap:8px;
    font-family:var(--ui);font-size:15px;font-weight:700;white-space:nowrap;
    box-shadow:0 10px 24px -10px rgba(46,42,36,.55);
  }
  #fabNeu:hover{background:var(--accent-deep)}
  #fabNeu svg{width:20px;height:20px;display:block;flex:0 0 auto}

  #feed{
    position:absolute;inset:0;overflow-y:auto;background:var(--paper);
    padding:14px 14px calc(150px + env(safe-area-inset-bottom));
  }
  .feedkopf{
    font-family:var(--display);font-size:24px;font-weight:600;letter-spacing:-.015em;
    margin:2px 0 4px;
  }
  .feedsub{color:var(--muted);font-size:14px;margin:0 0 16px}
  .tagkopf{
    font-family:var(--display);font-size:16px;font-weight:600;color:var(--accent-deep);
    margin:20px 0 9px;padding-bottom:5px;border-bottom:1px solid var(--line);
  }
  .tagkopf:first-of-type{margin-top:4px}
  .feedcard{
    display:block;width:100%;text-align:left;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;
    box-shadow:var(--shadow-s);
  }
  .feedcard:hover{border-color:var(--accent);box-shadow:var(--shadow-m)}
  .feedcard .zeit{font-size:13px;font-weight:700;color:var(--accent-deep);margin-bottom:3px}
  .feedcard h3{font-family:var(--display);font-size:18px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
  .feedcard .details{font-size:13.5px;color:var(--muted);margin:0 0 10px}
  .feedcard .reihe{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

  .suchzeile{display:flex;gap:8px;margin:0 0 16px}
  .suchzeile input{
    flex:1;padding:11px 13px;border:1px solid var(--line-strong);border-radius:11px;
    background:var(--surface);color:var(--ink);min-width:0;
  }
  .suchzeile button{
    flex:0 0 auto;background:var(--accent);color:#FFFFFF;border:0;border-radius:11px;
    padding:11px 16px;font-weight:700;font-size:14.5px;
  }
  .person{
    display:flex;align-items:center;gap:11px;background:var(--surface);
    border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px;
  }
  .person .wer{flex:1;min-width:0}
  .person .wer strong{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .person .wer span{display:block;font-size:12.5px;color:var(--muted)}
  .person .tuen{display:flex;gap:6px;flex:0 0 auto}
  .minibtn{
    background:var(--accent);color:#FFFFFF;border:0;border-radius:9px;
    padding:7px 12px;font-weight:700;font-size:12.5px;white-space:nowrap;
  }
  .minibtn.leise{background:var(--sand);color:var(--ink);border:1px solid var(--line-strong)}

  #modal{position:fixed;inset:0;z-index:50;background:rgba(46,42,36,.42);display:flex;align-items:flex-end;justify-content:center}
  @media (min-width:760px){#modal{align-items:center}}
  .panel{
    background:var(--surface);width:100%;max-width:460px;border-radius:20px 20px 0 0;
    padding:20px 20px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-m);
  }
  @media (min-width:760px){.panel{border-radius:var(--r);padding-bottom:22px}}
  .panel h2{font-family:var(--display);font-weight:600;font-size:25px;margin:0 0 5px;letter-spacing:-.015em;line-height:1.15}
  .panel .lead{margin:0 0 18px;color:var(--muted);font-size:14.5px}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px;letter-spacing:.02em}
  .field input,.field select{
    width:100%;padding:11px 13px;border:1px solid var(--line-strong);border-radius:11px;
    background:var(--paper);color:var(--ink);
  }
  .two{display:flex;gap:10px;align-items:flex-end}
  .two > *{flex:1}
  .switcher{display:flex;gap:9px;margin-top:11px}
  .switcher button{flex:1}
  .err{background:var(--clay-soft);color:var(--clay);border:1px solid #EED9CC;border-radius:11px;padding:10px 13px;font-size:14px;margin-bottom:13px}
  .danger-link{background:none;border:0;color:var(--clay);font-size:13.5px;font-weight:600;padding:10px 0;width:100%}
  .quiet-link{background:none;border:0;color:var(--muted);font-size:13.5px;font-weight:600;padding:10px 0;width:100%}

  #toast{
    position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:60;
    background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:var(--r-sm);
    font-size:13.5px;font-weight:600;box-shadow:var(--shadow-m);max-width:90vw;text-align:center;
  }
  [hidden]{display:none !important}
  .avatar-edit{display:flex;align-items:center;gap:14px;margin-bottom:16px}
  .avatar-edit img,.avatar-edit .avatar-fallback{width:60px;height:60px;font-size:21px}

  /* Team gegen Team */
  .tafel{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch;margin:0 0 15px}
  .tafel .seite{
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:7px;
    min-height:96px;width:100%;padding:11px 8px;text-align:center;
    background:var(--paper);border:1px solid var(--line);border-radius:12px;
    font:inherit;color:inherit;
  }
  .tafel button.seite:hover{border-color:var(--accent);background:var(--surface)}
  .tafel .seite h4{
    margin:0;font-family:var(--display);font-size:16px;font-weight:600;line-height:1.2;
    overflow-wrap:anywhere;hyphens:auto;
  }
  .tafel .seite .zahl{font-size:12.5px;color:var(--muted);line-height:1.3}
  .tafel .seite.offen{border-style:dashed;border-color:var(--line-strong)}
  .tafel .vs{
    display:flex;align-items:center;justify-content:center;
    font-family:var(--display);font-size:15px;color:var(--muted);padding:0 1px;
  }
  .tafel.gedaempft{opacity:.5}
  .zeichen{
    width:44px;height:44px;border-radius:12px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    background:var(--accent);color:#FFFFFF;
    font-family:var(--display);font-weight:600;font-size:16px;line-height:1;letter-spacing:.01em;
  }
  .zeichen.gast{background:var(--clay)}
  .zeichen.leer{background:var(--sand);color:var(--muted);border:2px dashed var(--line-strong)}
  .zeichen.klein{width:30px;height:30px;border-radius:9px;font-size:12px}
  .zeichen img{width:100%;height:100%;object-fit:cover;border-radius:10px;display:block}
  .zeichen.wappen{border:2px solid var(--accent);background:var(--surface);padding:0}
  .zeichen.wappen.gast{border-color:var(--clay)}

  .msg{--seite:var(--accent)}
  .msg.gastseite{--seite:var(--clay)}
  .msg.mit{align-self:flex-end;align-items:flex-end}
  .msg.mit .bubble{background:var(--surface);border:1px solid var(--line)}
  .msg.andere{align-self:flex-start;align-items:flex-start}
  .msg.andere .bubble{background:var(--sand)}
  .msg.tvt.rechts .bubble{border-left:3px solid var(--seite)}
  .msg.tvt.links .bubble{border-right:3px solid var(--seite)}
  .msg .meta .kappille{
    display:inline-block;margin-left:5px;padding:0 6px;border-radius:6px;
    background:var(--sand-deep);color:var(--muted);font-size:10.5px;font-weight:700;
  }

  .wahlzeile{
    display:flex;align-items:center;gap:11px;width:100%;min-height:52px;text-align:left;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:9px 12px;margin-bottom:8px;font:inherit;color:inherit;
  }
  .wahlzeile .wer{flex:1;min-width:0}
  .wahlzeile .wer strong{display:block;font-size:14.5px;font-weight:700;overflow-wrap:anywhere}
  .wahlzeile .wer span{display:block;font-size:12.5px;color:var(--muted)}
  .wahlzeile .haken{
    width:28px;height:28px;border-radius:9px;flex:0 0 auto;
    border:2px solid var(--line-strong);background:var(--surface);
    display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1;color:transparent;
  }
  .wahlzeile[aria-pressed="true"]{border-color:var(--accent)}
  .wahlzeile[aria-pressed="true"] .haken{background:var(--accent);border-color:var(--accent);color:#FFFFFF}
  .wahlzeile.blass{opacity:.45}
  .wahlzeile.gesperrt{opacity:.45;cursor:default}
  .wahlzeile.gesperrt .haken{color:var(--muted)}

  .info{
    background:var(--sand);color:var(--ink);border:1px solid var(--line-strong);
    border-radius:11px;padding:10px 13px;font-size:14px;margin-bottom:13px;
  }
  .skelett{
    background:var(--sand);border:1px solid var(--line);border-radius:var(--r);
    height:92px;margin-bottom:10px;opacity:.65;
  }
  .game .when .paar{
    display:block;font-size:13.5px;font-weight:600;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .aufklapp{
    display:flex;align-items:center;gap:10px;width:100%;min-height:48px;text-align:left;
    background:var(--paper);border:1px solid var(--line);border-radius:12px;
    padding:10px 13px;margin:0 0 13px;font:inherit;color:inherit;
  }
  .aufklapp:hover{border-color:var(--accent);background:var(--surface)}
  .aufklapp .pfeil{flex:0 0 auto;color:var(--muted);font-size:12px}
  .aufklapp .titel{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tvtkarte .kopf{display:flex;align-items:center;gap:10px;margin-bottom:3px}
  .tvtkarte .kopf .nam{flex:1;min-width:0;font-family:var(--display);font-size:17px;font-weight:600;
    letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tvtkarte .kopf .note{flex:0 0 auto;font-size:12.5px;color:var(--muted);white-space:nowrap}
  .tvtkarte .trenner{height:1px;background:var(--line);margin:10px 0}
  .chips.gruende{flex-wrap:wrap;overflow:visible}
  .chips.filterzeile{display:flex;gap:8px;margin:0 0 14px;overflow:visible}
  .chips.filterzeile select{flex:1 1 0;min-width:0}

  /* Platzzeile im Formular "Spiel anlegen" */
  .platzzeile{
    display:flex;align-items:center;gap:11px;width:100%;min-height:56px;text-align:left;
    background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;
    padding:9px 13px;margin:0 0 14px;font:inherit;color:inherit;
  }
  .platzzeile:hover{border-color:var(--accent)}
  .platzzeile.leer{border-style:dashed;border-color:var(--clay)}
  .platzzeile .nadel{flex:0 0 auto;color:var(--accent);display:block}
  .platzzeile .nadel svg{width:22px;height:22px;display:block}
  .platzzeile.leer .nadel{color:var(--clay)}
  .platzzeile .wo{flex:1;min-width:0}
  .platzzeile .wo strong{
    display:block;font-family:var(--display);font-size:17px;font-weight:600;
    letter-spacing:-.01em;line-height:1.2;overflow-wrap:anywhere;
  }
  .platzzeile .wo span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
  .platzzeile .wechsel{
    flex:0 0 auto;font-size:13px;font-weight:700;color:var(--accent-deep);
    text-decoration:underline;text-underline-offset:3px;
  }

  /* Erklaerkarte "Teams" ohne Team */
  .erklaer{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:16px 17px;margin:0 0 14px;box-shadow:var(--shadow-s);
  }
  .erklaer h3{font-family:var(--display);font-size:19px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
  .erklaer > p{margin:0 0 14px;font-size:14px;color:var(--muted)}
  .schritt{display:flex;align-items:flex-start;gap:11px;margin-bottom:12px}
  .schritt .nr{
    flex:0 0 auto;width:26px;height:26px;border-radius:50%;
    background:var(--accent-soft);color:var(--accent-deep);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--display);font-weight:600;font-size:14px;line-height:1;
  }
  .schritt .was{flex:1;min-width:0}
  .schritt .was strong{display:block;font-size:15px;font-weight:700}
  .schritt .was span{display:block;font-size:13px;color:var(--muted)}

  /* Profilkarte im Reiter "Profil" */
  .profilkarte{
    display:flex;align-items:center;gap:13px;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;
    margin:0 0 14px;box-shadow:var(--shadow-s);
  }
  .profilkarte .avatar,.profilkarte .avatar-fallback{width:52px;height:52px;font-size:19px}
  .profilkarte .wer{flex:1;min-width:0}
  .profilkarte .wer strong{
    display:block;font-family:var(--display);font-size:19px;font-weight:600;
    letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .profilkarte .wer span{display:block;font-size:13px;color:var(--muted)}

  /* ---------- Profil: erweiterte Ansicht ---------- */

  /* Faktenchips im Profilkopf: dunkle Schrift auf Weiss, damit sie
     in der Sonne lesbar bleiben - die graue Punktzeile war es nicht. */
  .badge.fakt{
    font-size:13px;padding:5px 11px;
    background:var(--surface);color:var(--ink);border-color:var(--line-strong);
  }

  /* Freitext "Ueber mich". Wird ausschliesslich per textContent gefuellt,
     nie per innerHTML - daher keine Links, kein HTML. */
  .freitext{
    background:var(--paper);border:1px solid var(--line);border-radius:12px;
    padding:11px 13px;margin:0 0 15px;
    font-size:14.5px;line-height:1.45;
    white-space:pre-wrap;overflow-wrap:anywhere;
  }

  /* Feste Kachelhoehe, damit das Statistikraster nicht springt,
     wenn statt der Quote "Noch zu wenige Spiele" darin steht. */
  .statbox{min-height:74px;display:flex;flex-direction:column;justify-content:center}
  .statbox .wenig{
    display:block;font-family:var(--display);font-size:14px;font-weight:600;
    line-height:1.2;color:var(--muted);margin-bottom:2px;
  }

  /* Melden und Blockieren nebeneinander, je 44 px hoch. */
  .fussaktionen{
    display:flex;gap:10px;margin:6px 0 0;padding-top:8px;border-top:1px solid var(--line);
  }
  .fussaktionen > *{flex:1 1 0;min-width:0;min-height:44px}
  .quiet-link,.danger-link{min-height:44px}

  /* Textfeld "Ueber mich". 16 px, sonst zoomt iOS beim Antippen hinein. */
  .field textarea{
    width:100%;min-height:96px;resize:vertical;
    padding:11px 13px;border:1px solid var(--line-strong);border-radius:11px;
    background:var(--paper);color:var(--ink);
    font-family:inherit;font-size:16px;line-height:1.45;
  }
  .zeichenzaehler{
    display:block;text-align:right;font-size:12.5px;color:var(--muted);margin:4px 0 0;
  }
  .zeichenzaehler.knapp{color:var(--clay)}

  /* Eigene Fotogalerie */
  .meinefotos{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
  .meinfoto{
    position:relative;width:96px;height:96px;flex:0 0 auto;
    border-radius:12px;overflow:hidden;background:var(--sand);border:1px solid var(--line);
  }
  .meinfoto img{width:100%;height:100%;object-fit:cover;display:block}
  .meinfoto .weg{
    position:absolute;top:0;right:0;width:44px;height:44px;padding:5px;
    background:none;border:0;display:flex;align-items:flex-start;justify-content:flex-end;
  }
  .meinfoto .weg span{
    width:26px;height:26px;border-radius:50%;background:rgba(46,42,36,.72);color:#FFFFFF;
    display:flex;align-items:center;justify-content:center;font-size:17px;line-height:1;
  }
  .fotoplus{
    width:96px;height:96px;flex:0 0 auto;
    border:2px dashed var(--line-strong);border-radius:12px;
    background:var(--paper);color:var(--accent-deep);
    font-size:28px;font-weight:600;line-height:1;
    display:flex;align-items:center;justify-content:center;
  }
  .fotoplus:hover{border-color:var(--accent)}

  /* Quadratische Vorschaubilder im fremden Profil */
  .bilder.quadrat .bild{width:96px;height:96px}

  /* Ruhiger Hinweiskasten mit fetter erster Zeile */
  .info b{display:block;font-weight:700;margin-bottom:3px}
  .info.warn{background:var(--clay-soft);border-color:#EED9CC;color:var(--clay)}

  /* Speichern klebt am unteren Rand des Panels, damit es bei
     langem Formular immer erreichbar bleibt. */
  .panelfuss{
    position:sticky;bottom:0;z-index:1;
    background:var(--surface);padding:10px 0 8px;margin-top:6px;
    box-shadow:0 -10px 14px -12px rgba(60,48,32,.5);
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    Joga<span>V</span>
  </div>
  <div class="grow"></div>
  <button id="themeBtn" class="ghost" type="button" aria-pressed="false"></button>
  <button id="langBtn" class="ghost" type="button">EN</button>
  <button id="accountBtn" type="button"><span class="ghost">Anmelden</span></button>
</header>

<div id="controls">
  <input id="search" type="search" autocomplete="off">
  <div class="filterrow">
    <select id="artSelect" class="chip"></select>
    <select id="district" class="chip"></select>
    <div class="dropdown" id="eigenschaftenDropdown">
      <button class="chip" type="button" id="eigenschaftenBtn" aria-haspopup="true" aria-expanded="false" aria-pressed="false"></button>
      <div class="dropdown-panel" id="eigenschaftenPanel" hidden>
        <label class="dropdown-item"><input type="checkbox" id="cbLit"><span id="cbLitText"></span></label>
        <label class="dropdown-item"><input type="checkbox" id="cbFree"><span id="cbFreeText"></span></label>
        <label class="dropdown-item"><input type="checkbox" id="cbGames"><span id="cbGamesText"></span></label>
      </div>
    </div>
  </div>
  <div class="statusline">
    <span id="count"></span>
    <div class="grow"></div>
    <button class="linkish" id="myGamesBtn" type="button" hidden></button>
    <button class="linkish" id="viewToggle" type="button"></button>
    <button class="linkish" id="resetBtn" type="button"></button>
    <button class="linkish" id="meldenBtn" type="button"></button>
  </div>
</div>

<main>
  <div id="map"></div>
  <div id="list" hidden></div>
  <div id="feed"></div>
</main>

<button id="fabNeu" type="button" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true">
    <path d="M12 5.5v13M5.5 12h13"/>
  </svg>
  <span id="fabNeuText">Spiel anlegen</span>
</button>

<nav id="tabbar">
  <button class="tab" type="button" id="tabKarte" aria-current="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 21.2s7-6.4 7-11.2a7 7 0 1 0-14 0c0 4.8 7 11.2 7 11.2z"/><circle cx="12" cy="10" r="2.6"/>
    </svg>
    <span id="tabKarteText">Karte</span>
  </button>
  <button class="tab" type="button" id="tabSpiele">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="8.6"/><path d="M12 7.4l3.4 2.5-1.3 4h-4.2l-1.3-4z"/>
      <path d="M12 3.4v4M20.2 9.9l-3.9 1.3M17 19.6l-2.5-3.3M7 19.6l2.5-3.3M3.8 9.9l3.9 1.3"/>
    </svg>
    <span id="tabSpieleText">Spiele</span>
  </button>
  <button class="tab" type="button" id="tabTeams">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3.2l7 2.2v6.1c0 4.2-2.9 7.4-7 9.3-4.1-1.9-7-5.1-7-9.3V5.4z"/>
      <path d="M9.2 11.9l2 2 3.6-4"/>
    </svg>
    <span id="tabTeamsText">Teams</span>
    <span class="punkt" id="punktTeams" hidden></span>
  </button>
  <button class="tab" type="button" id="tabFreunde">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="9" cy="8.5" r="2.6"/><path d="M3.8 19c0-3.3 2.3-5.6 5.2-5.6s5.2 2.3 5.2 5.6"/>
      <circle cx="17" cy="9.5" r="2.1"/><path d="M14.6 19c0-2.5 1.6-4.5 4-4.5 1.9 0 3.5 1.2 3.9 3"/>
    </svg>
    <span id="tabFreundeText">Freunde</span>
    <span class="punkt" id="punktFreunde" hidden></span>
  </button>
  <button class="tab" type="button" id="tabMeine">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3.5" y="5" width="17" height="15.5" rx="3.2"/><path d="M8 3v4M16 3v4M3.5 10h17"/>
      <path d="M9.4 14.9l1.9 1.9 3.4-3.6"/>
    </svg>
    <span id="tabMeineText">Meine</span>
    <span class="punkt" id="punktMeine" hidden></span>
  </button>
  <button class="tab" type="button" id="tabProfil">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="8.6" r="3.7"/><path d="M4.6 20.2c1.2-3.7 4-5.5 7.4-5.5s6.2 1.8 7.4 5.5"/>
    </svg>
    <span id="tabProfilText">Profil</span>
    <span class="punkt" id="punktProfil" hidden></span>
  </button>
</nav>

<aside id="sheet" aria-live="polite">
  <div class="sheet-head">
    <h2 id="sheetName"></h2>
    <button class="closebtn" id="sheetClose" type="button" aria-label="Schliessen">&times;</button>
  </div>
  <div class="badges" id="sheetBadges"></div>
  <div class="bilder" id="sheetBilder"></div>
  <div class="bildzeile">
    <span class="quelle" id="sheetBildQuelle"></span>
    <button class="linkish" id="sheetFotoBtn" type="button"></button>
    <input type="file" id="sheetFotoInput" accept="image/*" hidden>
  </div>

  function buildMap(){
    map = new maplibregl.Map({
      container: "map",
      style: {
        version: 8,
        sources: {
          basemap: {
            type: "raster",
            tiles: ["a","b","c","d"].map(function(s){
              return "https://" + s + ".basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}@2x.png";
            }),
            tileSize: 256,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>-Mitwirkende, &copy; <a href="https://carto.com/attributions">CARTO</a>'
          }
        },
        layers: [{ id: "basemap", type: "raster", source: "basemap" }]
      },
      center: [16.3738, 48.2082],
      zoom: 10.4,
      minZoom: 9,
      maxZoom: 19,
      attributionControl: true
    });
    map.on("error", function(e){ merkeFehler(e && e.error ? e.error : e); });
    // Unten rechts steht jetzt der Knopf "Spiel anlegen".
    map.addControl(new maplibregl.NavigationControl({ showCompass:false }), "bottom-left");
    geoControl = new maplibregl.GeolocateControl({
      positionOptions: { enableHighAccuracy: true },
      trackUserLocation: false,
      showAccuracyCircle: true,
      fitBoundsOptions: { maxZoom: 16 }
    });
    map.addControl(geoControl, "bottom-left");
    try {
      geoControl.on("geolocate", function(pos){
        standortSchonGeholt = true;
        try { localStorage.setItem("jogavia-geo", "1"); } catch(e){}
        try {
          if (pos && pos.coords){
            map.flyTo({
              center: [pos.coords.longitude, pos.coords.latitude],
              zoom: Math.max(map.getZoom(), 16.5),
              essential: true
            });
          }
        } catch(e){ merkeFehler(e); }
      });
      geoControl.on("error", function(e){ merkeFehler(e); });
    } catch(e){}

    map.on("load", function(){
      map.addSource("venues", {
        type: "geojson", data: toGeoJSON([]),
        cluster: true, clusterRadius: 46, clusterMaxZoom: 14,
        maxzoom: 20
      });
      map.addLayer({
        id: "clusters", type: "circle", source: "venues", filter: ["has","point_count"],
        paint: {
          "circle-color": "#0066CC",
          "circle-opacity": 0.85,
          "circle-radius": ["step", ["get","point_count"], 15, 5, 20, 20, 26, 60, 33],
          "circle-stroke-width": 2.5,
          "circle-stroke-color": "#FFFFFF"
        }
      });
      map.addLayer({
        id: "points", type: "circle", source: "venues", filter: ["!", ["has","point_count"]],
        paint: {
          "circle-color": ["match", ["get","art"],
            "kaefig", ARTCOLORS.kaefig, "rasen", ARTCOLORS.rasen, "kunstrasen", ARTCOLORS.kunstrasen,
            "halle", ARTCOLORS.halle, "beach", ARTCOLORS.beach, ARTCOLORS.sonstige],
          "circle-radius": ["interpolate", ["linear"], ["zoom"],
            10, ["case", ["==", ["get","spiel"], 1], 7.5, 4.5],
            14, ["case", ["==", ["get","spiel"], 1], 11, 7],
            17, ["case", ["==", ["get","spiel"], 1], 15, 11]],
          "circle-stroke-width": ["case", ["==", ["get","spiel"], 1], 3.5, 2],
          "circle-stroke-color": ["case", ["==", ["get","spiel"], 1], "#181818", "#FFFFFF"]
        }
      });
      map.addLayer({
        id: "selected", type: "circle", source: "venues",
        filter: ["==", ["get","id"], -1],
        paint: {
          "circle-color": "rgba(0,0,0,0)",
          "circle-radius": ["interpolate", ["linear"], ["zoom"], 10, 11, 17, 22],
          "circle-stroke-width": 3,
          "circle-stroke-color": "#2E2A24"
        }
      });

      map.on("click", function(e){
        if (pinModus){
          if (pinZweck === "neuesspiel"){
            var platzNeu = naechsterPlatz(e);
            if (!platzNeu){ toast(t("tvtKeinPlatz")); return; }
            pinModusAus();
            openModal(createPanel(platzNeu, "pin"));
            return;
          }
          if (pinZweck === "teamspiel"){
            var platz = naechsterPlatz(e);
            if (!platz){ toast(t("tvtKeinPlatz")); return; }
            var team = pinTeam;
            var rueck = pinRueckgabe;
            pinModusAus();
            openModal(ausschreibenPanel({
              venue: platz, team: team,
              match: rueck ? rueck.match : null,
              werte: rueck ? rueck.werte : null
            }));
            return;
          }
          pinModusAus();
          openModal(meldePanel("fehlt", null, [e.lngLat.lng, e.lngLat.lat]));
          return;
        }
        var r = 14;
        var box = [[e.point.x - r, e.point.y - r], [e.point.x + r, e.point.y + r]];
        var punkte = [];
        var cluster = [];
        try { punkte = map.queryRenderedFeatures(box, { layers:["points"] }); } catch(err){}
        try { cluster = map.queryRenderedFeatures(box, { layers:["clusters"] }); } catch(err){}
        if (punkte && punkte.length){
          var best = punkte[0];
          var minD = Infinity;
          punkte.forEach(function(f){
            var p = map.project(f.geometry.coordinates);
            var d = (p.x - e.point.x) * (p.x - e.point.x) + (p.y - e.point.y) * (p.y - e.point.y);
            if (d < minD){ minD = d; best = f; }
          });
          openSheet(Number(best.properties.id));
          return;
        }
        var besterPlatz = null;
        var minPixel = Infinity;
        filtered.forEach(function(v){
          try {
            var p = map.project([v.lon, v.lat]);
            var dx = p.x - e.point.x, dy = p.y - e.point.y;
            var d = dx * dx + dy * dy;
            if (d < minPixel){ minPixel = d; besterPlatz = v; }
          } catch(err){}
        });
        if (besterPlatz && minPixel <= 34 * 34 && map.getZoom() >= 13.5){
          openSheet(besterPlatz.id);
          return;
        }
        if (cluster && cluster.length){
          var c = cluster[0];
          var quelle = map.getSource("venues");
          var weiter = function(z){ map.easeTo({ center: c.geometry.coordinates, zoom: z }); };
          try {
            var erg = quelle.getClusterExpansionZoom(c.properties.cluster_id);
            if (erg && typeof erg.then === "function"){
              erg.then(weiter).catch(function(){ weiter(map.getZoom() + 2); });
            } else {
              weiter(map.getZoom() + 2);
            }
          } catch(err){
            weiter(map.getZoom() + 2);
          }
        }
      });
      ["clusters","points"].forEach(function(layer){
        map.on("mouseenter", layer, function(){ map.getCanvas().style.cursor = "pointer"; });
        map.on("mouseleave", layer, function(){ map.getCanvas().style.cursor = ""; });
      });

      map.on("moveend", updateMarkers);
      map.on("zoomend", updateMarkers);

      mapReady = true;
      pushToMap();
      if (ansicht === "karte") standortAutomatisch();
    });
  }

  function standortAutomatisch(){
    function ausloesen(){
      setTimeout(function(){
        try { if (geoControl) geoControl.trigger(); } catch(e){ merkeFehler(e); }
      }, 800);
    }
    var schonErlaubt = false;
    try { schonErlaubt = localStorage.getItem("jogavia-geo") === "1"; } catch(e){}

    if (navigator.permissions && navigator.permissions.query){
      navigator.permissions.query({ name: "geolocation" }).then(function(status){
        if (status.state === "granted") ausloesen();
        try {
          status.onchange = function(){ if (status.state === "granted") ausloesen(); };
        } catch(e){}
      }).catch(function(){ if (schonErlaubt) ausloesen(); });
    } else if (schonErlaubt){
      ausloesen();
    }
  }

  function updateMarkers(){
    if (!mapReady || !map) return;
    var nah = map.getZoom() >= MARKER_AB_ZOOM;
    try { map.setLayoutProperty("points", "visibility", nah ? "none" : "visible"); } catch(e){}

    marker.forEach(function(m){ try { m.remove(); } catch(e){} });
    marker = [];
    if (!nah) return;

    var b;
    try { b = map.getBounds(); } catch(e){ return; }
    var sichtbar = filtered.filter(function(v){
      return v.lon >= b.getWest() && v.lon <= b.getEast() &&
             v.lat >= b.getSouth() && v.lat <= b.getNorth();
    }).slice(0, 60);

    sichtbar.forEach(function(v){
      var wrap = make("div","pinmark");
      if (venuesWithGames[v.id]) wrap.classList.add("mit-spiel");
      var bild = document.createElement("img");
      bild.src = "logo.svg";
      bild.alt = "";
      wrap.appendChild(bild);
      wrap.appendChild(make("span","pinname", v.name));
      wrap.addEventListener("click", function(ev){
        ev.stopPropagation();
        openSheet(v.id);
      });
      try {
        marker.push(new maplibregl.Marker({ element: wrap, anchor: "bottom-left", offset: [-15, 2] })
          .setLngLat([v.lon, v.lat]).addTo(map));
      } catch(e){ merkeFehler(e); }
    });
  }

  function toGeoJSON(rows){
    return {
      type: "FeatureCollection",
      features: rows.map(function(v){
        return {
          type: "Feature",
          geometry: { type:"Point", coordinates:[v.lon, v.lat] },
          properties: { id: v.id, art: v.art, spiel: venuesWithGames[v.id] ? 1 : 0 }
        };
      })
    };
  }

  function pushToMap(){
    if (!mapReady || !map.getSource("venues")) return;
    map.getSource("venues").setData(toGeoJSON(filtered));
    map.setFilter("selected", ["==", ["get","id"], selectedId === null ? -1 : selectedId]);
    updateMarkers();
  }

  function districtName(nr){
    if (!nr || nr < 1 || nr > 23) return "";
    return nr + ". " + DISTRICTS[nr - 1];
  }

  function applyFilters(){
    var q = query.trim().toLowerCase();
    filtered = venues.filter(function(v){
      if (filterArt && v.art !== filterArt) return false;
      if (filterLit && v.beleuchtung !== true) return false;
      if (filterFree && v.zugang !== "frei") return false;
      if (filterGames && !venuesWithGames[v.id]) return false;
      if (filterDistrict && v.bezirk !== filterDistrict) return false;
      if (q){
        var hay = (v.name + " " + districtName(v.bezirk)).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
    var n = filtered.length;
    el("count").textContent = n === 0 ? t("countNone") : (n === 1 ? t("countOne") : t("countMany", n));
    pushToMap();
    if (listMode) renderList();
  }

  function tagKopf(iso){
    var d = new Date(iso);
    var heute = new Date();
    var morgen = new Date(Date.now() + 86400000);
    function gleich(a, b){
      return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
    }
    if (gleich(d, heute)) return t("heute");
    if (gleich(d, morgen)) return t("morgen");
    try {
      return new Intl.DateTimeFormat(lang === "de" ? "de-AT" : "en-GB",
        { weekday: "long", day: "numeric", month: "long", timeZone: "Europe/Vienna" }).format(d);
    } catch(e){ return d.toLocaleDateString(); }
  }

  function uhrText(iso){
    return uhrzeit(iso) + (lang === "de" ? " Uhr" : "");
  }

  function uhrzeit(iso){
    try {
      return new Intl.DateTimeFormat(lang === "de" ? "de-AT" : "en-GB",
        { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Vienna" }).format(new Date(iso));
    } catch(e){ return ""; }
  }

  // renderFeed ist nur noch die Weiche. Jeder Reiter hat seine eigene Funktion.
  function renderFeed(){
    if (ansicht === "teams"){ renderTeams(); return; }
    if (ansicht === "freunde"){ renderFreundeSeite(); return; }
    if (ansicht === "profil"){ renderProfil(); return; }
    if (ansicht === "meine"){ renderMeine(); return; }
    renderSpiele();
  }

  // ---------- Reiter "Spiele": was heute laeuft ----------

  function renderSpiele(){
    var box = el("feed");
    clear(box);

    var liste = games.filter(function(g){
      // In "Was heute laeuft" erscheinen Team-Spiele nicht.
      if (istTeamSpiel(g)) return false;
      if (nurFreiePlaetze && (g.plaetze_gesamt || 0) - (g.zugesagt || 0) <= 0) return false;
      return true;
    });

    box.appendChild(make("h2","feedkopf", t("feedTitel")));
    box.appendChild(make("p","feedsub",
      liste.length === 0 ? t("keineSpiele") : (liste.length === 1 ? t("spielAnzahl") : t("spieleAnzahl", liste.length))));

    var chips = make("div","chips");
    chips.style.marginBottom = "6px";
    var alle = make("button","chip", t("alleSpiele"));
    alle.type = "button";
    alle.setAttribute("aria-pressed", nurFreiePlaetze ? "false" : "true");
    alle.addEventListener("click", function(){ nurFreiePlaetze = false; renderFeed(); });
    var frei = make("button","chip", t("nurFrei"));
    frei.type = "button";
    frei.setAttribute("aria-pressed", nurFreiePlaetze ? "true" : "false");
    frei.addEventListener("click", function(){ nurFreiePlaetze = true; renderFeed(); });
    chips.appendChild(alle);
    chips.appendChild(frei);
    box.appendChild(chips);

    if (!liste.length){
      box.appendChild(make("p","muted-line", t("feedLeer")));
      box.appendChild(make("p","muted-line", t("feedLeerHinweis")));
      var hin = make("button","btn", t("feedZurKarte"));
      hin.type = "button";
      hin.addEventListener("click", function(){ zeigeAnsicht("karte"); });
      box.appendChild(hin);
      return;
    }

    tagGruppen(box, liste);
  }

  function tagGruppen(box, liste){
    var letzterTag = null;

  // "Aufstellung 3 von 5" rechts in der Zeile; ab 24 Stunden vor Anpfiff in
  // Terracotta, wenn noch zu wenige gemeldet sind.
  function unsereSpielZeile(x){
    var zeile = gameRow(tvtZeilenSatz(x), true);
    var eigene = x.wir_sind_heim ? x.heim_aufgestellt : x.gast_aufgestellt;
    if (eigene === null || eigene === undefined) return zeile;
    var soll = x.soll_groesse || formatGroesse(x.format);
    var pille = make("span","pill",
      t("tvtAufstellungKurz") + " " + vonZahl(eigene, soll));
    var knapp = (new Date(x.beginn).getTime() - Date.now()) < 24 * 3600 * 1000;
    if (knapp && eigene < soll) pille.classList.add("warn");
    var rechts = zeile.querySelector(".right");
    if (rechts){
      // Im Reiter "Teams" ist jedes Spiel unseres - die Pille "Euer Spiel"
      // waere hier nur eine vierte Zeile ohne Aussage.
      Array.prototype.slice.call(rechts.children).forEach(function(k){
        if (k.textContent === t("tvtEuerSpiel")) rechts.removeChild(k);
      });
      rechts.appendChild(pille);
    } else {
      zeile.appendChild(pille);
    }
    return zeile;
  }

  function spielerSuchen(){
    var text = suchText.trim();
    var box = el("suchergebnis");
    if (!box) return;
    clear(box);
    if (text.length < 2){ box.appendChild(make("p","muted-line", t("mindestensZwei"))); return; }
    // Suche laeuft ueber spieler_suchen(): dort werden Blockierte, bestehende
    // Freundschaften und verborgene Bilder schon in der Datenbank beruecksichtigt.
    sb.rpc("spieler_suchen", { p_text: text })
      .then(function(res){
        clear(box);
        var treffer = (res.data || []).filter(function(p){
          if (p.id === session.user.id) return false;
          if (blockedSet[p.id]) return false;
          return !freunde.some(function(f){ return f.partner_id === p.id && f.status !== "abgelehnt"; });
        });
        if (!treffer.length){ box.appendChild(make("p","muted-line", t("keinTreffer"))); return; }
        treffer.forEach(function(p){
          box.appendChild(personZeile(p, [
            { text: t("anfragen"), tun: function(){ anfrageSenden(p.id); } }
          ]));
        });
      });
  }

  // Eigener Reiter "Freunde". Wird nach jeder Aenderung an den Freunden
  // gerufen und zeichnet nur neu, wenn der Reiter gerade offen ist.
  function renderFreunde(){
    if (ansicht === "freunde") renderFreundeSeite();
    punkteSetzen();
  }

  var suchTimer = null;

  function renderFreundeSeite(){
    var box = el("feed");
    clear(box);
    box.appendChild(make("h2","feedkopf", t("freundeTitel")));

    if (!session){
      box.appendChild(make("p","muted-line", t("anmeldenFuerFreunde")));
      var anmelden = make("button","btn", t("signIn"));
      anmelden.type = "button";
      anmelden.addEventListener("click", function(){ openModal(authPanel("login")); });
      box.appendChild(anmelden);
      return;
    }

    var zeile = make("div","suchzeile");
    var feld = input("f-suche","search", t("freundeSuchen"));
    feld.value = suchText;
    // Vorschlaege laufen live mit, nicht erst nach einem Knopfdruck - mit
    // kurzer Wartezeit, damit nicht bei jedem Tastenanschlag eine Anfrage lossaust.
    feld.addEventListener("input", function(e){
      suchText = e.target.value;
      if (suchTimer) clearTimeout(suchTimer);
      suchTimer = setTimeout(spielerSuchen, 300);
    });
    feld.addEventListener("keydown", function(e){
      if (e.key === "Enter"){
        if (suchTimer) clearTimeout(suchTimer);
        spielerSuchen();
      }
    });
    zeile.appendChild(feld);
    box.appendChild(zeile);

    var ergebnis = make("div");
    ergebnis.id = "suchergebnis";
    box.appendChild(ergebnis);
    if (suchText.trim().length >= 2) spielerSuchen();

    var erhalten = freunde.filter(function(f){ return f.status === "angefragt" && f.richtung === "erhalten"; });
    if (erhalten.length){
      box.appendChild(make("p","tagkopf", t("offeneAnfragen")));
      erhalten.forEach(function(f){
        box.appendChild(personZeile(f, [
          { text: t("annehmen"), tun: function(){ anfrageAntwort(f.id, true); } },
          { text: t("ablehnen"), leise: true, tun: function(){ anfrageAntwort(f.id, false); } }
        ]));
      });
    }

    var gesendet = freunde.filter(function(f){ return f.status === "angefragt" && f.richtung === "gesendet"; });
    if (gesendet.length){
      box.appendChild(make("p","tagkopf", t("gesendeteAnfragen")));
      gesendet.forEach(function(f){
        box.appendChild(personZeile(f, [
          { text: t("wartet"), leise: true, tun: function(){ freundEntfernen(f.id); } }
        ]));
      });
    }

    var bestaetigt = freunde.filter(function(f){ return f.status === "bestaetigt"; });
    box.appendChild(make("p","tagkopf", t("deineFreunde")));
    if (!bestaetigt.length){
      box.appendChild(make("p","muted-line", t("nochKeineFreunde")));
      return;
    }
    bestaetigt.forEach(function(f){
      box.appendChild(personZeile(f, [
        { text: t("schreiben"), tun: function(){ openModal(dmPanel(f)); } },
        { text: t("einladen"), leise: true, tun: function(){ openModal(einladenPanel(f)); } }
      ]));
    });
  }

      dmChannel = null;

  function dmPanel(freund){
    return function(panel){
      clear(panel);
      panel.appendChild(make("h2", null, freund.anzeigename || "—"));
      panel.appendChild(make("p","lead", [districtName(freund.bezirk),
        freund.niveau ? t(LVLKEY[freund.niveau] || "lvlFreizeit") : null].filter(Boolean).join(" · ")));

      var box = make("div","chat");
      panel.appendChild(box);
      var gesehen = {};
      var leer = null;
      var wartend = [];
      var letzteZeit = null;

      function eigeneSofort(text){
        if (leer){ box.removeChild(leer); leer = null; }
        var wrap = make("div","msg own wartet");
        var wann = "";
        try {
          wann = new Intl.DateTimeFormat(lang === "de" ? "de-AT" : "en-GB",
            { hour:"2-digit", minute:"2-digit", timeZone:"Europe/Vienna" }).format(new Date());
        } catch(e){}
        wrap.appendChild(make("div","meta", t("profile") + " · " + wann));
        wrap.appendChild(make("div","bubble", text));
        box.appendChild(wrap);
        box.scrollTop = box.scrollHeight;
        wartend.push({ text: text, el: wrap });
        return wrap;
      }

      function zeile(m){
        if (!m || gesehen[m.id]) return;
        gesehen[m.id] = true;
        if (!letzteZeit || m.gesendet_am > letzteZeit) letzteZeit = m.gesendet_am;
        var eigen = m.von_id === session.user.id;
        if (eigen){
          for (var w = 0; w < wartend.length; w++){
            if (wartend[w].text === m.text){

  function naechsterPlatz(e){
    var bester = null, minPixel = Infinity;
    filtered.forEach(function(v){
      try {
        var pt = map.project([v.lon, v.lat]);
        var dx = pt.x - e.point.x, dy = pt.y - e.point.y;
        var d = dx * dx + dy * dy;
        if (d < minPixel){ minPixel = d; bester = v; }
      } catch(err){}
    });
    return (bester && minPixel <= 44 * 44) ? bester : null;
  }

  var LUFT_WIEN = "https://maps.wien.gv.at/wmts/lb/farbe/google3857/";

  function luftbildKacheln(box, lat, lon, z, w, h){
    var TS = 256, n = Math.pow(2, z);
    var wx = (lon + 180) / 360 * n * TS;
    var s = Math.sin(lat * Math.PI / 180);
    var wy = (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * n * TS;
    var links = wx - w / 2, oben = wy - h / 2;
    var x0 = Math.floor(links / TS), x1 = Math.floor((links + w - 1) / TS);
    var y0 = Math.floor(oben / TS), y1 = Math.floor((oben + h - 1) / TS);
    for (var x = x0; x <= x1; x++){
      for (var y = y0; y <= y1; y++){
        var img = document.createElement("img");
        img.alt = ""; img.loading = "lazy";
        img.style.left = Math.round(x * TS - links) + "px";
        img.style.top = Math.round(y * TS - oben) + "px";
        img.setAttribute("data-zweit", LUFT_AT + z + "/" + y + "/" + x + ".jpeg");
        img.addEventListener("error", function(){
          var u = this.getAttribute("data-zweit");
          if (u){ this.setAttribute("data-zweit", ""); this.src = u; }
        });
        img.src = LUFT_WIEN + z + "/" + y + "/" + x + ".jpeg";
        box.appendChild(img);
      }
    }
  }

  function galeriePanel(v, start){
    return function(panel){

      var fuss = make("div");
      panel.appendChild(fuss);

      var zu = make("button","quiet-link", t("cancel"));
      zu.type = "button";
      zu.addEventListener("click", closeModal);
      panel.appendChild(zu);

      function zeichne(){
        var e = eintraege[pos];
        clear(rahmen);
        clear(fuss);
        rahmen.className = "grossbild" + (e.typ === "luft" ? "" : " foto");
        zaehler.textContent = (pos + 1) + " / " + eintraege.length;
        zurueckKn.disabled = (pos === 0);
        vorKn.disabled = (pos === eintraege.length - 1);

        if (e.typ === "luft"){
          lead.textContent = t("luftbild");
          luftbildKacheln(rahmen, v.lat, v.lon, e.zoom, rahmen.clientWidth || 340, 240);
          fuss.appendChild(make("p","hint", t("fotoQuelle")));
          return;
        }

        var img = document.createElement("img");
        img.alt = "";
        rahmen.appendChild(img);

        if (e.typ === "foto"){
          var f = e.foto;
          img.src = fotoUrl(f.pfad);
          lead.textContent = t("fotoVon", f.anzeigename || "—");
          if (session && f.user_id === session.user.id){
            var weg = make("button","danger-link", t("fotoLoeschen"));
            weg.type = "button";
            weg.addEventListener("click", function(){
              if (!window.confirm(t("fotoLoeschenAsk"))) return;
              sb.from("venue_fotos").delete().eq("id", f.id).then(function(){
                sb.storage.from("venues").remove([f.pfad]);
                closeModal();
                ladeFotos(v.id).then(function(){ if (selectedId === v.id) renderBilder(v); });
              });
            });
            fuss.appendChild(weg);
          } else if (session){
            var mel = make("button","quiet-link", t("reportBtn"));
            mel.type = "button";
            mel.addEventListener("click", function(){
              openModal(reportPanel("foto", f.id, galeriePanel(v, pos)));
            });
            fuss.appendChild(mel);
          }
          return;
        }

        var pf = e.park;
        img.src = pf.gross || pf.vorschau;
        lead.textContent = t("parkfotoHinweis");
        fuss.appendChild(make("p","hint",
          [pf.urheber ? t("fotoVon", pf.urheber) : null, pf.lizenz].filter(Boolean).join(" · ")));
        if (pf.seite){
          var link = document.createElement("a");
          link.className = "quiet-link"; link.href = pf.seite;
          link.target = "_blank"; link.rel = "noopener";
          link.textContent = t("commonsLink");
          link.style.display = "block";
          link.style.textAlign = "center";
          fuss.appendChild(link);
        }
      }

      function blaettern(schritt){
        var neu = pos + schritt;
        if (neu < 0 || neu >= eintraege.length) return;
        pos = neu;
        zeichne();
      }
      zurueckKn.addEventListener("click", function(){ blaettern(-1); });
      vorKn.addEventListener("click", function(){ blaettern(1); });

      var startX = null, startY = null;
      rahmen.addEventListener("touchstart", function(ev){
        if (!ev.touches || ev.touches.length !== 1) return;
        startX = ev.touches[0].clientX;
        startY = ev.touches[0].clientY;
      }, { passive: true });
      rahmen.addEventListener("touchend", function(ev){
        if (startX === null || !ev.changedTouches) return;
        var dx = ev.changedTouches[0].clientX - startX;
        var dy = ev.changedTouches[0].clientY - startY;
        startX = null; startY = null;
        if (Math.abs(dx) < 45 || Math.abs(dx) < Math.abs(dy)) return;
        blaettern(dx < 0 ? 1 : -1);
      }, { passive: true });

      zeichne();
    };
  }

  // Nach unten wischen schliesst Fenster (Sheet, Modal) - wie "zurueck".
  // Reagiert nur, wenn ganz oben gescrollt ist, sonst wuerde normales
  // Scrollen im Inhalt (Chat, Kader, Fotoliste) staendig unterbrochen.
  function wischZumSchliessen(elem, schliessen){
    var startY = null, startScrollTop = 0, ziehtGerade = false;
    elem.addEventListener("touchstart", function(ev){
      if (!ev.touches || ev.touches.length !== 1) return;
      startY = ev.touches[0].clientY;
      startScrollTop = elem.scrollTop;
      ziehtGerade = false;
    }, { passive: true });
    elem.addEventListener("touchmove", function(ev){
      if (startY === null || !ev.touches) return;
      var dy = ev.touches[0].clientY - startY;
      if (startScrollTop <= 0 && dy > 0){
        if (!ziehtGerade){ ziehtGerade = true; elem.style.transition = "none"; }
        elem.style.transform = "translateY(" + Math.min(dy, 280) + "px)";
      }
    }, { passive: true });
    function ende(ev){
      if (startY === null) return;
      var wollteZiehen = ziehtGerade;
      var dy = 0;
      try { dy = ev.changedTouches[0].clientY - startY; } catch(e){}
      startY = null;
      ziehtGerade = false;
      if (!wollteZiehen) return;
      elem.style.transition = "transform .18s ease";
      if (dy > 90){
        elem.style.transform = "translateY(120%)";
        setTimeout(function(){ schliessen(); elem.style.transform = ""; elem.style.transition = ""; }, 160);
      } else {
        elem.style.transform = "";
        setTimeout(function(){ elem.style.transition = ""; }, 200);
      }
    }
    elem.addEventListener("touchend", ende);
    elem.addEventListener("touchcancel", ende);
  }

  // Rechts-Wisch = derselbe Knopf, der schon "zurueck" oder "schliessen"
  // macht - jedes Panel weiss selbst, wohin es zurueckgeht. Kein eigener
  // Stapel noetig, nur ein Antippen des vorhandenen Knopfs simulieren.
  // Faengt der Wisch auf dem Grossbild einer Galerie an, macht die Galerie
  // ihr eigenes Vor/Zurueck - dort greift dieser Wisch nicht ein.
  function panelZurueckKnopf(){
    var text = t("cancel");
    var kandidaten = el("panel").querySelectorAll(".quiet-link");
    for (var i = 0; i < kandidaten.length; i++){
      if (kandidaten[i].textContent === text) return kandidaten[i];
    }
    return null;
  }

  function wischZurueck(elem){
    var startX = null, startY = null, inGalerie = false;
    elem.addEventListener("touchstart", function(ev){
      if (!ev.touches || ev.touches.length !== 1) return;
      inGalerie = !!(ev.target.closest && ev.target.closest(".grossbild"));
      startX = ev.touches[0].clientX;
      startY = ev.touches[0].clientY;
    }, { passive: true });
    elem.addEventListener("touchend", function(ev){
      if (startX === null || inGalerie){ startX = null; return; }
      var dx = 0, dy = 0;
      try {
        dx = ev.changedTouches[0].clientX - startX;
        dy = ev.changedTouches[0].clientY - startY;
      } catch(e){}
      startX = null;
      if (dx > 80 && Math.abs(dx) > Math.abs(dy) * 1.5){
        var knopf = panelZurueckKnopf();
        if (knopf) knopf.click();
      }
    });
  }

      pass.autocomplete = mode === "register" ? "new-password" : "current-password";

      var go = make("button","btn", mode === "register" ? t("createAccount") : t("doLogin"));
      go.type = "button";
      go.addEventListener("click", function(){
        msg.hidden = true;
        var jahr = null;
        if (mode === "register"){
          if (nameIn.value.trim().length < 2){ msg.textContent = t("needName"); msg.hidden = false; return; }
          jahr = parseInt(yearIn.value, 10);
          if (!jahr || jahr < 1930 || jahr > new Date().getFullYear()){
            msg.textContent = t("needYear"); msg.hidden = false; return;
          }
          if (new Date().getFullYear() - jahr < 14){
            msg.textContent = t("minAge"); msg.hidden = false; return;
          }
        }
        go.disabled = true;
        var call = mode === "register"
          ? sb.auth.signUp({
              email: mail.value.trim(),
              password: pass.value,
              options: {
                emailRedirectTo: BESTAETIGT_URL,
                data: { anzeigename: nameIn.value.trim(), geburtsjahr: jahr }
              }
            })
          : sb.auth.signInWithPassword({ email: mail.value.trim(), password: pass.value });
        call.then(function(res){
          go.disabled = false;
          if (res.error){ msg.textContent = res.error.message; msg.hidden = false; return; }
          if (!res.data.session){
            clear(panel);
            panel.appendChild(make("h2", null, t("mailSentTitle")));
            panel.appendChild(make("p","lead", t("mailSentLead")));
            var ok = make("button","btn", t("cancel"));
            ok.type = "button";

            panel.appendChild(ok);
            return;

          if (mode === "register"){
            profile = null;
            openModal(profilePanel(true), true);
          } else {
            closeModal();
          }
        }).catch(function(e){
          go.disabled = false; msg.textContent = String(e); msg.hidden = false;
        });
      });
      panel.appendChild(go);

      if (mode !== "register"){
        var vergessen = make("button","quiet-link", t("pwVergessen"));
        vergessen.type = "button";
        vergessen.addEventListener("click", function(){ openModal(pwResetPanel(mail.value.trim())); });
        panel.appendChild(vergessen);

      var sw = make("div","switcher");
      var other = make("button","btn secondary", mode === "register" ? t("haveAccount") : t("noAccount"));
      other.type = "button";
      other.addEventListener("click", function(){ openModal(authPanel(mode === "register" ? "login" : "register")); });
      sw.appendChild(other);
      panel.appendChild(sw);

      var quit = make("button","quiet-link", t("cancel"));
      quit.type = "button";
      quit.addEventListener("click", closeModal);
      panel.appendChild(quit);
    };

  function profilFotoFreigabePanel(zurueck){
    return function(panel){
      clear(panel);
      panel.appendChild(make("h2", null, t("profilFreigabeTitel")));
      panel.appendChild(make("p","lead", t("profilFreigabeLead")));
