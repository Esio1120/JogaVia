<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF6EF">
<meta name="color-scheme" content="light">
<title>JogaVia — Registrierung bestätigt</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap">
<style>
  :root{
    color-scheme: light;
    --paper:#FAF6EF; --surface:#FFFFFF; --sand:#F3EDE2;
    --ink:#2E2A24; --muted:#7B7165; --line:#E7DFD1; --line-strong:#D6C9B4;
    --accent:#4B7F5B; --accent-deep:#3B6748; --accent-soft:#E8F0E7;
    --clay:#A65A3A; --clay-soft:#F7EAE2;
    --display:"Fraunces",Georgia,"Times New Roman",serif;
    --ui:"Karla",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;background:var(--paper);color:var(--ink);
    font-family:var(--ui);font-size:16px;line-height:1.55;
    display:flex;align-items:center;justify-content:center;padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:20px;
    box-shadow:0 2px 6px rgba(60,48,32,.07), 0 20px 40px -26px rgba(60,48,32,.4);
    max-width:440px;width:100%;padding:36px 28px 30px;text-align:center;
  }
  .logo{width:74px;height:74px;display:block;margin:0 auto 18px}
  .wordmark{
    font-family:var(--display);font-weight:600;font-size:27px;letter-spacing:-.015em;
    margin:0 0 26px;color:var(--ink);
  }
  .wordmark span{color:var(--accent)}
  .tick{
    width:56px;height:56px;border-radius:50%;background:var(--accent-soft);
    display:flex;align-items:center;justify-content:center;margin:0 auto 16px;
  }
  .tick svg{width:28px;height:28px}
  h1{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.2;margin:0 0 10px;letter-spacing:-.015em}
  p{margin:0 0 22px;color:var(--muted);font-size:15.5px}
  .btn{
    display:block;width:100%;text-decoration:none;text-align:center;
    background:var(--accent);color:#FFFFFF;border:0;border-radius:12px;
    padding:14px;font-weight:700;font-size:16px;font-family:var(--ui);
  }
  .btn:hover{background:var(--accent-deep)}
  .fine{font-size:13px;color:var(--muted);margin:18px 0 0}
  .fehler .tick{background:var(--clay-soft)}
  .fehler h1{color:var(--clay)}
  [hidden]{display:none !important}
</style>
</head>
<body>
  <div class="card" id="karte">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
      <path d="M32 3C19.8 3 10 12.5 10 24.2c0 15.6 19.6 34 20.4 34.8.9.9 2.3.9 3.2 0C34.4 58.2 54 39.8 54 24.2 54 12.5 44.2 3 32 3z" fill="#4B7F5B"/>
      <circle cx="32" cy="24" r="12.5" fill="#FAF6EF"/>
      <path d="M32 17.2l5.4 3.9-2.1 6.4h-6.6l-2.1-6.4z" fill="#4B7F5B"/>
      <g stroke="#4B7F5B" stroke-width="2.3" stroke-linecap="round" fill="none">
        <path d="M32 11.9v5.3"/><path d="M43.6 20.6l-5.1 1.6"/><path d="M39.3 34.4l-3.2-4.3"/>
        <path d="M24.7 34.4l3.2-4.3"/><path d="M20.4 20.6l5.1 1.6"/>
      </g>
    </svg>
    <p class="wordmark">Joga<span>Via</span></p>

    <div id="erfolg">
      <div class="tick">
        <svg viewBox="0 0 24 24" fill="none" stroke="#3B6748" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 12.5l5.5 5.5L20 6.5"/>
        </svg>
      </div>
      <h1 id="titel">Registrierung erfolgreich</h1>
      <p id="text">Deine E-Mail-Adresse ist bestätigt. Ab jetzt kannst du Spielen beitreten und selbst welche organisieren.</p>
      <a class="btn" href="./" id="knopf">Zur Karte</a>
      <p class="fine" id="fussnote">Tipp: Leg dir JogaVia über „Zum Home-Bildschirm" auf dein Handy, dann startet die App wie jede andere.</p>
    </div>
  </div>

<script>
(function(){
  var lang = (navigator.language || "de").slice(0,2) === "en" ? "en" : "de";
  var TEXTE = {
    de: {
      titel: "Registrierung erfolgreich",
      text: "Deine E-Mail-Adresse ist bestätigt. Ab jetzt kannst du Spielen beitreten und selbst welche organisieren.",
      knopf: "Zur Karte",
      fuss: "Tipp: Leg dir JogaVia über „Zum Home-Bildschirm“ auf dein Handy, dann startet die App wie jede andere.",
      fehlerTitel: "Der Link hat nicht funktioniert",
      fehlerText: "Vermutlich ist er abgelaufen oder wurde schon benutzt. Öffne die App und melde dich an — wenn nötig, schicken wir dir eine neue E-Mail.",
      fehlerKnopf: "Zur App"
    },
    en: {
      titel: "You are all set",
      text: "Your email address is confirmed. From now on you can join games and organise your own.",
      knopf: "Go to the map",
      fuss: "Tip: add JogaVia to your home screen and it starts like any other app.",
      fehlerTitel: "That link did not work",
      fehlerText: "It has probably expired or was already used. Open the app and sign in — we can send you a new email if needed.",
      fehlerKnopf: "Go to the app"
    }
  };
  var T = TEXTE[lang];
  document.documentElement.lang = lang;

  var hash = window.location.hash || "";
  var such = window.location.search || "";
  var fehler = hash.indexOf("error") !== -1 || such.indexOf("error") !== -1;

  if (fehler){
    document.getElementById("karte").className = "card fehler";
    document.getElementById("titel").textContent = T.fehlerTitel;
    document.getElementById("text").textContent = T.fehlerText;
    document.getElementById("knopf").textContent = T.fehlerKnopf;
    document.getElementById("fussnote").hidden = true;
    var tick = document.querySelector(".tick svg");
    if (tick) tick.setAttribute("stroke", "#A65A3A");
    if (tick) tick.innerHTML = '<path d="M12 6v8"/><path d="M12 18h.01"/>';
  } else {
    document.getElementById("titel").textContent = T.titel;
    document.getElementById("text").textContent = T.text;
    document.getElementById("knopf").textContent = T.knopf;
    document.getElementById("fussnote").textContent = T.fuss;
  }
})();
</script>
</body>
</html>
